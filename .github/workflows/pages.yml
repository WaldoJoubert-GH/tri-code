# Publish the product page (site/) to GitHub Pages. The screenshots and the
# icon are copied in from docs/ and assets/ so there is one copy of each.
#
# Needs Pages turned on once with "GitHub Actions" as the source
# (Settings › Pages).

name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "assets/icon.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp -r docs/screenshots _site/screenshots
          cp assets/icon.svg _site/icon.svg

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
