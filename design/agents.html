<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tri-code · agents settings prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser
  (or visit /design/agents.html on the dev server). Needs the network once for lucide
  (unpkg); without it icons fall back to their names.

  Question: "Where and how do you add your own agents / terminal apps?" An agent is
  four things: a name, a shell command, a lucide icon and a hotkey. Today the list is
  hard-coded (state.ts TAB_COMMANDS: claude, pi, shell) and the New Window Menu, the
  Tab Strip glyphs and Alt+Enter all read from it.

  Three variants, A–C, switchable from the floating bar (also ← / → when no field is
  focused). URL keeps the choice: agents.html?variant=B (served) or agents.html#B (file://).
  Every variant edits the same in-memory agent list; the + menu, the tab strip and the
  hotkeys follow it live, so you can add "codex", give it Alt+X and press Alt+X.
  "{} state" on the bar shows what would land in state.json.

  OUTCOME (settled): variant B — the agents window, a canvas Window with an editable table.
  It shipped in src/AgentsPanel.tsx (styles in src/agents.css), with the list in state.ts
  (`agents`, TabKind "term" + "agents"), chord checks and launching in src/agents.ts, the
  icon picker in src/lucide.tsx and Alt+; plus agent hotkeys in src/hotkeys.ts.

  A  Settings dialog         (master/detail modal, like the Open Project Dialog)
  B  Settings window         (a canvas Window with an editable table, like Issues)
  C  Edit in the + menu      (no settings surface: the New Window Menu edits itself)

  Shared by all three (would be the same in the app whichever wins):
  - Icon picker: search all lucide icons, a suggested set when the query is empty.
  - Hotkey recorder: click, press a chord. It must start with Alt (plain keys and Ctrl
    chords belong to the terminal, see hotkeys.ts); Backspace clears, Esc cancels.
    Chords already bound by tri-code or another agent are flagged, not silently taken.
  - Empty command = the login shell (what `shell` is today, TAB_COMMANDS.shell = null).
  - Open windows follow an agent's name/icon edits; the command only applies to new ones.

  How it would land (not built here):
  - state.ts: TAB_COMMANDS becomes app.agents: { id, name, command, icon, hotkey }[]
    in state.json, seeded with claude/pi/shell. TabKind "claude"|"pi"|"shell" becomes
    { kind: "term", agent: id }; git.ts/IssuesPanel's "send to agent" filter needs a
    replacement for its kind check (e.g. an "agent" flag vs plain tools like lazygit).
  - hotkeys.ts: after the built-in switch misses, look the chord up in app.agents.
  - icons: lucide-solid (tree-shakes per icon; the picker needs the full set, so lazy-load
    it only when the picker opens).
-->

<body>
<div class="app">
  <aside>
    <div class="side-head">Projects</div>
    <h2>local</h2>
    <div class="project active" style="--pa:#7aa2f7"><span class="swatch"></span><span class="name">tri-code</span><span class="count" id="sideCount">2</span></div>
    <div class="project" style="--pa:#9ece6a"><span class="swatch"></span><span class="name">dotfiles</span><span class="count">1</span></div>

<script>
/* ================= icons (lucide UMD) ================= */
const L = window.lucide;
const toKebab = (s) => s.replace(/([a-z0-9])([A-Z])/g, "$1-$2").replace(/([a-zA-Z])(\d)/g, "$1-$2").toLowerCase();
const ICONS = {};               // kebab name → icon node
if (L && L.icons) for (const [k, node] of Object.entries(L.icons)) ICONS[toKebab(k)] = node;
const ICON_NAMES = Object.keys(ICONS).sort();
const SUGGESTED = [
  "asterisk", "sparkles", "bot", "brain", "pi", "square-terminal", "terminal", "code", "git-branch",
  "git-pull-request", "github", "database", "server", "container", "cloud", "activity", "gauge", "cpu",
  "bug", "flask-conical", "rocket", "zap", "wand-sparkles", "hammer", "wrench", "package", "globe",
  "file-code", "notebook-pen", "list-todo", "folder-tree", "search", "message-square", "ghost", "cat",
  "bird", "flame", "leaf", "star", "heart", "sigma", "hash", "command", "keyboard", "monitor",
].filter((n) => ICONS[n] || !L);

function icon(name, cls = "") {
  const node = ICONS[name];
  if (!node || !L) return `<span class="ic ic-miss ${cls}">${name ? name.slice(0, 3) : "?"}</span>`;
  const el = L.createElement(node);
  el.setAttribute("class", "lucide");
  return `<span class="ic ${cls}">${el.outerHTML}</span>`;
}

/* ================= hotkeys ================= */
// A chord is stored like the app would match it: e.code plus modifiers, Alt always on.
const chordId = (h) => h ? `Alt+${h.ctrl ? "Ctrl+" : ""}${h.shift ? "Shift+" : ""}${h.code}` : "";
function keyLabel(code) {
  if (code.startsWith("Key")) return code.slice(3);
  if (code.startsWith("Digit")) return code.slice(5);
  return { Enter: "↵", Semicolon: ";", Quote: "'", Minus: "-", Equal: "=", Backquote: "`", Comma: ",", Period: ".",
    Slash: "/", Backslash: "\\", BracketLeft: "[", BracketRight: "]", Space: "Space", ArrowLeft: "←", ArrowRight: "→",
    ArrowUp: "↑", ArrowDown: "↓" }[code] || code;
}
const kbds = (h) => h ? ["Alt", h.ctrl && "Ctrl", h.shift && "⇧", keyLabel(h.code)].filter(Boolean).map((k) => `<kbd>${k}</kbd>`).join("") : "";
const chordText = (h) => h ? ["Alt", h.ctrl && "Ctrl", h.shift && "Shift", keyLabel(h.code)].filter(Boolean).join("+") : "";

// What tri-code itself binds (hotkeys.ts), so an agent can't silently take it.
const BUILTIN = {};
const bind = (code, mods, what) => { BUILTIN[chordId({ code, shift: mods.includes("s"), ctrl: mods.includes("c") })] = what; };
for (const c of ["KeyH", "KeyJ", "KeyK", "KeyL", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"]) {
  bind(c, "", "focus window"); bind(c, "s", "swap window"); bind(c, "c", "resize split");
}
for (let i = 1; i <= 4; i++) { bind("Digit" + i, "", `workspace ${i}`); bind("Digit" + i, "s", `send to workspace ${i}`); }
Object.entries({
  Enter: "new terminal like this one", KeyB: "new browser", KeyI: "issues", KeyE: "files", KeyC: "git", KeyQ: "close window",
  KeyF: "maximize", KeyM: "promote to main", KeyG: "cycle layout", Comma: "smaller gap", Period: "bigger gap",
  Slash: "hotkey help", KeyS: "toggle sidebar", KeyP: "appearance", BracketLeft: "previous project",
  BracketRight: "next project", KeyO: "open project", Semicolon: "agents settings",
}).forEach(([c, w]) => bind(c, "", w));

/** Why an agent's hotkey can't be used, or "" if it's fine. */
function hotkeyProblem(a) {
  if (!a.hotkey) return "";
  const id = chordId(a.hotkey);
  if (BUILTIN[id]) return `${chordText(a.hotkey)} is tri-code's “${BUILTIN[id]}”`;
  const other = st.agents.find((b) => b !== a && chordId(b.hotkey) === id);
  return other ? `${chordText(a.hotkey)} is already ${other.name || "another agent"}` : "";
}
function nameProblem(a) {
  if (!a.name.trim()) return "needs a name";
  if (st.agents.some((b) => b !== a && b.name.trim().toLowerCase() === a.name.trim().toLowerCase())) return "another agent has this name";
  return "";
}
const hasProblem = (a) => !!(hotkeyProblem(a) || nameProblem(a));

/* ================= state (memory only) ================= */
let seq = 0;
const mk = (name, command, ic, hotkey) => ({ id: "a" + ++seq, name, command, icon: ic, hotkey });
const st = {
  v: "A",
  agents: [
    mk("claude", "claude", "asterisk", { code: "KeyA" }),
    mk("pi", "pi", "pi", { code: "KeyP", shift: true }),
    mk("shell", "", "square-terminal", { code: "KeyT" }),
    mk("lazygit", "lazygit", "git-branch", { code: "KeyG", shift: true }),
    mk("htop", "htop", "activity", null),
  ],
  tabs: [], focus: null,
  menu: null,          // { anchor } — the New Window Menu
  menuEdit: null,      // C: agent id being edited inside the menu ("new" while adding)
  dialog: false, sel: null,   // A
  recording: null,     // agent id whose hotkey is being recorded
  picker: null,        // { agentId, anchor, q }
};
const agent = (id) => st.agents.find((a) => a.id === id);

/* ================= actions ================= */
let flashTimer = 0;
function flash(msg) {
  const el = document.getElementById("flash");
  el.textContent = msg; clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.textContent = ""; }, 2400);
}
let tabSeq = 0;
function launch(a) {
  // snapshot so a window outlives its agent; name/icon follow edits while the agent exists
  const t = { id: "t" + ++tabSeq, agentId: a.id, snap: { name: a.name, icon: a.icon, command: a.command } };
  st.tabs.push(t); st.focus = t.id; st.menu = null; st.menuEdit = null;
  flash(`new ${a.name}${a.command ? "" : " (login shell)"}`);
  render();
}
function openSettings() {
  st.menu = null; st.menuEdit = null;
  if (st.v === "A") { st.dialog = true; st.sel = st.sel && agent(st.sel) ? st.sel : st.agents[0]?.id ?? null; }
  else if (st.v === "B") {
    let t = st.tabs.find((x) => x.kind === "settings");
    if (!t) { t = { id: "t" + ++tabSeq, kind: "settings" }; st.tabs.unshift(t); }
    st.focus = t.id;
  } else { st.menu = { anchor: "plus" }; }
  render();
}
function addAgent() {
  const a = mk("", "", "bot", null);
  st.agents.push(a);
  return a;
}
function removeAgent(id) {
  const a = agent(id);
  st.agents = st.agents.filter((x) => x.id !== id);
  if (st.sel === id) st.sel = st.agents[0]?.id ?? null;
  if (st.menuEdit === id) st.menuEdit = null;
  flash(`removed ${a?.name || "agent"} · open windows keep running`);
}
function closeTab(id) {
  const i = st.tabs.findIndex((x) => x.id === id);
  st.tabs = st.tabs.filter((x) => x.id !== id);
  if (st.focus === id) st.focus = st.tabs[Math.min(i, st.tabs.length - 1)]?.id ?? null;
  render();
}
function move(id, d) {
  const i = st.agents.findIndex((a) => a.id === id), j = i + d;
  if (j < 0 || j >= st.agents.length) return;
  [st.agents[i], st.agents[j]] = [st.agents[j], st.agents[i]];
}

/* ================= shared widgets (HTML) ================= */
function hotkeyBtn(a) {
  const rec = st.recording === a.id, bad = !!hotkeyProblem(a);
  const inner = rec ? "press Alt + a key…" : a.hotkey ? kbds(a.hotkey) : "<span>no hotkey</span>";
  return `<button class="hk ${rec ? "rec" : ""} ${bad ? "bad" : ""}" data-rec="${a.id}" title="Click, then press a chord (Backspace clears)">${inner}</button>`;
}
function iconBtn(a, extra = "") {
  return `<button class="iconbtn" data-pick="${a.id}" title="Icon: ${a.icon} (click to change)" ${extra}>${icon(a.icon)}</button>`;
}
const cmdHint = (a) => a.command.trim()
  ? `runs <code>${esc(a.command)}</code> in the project folder, on the project's host`
  : "empty = your login shell";
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- New Window Menu (all variants; C also edits here) ---------- */
function menuHtml() {
  if (st.v === "C" && st.menuEdit) return editorC(agent(st.menuEdit));
  const rows = st.agents.map((a) => `<button class="item" role="menuitem" data-launch="${a.id}">
      ${icon(a.icon)}<span class="nm">${esc(a.name || "untitled")}</span>
      ${st.v === "C" ? `<span class="edit" data-medit="${a.id}" title="Edit ${esc(a.name)}">${icon("pencil")}</span>` : ""}
      ${a.hotkey && !hotkeyProblem(a) ? kbds(a.hotkey) : ""}</button>`).join("");
  const panels = [["globe", "browser", "B"], ["list-todo", "issues", "I"], ["folder-tree", "files", "E"], ["git-branch", "git", "C"]]
    .map(([i, n, k]) => `<button class="item" data-panel="${n}">${icon(i)}<span class="nm">${n}</span><kbd>Alt</kbd><kbd>${k}</kbd></button>`).join("");
  const foot = st.v === "C"
    ? `<button class="item foot" data-madd="1">${icon("plus")}<span class="nm">Add agent…</span></button>`
    : `<button class="item foot" data-settings="1">${icon("settings-2")}<span class="nm">Edit agents…</span><kbd>Alt</kbd><kbd>;</kbd></button>`;
  return `<div class="mt">Agents<span class="r">${st.v === "C" ? "hover to edit" : ""}</span></div>${rows}
    <div class="div"></div><div class="mt">Panels</div>${panels}<div class="div"></div>${foot}`;
}

/* ---------- A: settings dialog ---------- */
function dialogA() {
  const a = agent(st.sel);
  const list = st.agents.map((x) => `<button class="row ${x.id === st.sel ? "on" : ""}" data-sel="${x.id}">
      ${icon(x.icon)}<span class="nm">${esc(x.name || "untitled")}</span>${hasProblem(x) ? `<span class="err"></span>` : kbds(x.hotkey)}</button>`).join("");
  const detail = a ? `
    <div class="head">${iconBtn(a)}
      <label class="field"><span>Name</span><input class="txt ${nameProblem(a) ? "bad" : ""}" data-f="name" data-id="${a.id}" value="${esc(a.name)}" placeholder="codex" spellcheck="false">
      ${nameProblem(a) ? `<small class="bad">${nameProblem(a)}</small>` : ""}</label></div>
    <label class="field"><span>Command</span>
      <input class="txt mono" data-f="command" data-id="${a.id}" value="${esc(a.command)}" placeholder="(login shell)" spellcheck="false">
      <small>${cmdHint(a)}</small></label>
    <div class="field"><span>Hotkey</span><div>${hotkeyBtn(a)}</div>
      ${hotkeyProblem(a) ? `<small class="bad">${hotkeyProblem(a)}</small>` : `<small>Alt + a key, optionally with Shift or Ctrl</small>`}</div>
    <div class="preview">in the + menu
      <span class="item">${icon(a.icon)}<span class="nm">${esc(a.name || "untitled")}</span>${hotkeyProblem(a) ? "" : kbds(a.hotkey)}</span></div>
    <div class="actions">
      <button class="btn" data-up="${a.id}" title="Move up in the menu">↑</button><button class="btn" data-down="${a.id}" title="Move down">↓</button>
      <span class="sp"></span>
      <button class="btn" data-try="${a.id}">Open one</button>
      <button class="btn danger" data-del="${a.id}">Delete</button></div>`
    : `<div class="c-m">No agents. Add one on the left.</div>`;
  return `<div class="scrim" data-scrim="1"><div class="dlg" role="dialog" aria-label="Agents">
    <header>${icon("settings-2")}<b>Agents</b><span class="sub">Terminal apps for the + menu and their hotkeys · changes apply as you type</span>
      <button class="ghost x" data-closedlg="1" title="Close (Esc)">✕</button></header>
    <div class="list">${list}<button class="row new" data-addA="1">${icon("plus")}<span class="nm">New agent</span></button></div>
    <div class="detail">${detail}</div></div></div>`;
}

/* ---------- B: settings window on the canvas ---------- */
function settingsB() {
  const rows = st.agents.map((a) => {
    const msg = nameProblem(a) || hotkeyProblem(a);
    return `<div class="cell grip" draggable="true" data-drag="${a.id}" title="Drag to reorder the + menu">⋮⋮</div>
      <div class="cell">${iconBtn(a)}</div>
      <div class="cell"><input class="txt ${nameProblem(a) ? "bad" : ""}" data-f="name" data-id="${a.id}" value="${esc(a.name)}" placeholder="name" spellcheck="false"></div>
      <div class="cell"><input class="txt mono" data-f="command" data-id="${a.id}" value="${esc(a.command)}" placeholder="(login shell)" spellcheck="false"></div>
      <div class="cell">${hotkeyBtn(a)}</div>
      <div class="cell ops"><button class="ghost" data-try="${a.id}" title="Open one">${icon("play")}</button><button class="ghost" data-del="${a.id}" title="Delete">${icon("trash-2")}</button></div>
      ${msg ? `<div class="msg">${msg}</div>` : ""}`;
  }).join("");
  const ghost = `<div class="cell"></div><div class="cell"><span class="iconbtn" style="opacity:.4;width:30px;height:28px">${icon("plus")}</span></div>
    <div class="cell ghostrow"><input class="txt" data-newname="1" placeholder="add an agent…" spellcheck="false"></div>
    <div class="cell"></div><div class="cell"></div><div class="cell"></div>`;
  return `<div class="sbody">
    <h3>Agents <span>terminal apps for the + menu · drag ⋮⋮ to reorder · changes apply as you type</span></h3>
    <div class="tbl"><div class="th"></div><div class="th">Icon</div><div class="th">Name</div><div class="th">Command</div><div class="th">Hotkey</div><div class="th"></div>
    ${rows}${ghost}</div>
    <div class="note">Commands run in the project folder on the project's host (ssh for remote projects). An empty command is your login shell.
    Hotkeys start with Alt, so plain keys and Ctrl chords keep reaching the terminal.</div></div>`;
}

/* ---------- C: editor that replaces the menu's contents ---------- */
function editorC(a) {
  if (!a) return "";
  return `<div class="ed">
    <button class="back ghost" data-mback="1">‹ New window</button>
    <div class="line1">${iconBtn(a)}<input class="txt ${nameProblem(a) ? "bad" : ""}" data-f="name" data-id="${a.id}" value="${esc(a.name)}" placeholder="name, e.g. codex" spellcheck="false"></div>
    <label class="field"><input class="txt mono" data-f="command" data-id="${a.id}" value="${esc(a.command)}" placeholder="command (empty = login shell)" spellcheck="false">
      ${nameProblem(a) ? `<small class="bad">${nameProblem(a)}</small>` : ""}</label>
    <div class="line3">${hotkeyBtn(a)}<span class="sp"></span><button class="ghost" style="padding:4px" data-del="${a.id}" title="Delete">${icon("trash-2")}</button>
      <button class="btn primary" data-mdone="1">Done</button></div>
    ${hotkeyProblem(a) ? `<small style="color:var(--bad);font-size:11px">${hotkeyProblem(a)}</small>` : ""}</div>`;
}

/* ---------- icon picker ---------- */
function pickerHtml() {
  const p = st.picker, a = agent(p.agentId);
  if (!a) return "";
  return `<div class="picker" id="picker"><input class="txt" id="pickq" placeholder="Search ${ICON_NAMES.length || ""} lucide icons…" value="${esc(p.q)}" spellcheck="false">
    <div class="grid" id="pickgrid"></div><div class="meta"><span id="pickcount"></span><code id="pickname">${a.icon}</code></div></div>`;
}
function fillPickerGrid() {
  const p = st.picker, a = agent(p?.agentId);
  const grid = document.getElementById("pickgrid");
  if (!a || !grid) return;
  const q = p.q.trim().toLowerCase();
  const names = q ? ICON_NAMES.filter((n) => n.includes(q)) : SUGGESTED;
  const shown = names.slice(0, 135);
  grid.innerHTML = shown.map((n) => `<button class="${n === a.icon ? "on" : ""}" data-icon="${n}" title="${n}">${icon(n)}</button>`).join("")
    || `<span class="c-m" style="grid-column:1/-1;padding:8px">no icon matches “${esc(q)}”</span>`;
  document.getElementById("pickcount").textContent = q ? `${names.length} match${names.length === 1 ? "" : "es"}${names.length > shown.length ? `, first ${shown.length}` : ""}` : "suggested · type to search";
}
function placeFixed(el, anchor) {
  if (!el || !anchor) return;
  const r = anchor.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + "px";
  const below = r.bottom + 6;
  el.style.top = (below + el.offsetHeight > innerHeight - 8 ? Math.max(8, r.top - el.offsetHeight - 6) : below) + "px";
}

/* ================= render ================= */
const VARIANTS = ["A", "B", "C"];
const NAMES = { A: "Settings dialog", B: "Settings window", C: "Edit in the + menu" };
const DESC = {
  A: "A modal from ⚙ / Alt+; / “Edit agents…”. One agent at a time, roomy, with a preview.",
  B: "A canvas Window with a table. All agents at once; try one in the next tile.",
  C: "No settings surface: hover a row in + for ✎, “Add agent…” at the bottom.",
};

function tabLook(t) {
  if (t.kind === "settings") return { name: "agents", icon: "settings-2", sub: "settings" };
  const a = agent(t.agentId);
  return { name: a ? a.name || "untitled" : t.snap.name, icon: a ? a.icon : t.snap.icon, sub: t.snap.command || "$SHELL", gone: !a };
}
function screenFor(t) {
  const c = t.snap.command;
  if (!c) return `<span class="c-o">~/code/tri-code $</span> ▍`;
  const fake = {
    claude: `<span class="c-a">✳</span> Welcome to Claude Code\n<span class="c-m">  cwd: ~/code/tri-code</span>\n\n<span class="c-a">&gt;</span> ▍`,
    pi: `<span class="c-a">π</span> pi · tri-code\n<span class="c-a">&gt;</span> ▍`,
    htop: `<span class="c-o">  CPU[|||||       18.2%]</span>\n<span class="c-o">  Mem[||||||  3.1G/16G]</span>\n<span class="c-m">  PID USER  CMD</span>\n  812 me    tri-code`,
    lazygit: `<span class="c-o">┌ Status ─────────┐</span>\n<span class="c-o">│</span> tri-code → main  <span class="c-o">│</span>\n<span class="c-o">└─────────────────┘</span>\n<span class="c-m">  Files · Branches · Commits</span>`,
  }[c.split(/\s+/)[0]];
  return fake ?? `<span class="c-o">~/code/tri-code $</span> ${esc(c)}\n<span class="c-m">  (pretend ${esc(c.split(/\s+/)[0])} is running)</span>\n▍`;
}

function render() {
  // keep focus + caret across innerHTML swaps, so typing into a field survives a re-render
  const ae = document.activeElement;
  const keep = ae && ae.dataset && (ae.dataset.f ? `[data-f="${ae.dataset.f}"][data-id="${ae.dataset.id}"]` : ae.dataset.newname ? "[data-newname]" : null);
  const caret = keep ? [ae.selectionStart, ae.selectionEnd] : null;

  document.getElementById("gear").innerHTML = `${icon("settings-2")}${st.v === "C" ? "" : "Agents"}`;
  document.getElementById("gear").style.display = st.v === "C" ? "none" : "";

  // tab strip
  document.getElementById("tabs").innerHTML = st.tabs.map((t) => {
    const l = tabLook(t);
    return `<button data-focus="${t.id}" aria-pressed="${st.focus === t.id}" title="${esc(l.sub)}">${icon(l.icon)}${esc(l.name)}</button>`;
  }).join("") + `<button class="plus" id="plus" data-menu="1" title="New window">+</button>`;

  // canvas
  const world = document.getElementById("world");
  world.classList.toggle("has-settings", st.tabs.some((t) => t.kind === "settings") && st.tabs.length > 1);
  world.innerHTML = st.tabs.map((t) => {
    const l = tabLook(t);
    return `<div class="win ${t.kind === "settings" ? "settings" : ""} ${st.focus === t.id ? "focused" : ""}" data-win="${t.id}">
      <div class="bar">${icon(l.icon)}<span class="kind">${esc(l.name)}</span><span class="ttl">${l.gone ? "agent removed · " : ""}${esc(l.sub)}</span>
        <button data-close="${t.id}" title="Close (Alt+Q)">×</button></div>
      ${t.kind === "settings" ? settingsB() : `<pre class="screen">${screenFor(t)}</pre>`}</div>`;
  }).join("");
  document.getElementById("worldEmpty").hidden = st.tabs.length > 0;
  document.getElementById("sideCount").textContent = st.tabs.length;

  // overlays
  let ov = "";
  if (st.menu) ov += `<div class="tabmenu" id="tabmenu" role="menu">${menuHtml()}</div>`;
  if (st.v === "A" && st.dialog) ov += dialogA();
  document.getElementById("overlay").innerHTML = ov;
  placeFixed(document.getElementById("tabmenu"), document.getElementById("plus"));

  const ph = document.getElementById("pickerHost");
  if (st.picker) {
    if (!document.getElementById("picker")) { ph.innerHTML = pickerHtml(); fillPickerGrid(); document.getElementById("pickq").focus(); }
    else fillPickerGrid();
    placeFixed(document.getElementById("picker"), document.querySelector(`[data-pick="${st.picker.agentId}"]`));
  } else ph.innerHTML = "";

  // status + prototype bar
  const ok = st.agents.filter((a) => !hasProblem(a));
  document.getElementById("state").textContent =
    `${st.agents.length} agents · ` + st.agents.map((a) => `${a.name || "?"}${a.hotkey ? " " + chordText(a.hotkey) : ""}${hasProblem(a) ? " ⚠" : ""}`).join(" · ") +
    ` · ${st.tabs.length} windows${st.recording ? " · recording hotkey…" : ""}`;
  document.getElementById("vlabel").textContent = `${st.v} · ${NAMES[st.v]}`;
  document.getElementById("vdesc").textContent = DESC[st.v];
  document.getElementById("json").textContent = JSON.stringify({
    agents: st.agents.map((a) => ({ id: a.id, name: a.name, command: a.command || null, icon: a.icon, hotkey: a.hotkey ? chordText(a.hotkey) : null })),
  }, null, 2) + (ok.length < st.agents.length ? `\n\n// ⚠ ${st.agents.length - ok.length} with problems: hotkey ignored / not saved until fixed` : "");

  if (keep) {
    const el = document.querySelector(keep);
    if (el) { el.focus(); try { el.setSelectionRange(caret[0], caret[1]); } catch {} }
  }
}

/* ================= events ================= */
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "pickq") { st.picker.q = el.value; fillPickerGrid(); return; }
  if (el.dataset.f) { const a = agent(el.dataset.id); if (a) { a[el.dataset.f] = el.value; render(); } return; }
  if (el.dataset.newname !== undefined && el.value.trim()) {
    // B: typing in the ghost row creates the agent and moves the caret into its name field
    const a = addAgent(); a.name = el.value; el.value = "";
    render();
    const f = document.querySelector(`[data-f="name"][data-id="${a.id}"]`);
    if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-launch],[data-medit],[data-madd],[data-mback],[data-mdone],[data-settings],[data-panel],[data-menu],[data-focus],[data-close],[data-sel],[data-addA],[data-closedlg],[data-scrim],[data-pick],[data-icon],[data-rec],[data-del],[data-try],[data-up],[data-down]");
  const inPicker = e.target.closest("#picker");
  if (st.picker && !inPicker && !(el && el.dataset.pick)) { st.picker = null; render(); if (!el) return; }
  if (st.recording && !(el && el.dataset.rec === st.recording)) { st.recording = null; render(); }
  if (!el) {
    if (st.menu && !e.target.closest("#tabmenu")) { st.menu = null; st.menuEdit = null; render(); }
    return;
  }
  const d = el.dataset;
  if (d.medit) { e.stopPropagation(); st.menuEdit = d.medit; render(); return; }
  if (d.launch) { const a = agent(d.launch); if (hasProblem(a)) { flash(`fix ${a.name || "this agent"} first`); return; } return launch(a); }
  if (d.madd) { st.menuEdit = addAgent().id; render(); document.querySelector(`[data-f="name"][data-id="${st.menuEdit}"]`)?.focus(); return; }
  if (d.mback || d.mdone) { st.menuEdit = null; render(); return; }
  if (d.settings) return openSettings();
  if (d.panel) { st.menu = null; flash(`(${d.panel} not mocked here)`); render(); return; }
  if (d.menu) { st.menu = st.menu ? null : { anchor: "plus" }; st.menuEdit = null; render(); return; }
  if (d.focus) { st.focus = d.focus; render(); return; }
  if (d.close) return closeTab(d.close);
  if (d.sel) { st.sel = d.sel; render(); return; }
  if (d.adda !== undefined) { st.sel = addAgent().id; render(); document.querySelector(`[data-f="name"][data-id="${st.sel}"]`)?.focus(); return; }
  if (d.closedlg || (d.scrim && e.target === el)) { st.dialog = false; render(); return; }
  if (d.scrim) return;
  if (d.pick) { st.picker = st.picker?.agentId === d.pick ? null : { agentId: d.pick, q: "" }; document.getElementById("pickerHost").innerHTML = ""; render(); return; }
  if (d.icon) { const a = agent(st.picker.agentId); a.icon = d.icon; st.picker = null; flash(`icon → ${d.icon}`); render(); return; }
  if (d.rec) { st.recording = st.recording === d.rec ? null : d.rec; render(); return; }
  if (d.del) { removeAgent(d.del); render(); return; }
  if (d.try) { const a = agent(d.try); if (hasProblem(a)) { flash("fix the problems first"); return; } st.dialog = false; return launch(a); }
  if (d.up) { move(d.up, -1); render(); return; }
  if (d.down) { move(d.down, 1); render(); return; }
});

// B: drag ⋮⋮ to reorder
let dragId = null;
document.addEventListener("dragstart", (e) => { const g = e.target.closest?.("[data-drag]"); if (g) { dragId = g.dataset.drag; e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", (e) => { if (dragId && e.target.closest?.(".tbl")) e.preventDefault(); });
document.addEventListener("drop", (e) => {
  if (!dragId) return;
  // the table is a flat grid: a row's agent is the nearest grip at or before the drop cell
  let c = e.target.closest?.(".cell");
  while (c && !c.dataset.drag) c = c.previousElementSibling;
  const rowAgent = c?.dataset.drag;
  if (rowAgent && rowAgent !== dragId) {
    const a = agent(dragId);
    st.agents = st.agents.filter((x) => x !== a);
    st.agents.splice(st.agents.findIndex((x) => x.id === rowAgent), 0, a);
    flash(`${a.name} moved · menu order updated`);
  }
  dragId = null; render();
});

addEventListener("keydown", (e) => {
  // hotkey recorder swallows the next chord
  if (st.recording) {
    e.preventDefault(); e.stopPropagation();
    const a = agent(st.recording);
    if (e.key === "Escape") { st.recording = null; render(); return; }
    if (e.key === "Backspace" || e.key === "Delete") { a.hotkey = null; st.recording = null; flash("hotkey cleared"); render(); return; }
    if (["Alt", "Shift", "Control", "Meta"].includes(e.key)) return;
    if (!e.altKey) { flash("hotkeys start with Alt — plain keys and Ctrl chords go to the terminal"); return; }
    a.hotkey = { code: e.code, ...(e.shiftKey ? { shift: true } : {}), ...(e.ctrlKey ? { ctrl: true } : {}) };
    st.recording = null;
    const p = hotkeyProblem(a);
    flash(p ? `⚠ ${p}` : `${a.name} → ${chordText(a.hotkey)}`);
    render(); return;
  }
  const typing = e.target.closest?.("input, textarea, [contenteditable]");
  if (e.key === "Escape") {
    if (st.picker) st.picker = null;
    else if (st.menuEdit) st.menuEdit = null;
    else if (st.menu) st.menu = null;
    else if (st.dialog) st.dialog = false;
    else return;
    render(); return;
  }
  if (e.altKey) {
    const id = chordId({ code: e.code, shift: e.shiftKey, ctrl: e.ctrlKey });
    if (id === "Alt+Semicolon") { e.preventDefault(); return openSettings(); }
    if (id === "Alt+KeyQ") { e.preventDefault(); if (st.focus) closeTab(st.focus); return; }
    const a = st.agents.find((x) => chordId(x.hotkey) === id && !hasProblem(x));
    if (a) { e.preventDefault(); return launch(a); }
    if (BUILTIN[id]) { e.preventDefault(); flash(`${chordText({ code: e.code, shift: e.shiftKey, ctrl: e.ctrlKey })}: ${BUILTIN[id]} (not mocked)`); }
    return;
  }
  if (typing) return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});
addEventListener("resize", () => render());

/* ================= variant switcher ================= */
function setVariant(v, push) {
  if (!VARIANTS.includes(v)) v = "A";
  st.v = v; st.menu = null; st.menuEdit = null; st.dialog = false; st.picker = null; st.recording = null;
  st.tabs = st.tabs.filter((t) => t.kind !== "settings");
  if (!st.tabs.some((t) => t.id === st.focus)) st.focus = st.tabs[0]?.id ?? null;
  if (push) {
    try {
      if (location.protocol === "file:") location.hash = v;
      else { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
    } catch {}
  }
  render();
  // open each variant's surface so flipping shows it straight away
  openSettings();
}
const cycle = (d) => setVariant(VARIANTS[(VARIANTS.indexOf(st.v) + d + VARIANTS.length) % VARIANTS.length], true);
document.getElementById("prev").onclick = (e) => { e.stopPropagation(); cycle(-1); };
document.getElementById("next").onclick = (e) => { e.stopPropagation(); cycle(1); };
document.getElementById("jsonBtn").onclick = (e) => { e.stopPropagation(); const j = document.getElementById("json"); j.hidden = !j.hidden; };
document.getElementById("gear").onclick = (e) => { e.stopPropagation(); openSettings(); };

/* ================= boot ================= */
launch(st.agents[0]); launch(st.agents[2]);
st.focus = st.tabs[0].id;
const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
setVariant(VARIANTS.includes(initial) ? initial : "A", false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
