<title>tri-code · git window prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser.
  Question: "What should a git window look like that takes a branch from changes to a merged PR
  (stage → commit → push → PR → merge), with AI that writes the context for us?"

  Three structurally different variants, switchable from the floating bar at the bottom
  (also ← / → keys). URL keeps the choice: git.html?variant=B (served) or git.html#B (file://).
    A · Pipeline rail   — the branch's life as five steps down the left; one step on screen at a time.
    B · Source control  — changes + diff always visible, commit box on top, push/PR/merge in the header.
    C · Ship sheet      — AI-first: ✦ proposes the whole plan (commits, PR, review), you approve cards.

  Every action is stubbed (timeouts, canned AI text); nothing touches git.
  The AI's inputs are the "context chips": diff, the linked issue from .dev/issues.json,
  the repo's last 20 commit subjects (for style) and CONTEXT.md terms. Toggle them to see what it would read.

  How it would map into the app (not built here):
  - New TabKind "git" (Alt+G), one per project like Issues and Files.
  - Backend: git_status / git_diff / git_stage / git_commit / git_push, gh_pr_create / gh_pr_view /
    gh_pr_merge — run on the project's host (local process, or the existing ssh helpers).
  - AI drafts: spawn `claude -p` on the project's host with the chips as the prompt, so it uses
    the user's own Claude Code login; "Send to claude" types into the project's claude tab instead.
-->

/* ---------- A · pipeline rail ---------- */
function variantA() {
  const curId = step() === "changes" ? (stepIndex("changes") === 1 ? "commit" : "changes") : step();
  const view = st.aStep || (curId === "done" ? "merge" : curId);
  const ci = curId === "done" ? 5 : STEPS.findIndex((s) => s.id === curId);
  const sub = {
    changes: st.files.length ? `${staged().length} of ${st.files.length} staged` : "clean",
    commit: unpushed().length ? `${unpushed().length} new commit${unpushed().length > 1 ? "s" : ""}` : st.msg ? "message ready" : "no message",
    push: unpushed().length ? `↑${unpushed().length} to origin` : "up to date",
    pr: st.pr ? `#${PR_NO} open` : "not opened",
    merge: st.pr && st.pr.merged ? "merged" : st.pr ? (st.pr.checks === "passed" ? "checks passed" : "checks running") : "—",
  };
  const rail = STEPS.map((s, i) => `<div class="step ${i < ci ? "done" : i === ci ? "now" : ""} ${s.id === view ? "cur" : ""}" data-astep="${s.id}">
    <span class="bub">${i < ci ? "✓" : i + 1}</span><span class="nm">${s.nm}</span><span class="sub">${sub[s.id]}</span></div>`).join("");

  let body = "", foot = "";
  if (curId === "done") { body = doneHero(); }
  else if (view === "changes") {
    body = `<div class="a-split"><div class="flist">${fileRows(st.files, { check: true }) || `<div class="hint" style="padding:10px">Working tree clean.</div>`}</div>
      <div class="diffwrap"><div class="diffhead"><b>${esc(st.sel || "")}</b></div>${diffHtml(st.sel)}</div></div>`;
    foot = `${st.files.length > 3 ? aiBtn("split", "Split into commits", "split") : ""}<span class="grow"></span>
      <button class="btn primary" data-astep="commit" ${staged().length ? "" : "disabled"}>Write commit <kbd>⌃↵</kbd></button>`;
  } else if (view === "commit") {
    body = `<div class="fieldrow"><span class="hint">${staged().length} staged: ${staged().slice(0, 4).map((f) => esc(f.p.split("/").pop())).join(", ")}${staged().length > 4 ? "…" : ""}</span><span class="grow"></span>${aiBtn("commit", "Draft message", "commit")}</div>
      <textarea class="msg ${st.msgAi ? "ghost" : ""}" data-field="msg" rows="9" placeholder="Summary line&#10;&#10;Why this change…">${esc(st.msg)}</textarea>
      ${st.msgAi ? `<div class="hint"><span class="v-t">✦ drafted</span> from the diff, TRI-14 and the last 20 subjects (imperative, sentence case, no prefix). Edit freely.</div>` : ""}
      ${chips()}
      ${unpushed().length ? `<div><div class="hint">Unpushed</div>${commitList()}</div>` : ""}`;
    foot = `<span class="hint">${st.files.length - staged().length ? `${st.files.length - staged().length} file(s) stay unstaged` : ""}</span><span class="grow"></span>
      <button class="btn" data-act="commit" ${staged().length && st.msg.trim() ? "" : "disabled"}>${workLbl("commit", "Commit", "Committing…")}</button>
      <button class="btn primary" data-act="commitpush" ${staged().length && st.msg.trim() ? "" : "disabled"}>Commit &amp; push <kbd>⌃↵</kbd></button>`;
  } else if (view === "push") {
    body = `<div class="hint">origin · github.com/WaldoJoubert-GH/tri-code</div><div>${commitList()}</div>
      ${st.files.length ? `<div class="hint warn-t">${st.files.length} uncommitted file(s) won't be pushed.</div>` : ""}`;
    foot = `<span class="grow"></span><button class="btn primary" data-act="push" ${unpushed().length ? "" : "disabled"}>${workLbl("push", `Push ↑${unpushed().length}`, "Pushing…")} <kbd>⌃↵</kbd></button>`;
  } else if (view === "pr") {
    if (st.pr) body = prCard();
    else {
      body = `<div class="fieldrow"><span class="branch">feat/git-panel</span><span class="arrow-r">→</span><span class="branch base">main</span><span class="hint">· ${st.commits.length} commits</span><span class="grow"></span>${aiBtn("pr", "Draft PR", "pr")}</div>
        <input class="ttl ${st.prAi ? "ghost" : ""}" data-field="prTitle" placeholder="Title" value="${esc(st.prTitle)}">
        <textarea class="msg ${st.prAi ? "ghost" : ""}" data-field="prBody" rows="13" placeholder="## Summary">${esc(st.prBody)}</textarea>
        ${chips()}`;
      foot = `<label class="hint" style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-prdraft ${st.prDraft ? "checked" : ""}> draft</label><span class="grow"></span>
        <button class="btn primary" data-act="pr" ${st.prTitle.trim() && !unpushed().length ? "" : "disabled"}>${workLbl("pr", "Open pull request", "Opening…")} <kbd>⌃↵</kbd></button>`;
    }
  } else if (view === "merge") {
    if (!st.pr) body = `<div class="hint">Open a pull request first.</div>`;
    else {
      body = `${prCard()}<div><div class="hint" style="margin-bottom:4px">Checks</div>${checksHtml()}</div><div>${reviewHtml()}</div>${mergeOpts()}`;
      foot = `<span class="hint">${st.pr.checks === "passed" ? "" : "waiting for checks…"}</span><span class="grow"></span>
        <button class="btn ok" data-act="merge" ${st.pr.checks === "passed" ? "" : "disabled"}>${workLbl("merge", `Merge #${PR_NO}`, "Merging…")} <kbd>⌃↵</kbd></button>`;
    }
  }
  const title = view === "pr" ? "Pull request" : STEPS.find((s) => s.id === view).nm;
  return win(`${head()}<div class="pipe"><div class="rail">${rail}</div>
    <div class="stage"><div class="stage-head"><h3>${curId === "done" ? "Done" : title}</h3></div>
    <div class="stage-scroll">${body}</div>${foot ? `<div class="stage-foot">${foot}</div>` : ""}</div></div>`);
}
function prCard() {

    <details><summary class="hint">Description</summary><div class="mdbody">${esc(st.prBody || PR_BODY)}</div></details></div>`;

/* ---------- B · source control ---------- */
function variantB() {
  const s = step();
  const up = unpushed().length;
  const fs = (id, lbl, done, now) => `<span class="fs ${done ? "done" : now ? "now" : ""}" ${now ? `data-drawer="${id}"` : ""}>${done ? "✓ " : ""}${lbl}</span>`;
  const flow = `<div class="flow">
    ${fs("push", up ? `Push ↑${up}` : st.commits.length > 1 ? "Pushed" : "Push", !up && st.commits.length > 1, up > 0 && !st.files.length)}<span class="sepa">›</span>

  const unst = st.files.filter((f) => !f.staged);
  const ready = staged().length && st.msg.trim();
  const left = `<div class="sc-left">
    <div class="cbox">

        <span class="splitbtn" style="position:relative"><button class="btn primary" data-act="commit" ${ready ? "" : "disabled"}>${workLbl("commit", `Commit ${staged().length || ""}`, "…")}</button><button class="btn primary" data-bmenu ${ready ? "" : "disabled"}>▾</button>
        ${st.bMenu ? `<div class="menu" style="right:0;top:28px">
          <button data-act="commitpush">Commit &amp; push<span class="k">⌃⇧↵</span></button>
          <button data-act="commitpr">Commit, push &amp; open PR…<span class="k">⌃⌥↵</span></button>
          <button data-act="commit">Commit<span class="k">⌃↵</span></button></div>` : ""}</span></div>
      ${chips()}
    </div>
    <div class="flist">

      <div class="fsec">Changes <span class="n">${unst.length}</span><button data-stageall>+ all</button></div>${fileRows(unst, { check: true })}
      ${!st.files.length ? `<div class="hint" style="padding:6px 10px">Working tree clean.</div>` : ""}
      <div class="fsec" style="margin-top:6px">Commits <span class="n">${st.commits.length}</span></div><div style="padding:0 10px">${commitList()}</div>
    </div></div>`;
  let drawer = "";
  if (s === "done") drawer = `<div class="drawer" style="width:100%">${doneHero()}</div>`;
  else if (st.bDrawer === "push") drawer = drawerHtml("Push", `<div class="hint">origin/feat/git-panel</div>${commitList()}`,
    `<span class="grow"></span><button class="btn primary" data-act="push" ${up ? "" : "disabled"}>${workLbl("push", `Push ↑${up}`, "Pushing…")}</button>`);
  else if (st.bDrawer === "pr") drawer = drawerHtml("Open pull request", `<div class="fieldrow"><span class="branch">feat/git-panel</span>→<span class="branch base">main</span><span class="grow"></span>${aiBtn("pr", "Draft PR", "pr")}</div>
      <input class="ttl ${st.prAi ? "ghost" : ""}" data-field="prTitle" placeholder="Title" value="${esc(st.prTitle)}">
      <textarea class="msg ${st.prAi ? "ghost" : ""}" data-field="prBody" rows="14" placeholder="## Summary">${esc(st.prBody)}</textarea>${chips()}`,
    `<label class="hint" style="display:flex;gap:5px;align-items:center"><input type="checkbox" data-prdraft ${st.prDraft ? "checked" : ""}> draft</label><span class="grow"></span>
      <button class="btn primary" data-act="pr" ${st.prTitle.trim() && !up ? "" : "disabled"}>${workLbl("pr", "Open PR", "Opening…")}</button>`);
  else if (st.bDrawer === "merge" && st.pr) drawer = drawerHtml(`Merge #${PR_NO}`, `${prCard()}${checksHtml()}${reviewHtml()}${mergeOpts()}`,
    `<span class="grow"></span><button class="btn ok" data-act="merge" ${st.pr.checks === "passed" ? "" : "disabled"}>${workLbl("merge", `Merge #${PR_NO}`, "Merging…")}</button>`);

  return win(`${head(flow)}<div class="sc">${left}${right}</div>`);
}
function drawerHtml(t, b, f) {
  return `<div class="drawer"><div class="dh">${t}<button class="x" data-drawer="">×</button></div><div class="db">${b}</div><div class="df">${f}</div></div>`;
}

/* ---------- C · ship sheet ---------- */
function buildPlan() {
  const be = st.files.filter((f) => BACKEND.includes(f.p)).map((f) => f.p);
  const ui = st.files.filter((f) => !BACKEND.includes(f.p)).map((f) => f.p);
  st.plan = [
    be.length && { id: "c1", kind: "commit", files: be, msg: MSG_BACKEND, why: "The Rust commands and their TS wrappers stand alone and build on their own, so they read better as their own commit." },
    ui.length && { id: "c2", kind: "commit", files: ui, msg: MSG_UI, why: "The window, the TabKind, Alt+G and the docs. README.md is included: it documents Alt+G." },
    { id: "push", kind: "push", why: "No upstream changes on main since you branched; a plain push is safe." },
    { id: "pr", kind: "pr", title: PR_TITLE, body: PR_BODY, why: "TRI-14 is In Progress and matches this branch; the PR closes it." },
    { id: "rev", kind: "review", why: "Ran the review over the combined diff before opening; one thing worth fixing." },
    { id: "merge", kind: "merge", why: "Squash: the repo's main history is one commit per feature." },
  ].filter(Boolean).map((c) => ({ ...c, state: "draft" })); // draft → ok → ran
}
function variantC() {
  if (step() === "done") return win(`${head()}<div class="sheet">${doneHero()}</div>`);
  let inner;
  if (!st.plan) {
    inner = `<div class="sheet"><div class="sheet-intro"><h3>Ship feat/git-panel</h3>
      <div class="hint">${st.files.length} changed files, ${unpushed().length} unpushed commits, no PR yet. ✦ will propose how to commit, push, describe and merge this branch. Nothing runs until you approve it.</div>
      ${chips()}
      <div class="fieldrow">${st.busy === "plan" ? `<span class="thinking">reading the diff, TRI-14 and git log…</span>` : `<button class="btn ai" data-ai="plan">✦ Propose a plan</button><span class="hint">or</span><button class="btn" data-variant="B">do it by hand</button>`}</div></div>
      <div class="hint">Changed</div><div class="flist" style="border:1px solid var(--line);border-radius:6px">${fileRows(st.files)}</div></div>`;
    return win(`${head()}<div class="gbody">${inner}</div>`);
  }
  const curIdx = st.plan.findIndex((c) => c.state !== "ran");
  const cards = st.plan.map((c, i) => {
    const cur = i === curIdx;
    let t = "", b = "";
    if (c.kind === "commit") {
      t = c.msg.split("\n")[0];
      b = `<div class="tagfiles">${c.files.map((p) => `<span>${esc(p)}</span>`).join("")}</div>
        <textarea class="msg ghost" data-plan="${c.id}" data-pfield="msg" rows="${c.state === "ran" ? 1 : 6}" ${c.state === "ran" ? "disabled" : ""}>${esc(c.msg)}</textarea>`;
    } else if (c.kind === "push") { t = "Push to origin/feat/git-panel"; b = `<div class="hint">${st.plan.filter((x) => x.kind === "commit").length} new commit(s) + ${st.commits.filter((x) => x.pushed).length} already on origin</div>`; }
    else if (c.kind === "pr") {
      t = c.title;
      b = st.pr ? prCard() : `<input class="ttl ghost" data-plan="${c.id}" data-pfield="title" value="${esc(c.title)}"><textarea class="msg ghost" data-plan="${c.id}" data-pfield="body" rows="8">${esc(c.body)}</textarea>`;
    } else if (c.kind === "review") {
      t = "Pre-merge review"; if (!st.review) st.review = FINDINGS; b = reviewHtml();
    } else if (c.kind === "merge") {
      t = `Merge into main (${st.strategy})`; b = `${st.pr ? checksHtml() : `<div class="hint">Waits for the PR's checks.</div>`}${mergeOpts()}`;
    }
    const act = c.state === "ran" ? `<span class="hint ok-t">done</span>`
      : c.state === "ok" ? `<span class="hint ok-t">✓ approved</span><button class="btn sm" data-unok="${c.id}">undo</button>`
      : `<button class="btn sm" data-drop="${c.id}" title="Remove from the plan">skip</button><button class="btn sm primary" data-ok="${c.id}">Approve</button>`;
    return `<div class="card ${cur ? "cur" : ""} ${c.state === "ok" ? "ok" : ""} ${c.state === "ran" ? "ran" : ""}">
      <div class="ch"><span class="k">${i + 1} · ${c.kind}</span><span class="t">${esc(t)}</span>${act}</div>
      ${c.state === "ran" && c.kind !== "pr" ? "" : `<div class="cb"><div class="why">${esc(c.why)}</div>${b}</div>`}</div>`;
  }).join("");
  const okN = st.plan.filter((c) => c.state === "ok").length;
  const blocked = st.pr && st.pr.checks === "running";
  const runbar = `<div class="runbar"><div class="prog">${st.plan.map((c) => `<i class="${c.state === "ran" ? "ran" : c.state === "ok" ? "ok" : ""}"></i>`).join("")}</div>
    <span class="hint">${st.working ? `running ${st.working}…` : blocked ? "waiting for checks…" : `${okN} approved`}</span>
    <button class="btn" data-okall>Approve all</button>
    <button class="btn primary" data-run ${okN && !st.working ? "" : "disabled"}>Run approved <kbd>⌃↵</kbd></button></div>`;
  return win(`${head(`<button class="btn sm ai" data-ai="plan">✦ Re-plan</button>`)}<div class="gbody" style="position:relative"><div class="sheet">
    <div class="chips">${chips().replace(/^<div class="chips">|<\/div>$/g, "")}</div>${cards}</div>${runbar}</div>`);
}
function runApproved() {
  const c = st.plan.find((x) => x.state !== "ran");
  if (!c || c.state !== "ok") return;
  const next = () => { c.state = "ran"; render(); setTimeout(runApproved, 250); };
  if (c.kind === "commit") {
    st.files.forEach((f) => (f.staged = c.files.includes(f.p)));
    work("commit", 500, () => {
      const sha = ["9d04b1e", "c71a5f0"][shaN++ % 2];
      st.commits.push({ sha, s: c.msg.split("\n")[0], pushed: false });
      st.files = st.files.filter((f) => !c.files.includes(f.p));
      flash(`committed ${sha}`); next();
    });
  } else if (c.kind === "push") work("push", 800, () => { st.commits.forEach((x) => (x.pushed = true)); flash("pushed"); next(); });
  else if (c.kind === "pr") { st.prTitle = c.title; st.prBody = c.body; work("pr", 800, () => { st.pr = { n: PR_NO, checks: "running" }; flash(`opened #${PR_NO}`); setTimeout(() => { st.pr.checks = "passed"; render(); runApproved(); }, 2600); next(); }); }
  else if (c.kind === "review") next();
  else if (c.kind === "merge") {
    if (st.pr.checks !== "passed") return; // resumes when checks pass
    work("merge", 800, () => { st.pr.merged = true; next(); });
  }
}

/* ---------- windows ---------- */
function win(gitInner) {
  const sent = st.sent.map((s) => `<span class="sent"><span class="c-v">❯</span> ${esc(s)}</span>`).join("");
  return `<div class="win focused"><div class="bar"><span class="dot git"></span><span class="kind">git</span><span class="ttl">tri-code · feat/git-panel</span><button>×</button></div>

    <div class="win"><div class="bar"><span class="dot running"></span><span class="kind">claude</span><span class="ttl">~/code/tri-code</span><button>×</button></div>
      <div class="screen"><span class="c-m">╭─ Claude Code ─────────────────────╮</span>
<span class="c-o">●</span> Added git.rs with git_status, git_diff,
  git_commit, git_push and the gh_pr_* commands.
<span class="c-o">●</span> Wired the git TabKind and Alt+G.
<span class="c-o">●</span> cargo test: 41 passed
${sent}
<span class="c-a">❯</span> <span class="c-m">_</span></div></div>`;
}

/* ---------- render + switcher ---------- */
const world = document.getElementById("world");
const vlabel = document.getElementById("vlabel");
const vdesc = document.getElementById("vdesc");
const focusInfo = document.getElementById("focusInfo");

function render() {
  const fa = document.activeElement, fk = fa && (fa.dataset.field || fa.dataset.pfield), fpos = fa && fa.selectionStart;
  world.innerHTML = st.v === "A" ? variantA() : st.v === "B" ? variantB() : variantC();
  if (fk) { const el = world.querySelector(`[data-field="${fk}"],[data-pfield="${fk}"]`); if (el) { el.focus(); try { el.setSelectionRange(fpos, fpos); } catch {} } }
  vlabel.textContent = `${st.v} · ${NAMES[st.v]}`;
  vdesc.textContent = DESC[st.v];
  const pr = st.pr ? `#${PR_NO} ${st.pr.merged ? "merged" : st.pr.checks}` : "no PR";
  focusInfo.textContent = `git · step ${step()} · ${st.files.length} changed (${staged().length} staged) · ↑${unpushed().length} · ${pr} · ✦ ctx ${[...st.ctx].join(",")}`;
}
function setVariant(v, push) {
  if (!ORDER.includes(v)) v = "A";
  st.v = v; st.bMenu = false;
  if (push) {
    try {
      if (location.protocol === "file:") location.hash = v;
      else { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
    } catch { /* ignore */ }
  }
  render();
}
function cycle(d) { setVariant(ORDER[(ORDER.indexOf(st.v) + d + ORDER.length) % ORDER.length], true); }
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("reset").onclick = () => { fresh(st.v); render(); };

function nextStep() {
  if (st.v === "C") { if (st.plan) runApproved(); return; }
  const s = step();
  if (s === "changes") { if (st.v === "A" && st.aStep !== "commit") { st.aStep = "commit"; render(); } else commitThen(st.v === "A" ? "push" : null); }
  else if (s === "push") push();
  else if (s === "pr") { if (st.v === "B" && st.bDrawer !== "pr") { st.bDrawer = "pr"; render(); } else openPr(); }
  else if (s === "merge") merge();
}
function commitThen(after) {
  const msg = st.msg;
  if (!staged().length || !msg.trim()) return;
  commit(msg);
  if (!after) return;
  setTimeout(() => {
    if (st.files.length) return; // more to commit first
    push();
    if (after === "pr") setTimeout(() => { st.bDrawer = "pr"; if (!st.prTitle) draftPr(); else render(); }, 950);
  }, 550);
}

addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); nextStep(); return; }
  if (e.altKey && e.key === ".") {
    e.preventDefault();
    const s = step();
    if (st.v === "C") { if (!st.plan) world.querySelector('[data-ai="plan"]')?.click(); }
    else if (s === "changes") draftCommit(); else if (s === "pr") draftPr(); else if (s === "merge") runReview();
    return;
  }
  const t = document.activeElement;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});

world.addEventListener("click", (e) => {
  const t = e.target, q = (s) => t.closest(s);
  let el;
  if ((el = q("[data-stage]"))) { const f = st.files.find((x) => x.p === el.dataset.stage); f.staged = el.checked; render(); return; }
  if ((el = q("[data-ctx]"))) { const id = el.dataset.ctx; st.ctx.has(id) ? st.ctx.delete(id) : st.ctx.add(id); render(); return; }
  if ((el = q("[data-ai]"))) {
    const k = el.dataset.ai;
    if (k === "commit") draftCommit(); else if (k === "pr") draftPr(); else if (k === "review") runReview(); else if (k === "split") splitStage();
    else if (k === "plan") ai("plan", 1500, buildPlan);
    return;
  }
  if ((el = q("[data-act]"))) {
    const a = el.dataset.act; st.bMenu = false;
    if (a === "commit") { commit(st.msg); if (st.v === "A") st.aStep = null; }
    else if (a === "commitpush") { commitThen("push"); st.aStep = null; }
    else if (a === "commitpr") commitThen("pr");
    else if (a === "push") { push(); st.aStep = null; if (st.v === "B") setTimeout(() => { st.bDrawer = "pr"; if (!st.prTitle) draftPr(); else render(); }, 950); }
    else if (a === "pr") { openPr(); st.aStep = null; if (st.v === "B") setTimeout(() => { st.bDrawer = "merge"; render(); }, 950); }
    else if (a === "merge") merge();
    return;
  }
  if ((el = q("[data-astep]"))) { st.aStep = el.dataset.astep; render(); return; }
  if ((el = q("[data-drawer]"))) { st.bDrawer = el.dataset.drawer || null; if (st.bDrawer === "pr" && !st.prTitle) draftPr(); else render(); return; }
  if (q("[data-bmenu]")) { st.bMenu = !st.bMenu; render(); return; }
  if (q("[data-stageall]")) { st.files.forEach((f) => (f.staged = true)); render(); return; }
  if (q("[data-unstageall]")) { st.files.forEach((f) => (f.staged = false)); render(); return; }
  if ((el = q("[data-strat]"))) { st.strategy = el.dataset.strat; render(); return; }
  if ((el = q("[data-delbranch]"))) { st.delBranch = el.checked; render(); return; }
  if ((el = q("[data-prdraft]"))) { st.prDraft = el.checked; render(); return; }
  if ((el = q("[data-fix]"))) { const i = +el.dataset.fix; st.fixed.add(i); sendToClaude(`Fix review note on ${st.review[i].loc}: ${st.review[i].t}`); return; }
  if (q("[data-reset]")) { fresh(st.v); render(); return; }
  if ((el = q("[data-variant]"))) { setVariant(el.dataset.variant, true); return; }
  if ((el = q("[data-ok]"))) { st.plan.find((c) => c.id === el.dataset.ok).state = "ok"; render(); return; }
  if ((el = q("[data-unok]"))) { st.plan.find((c) => c.id === el.dataset.unok).state = "draft"; render(); return; }
  if ((el = q("[data-drop]"))) { st.plan = st.plan.filter((c) => c.id !== el.dataset.drop); render(); return; }
  if (q("[data-okall]")) { st.plan.forEach((c) => { if (c.state === "draft") c.state = "ok"; }); render(); return; }
  if (q("[data-run]")) { runApproved(); return; }
  if ((el = q("[data-sel]"))) { st.sel = el.dataset.sel; render(); return; }
});
world.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.field) {
    const was = !!st[t.dataset.field];
    st[t.dataset.field] = t.value;
    if (t.dataset.field === "msg") st.msgAi = false; else st.prAi = false;
    t.classList.remove("ghost");
    if (was !== !!t.value) render(); // enable/disable buttons
  } else if (t.dataset.plan) {
    st.plan.find((c) => c.id === t.dataset.plan)[t.dataset.pfield] = t.value;
  }
});

const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
setVariant(ORDER.includes(initial) ? initial : "A", false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
</body>
</html>
