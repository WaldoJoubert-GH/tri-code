<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tri-code · branch status prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser.
  Question: "Where and how should tri-code show which branch a project is on and whether it has
  modified / added / untracked files (a glanceable `git status`), without opening the git window?"

  Four structurally different placements, switchable from the floating bar (also ← / → keys).
  URL keeps the choice: branch-status.html?variant=B (served) or branch-status.html#B (file://).
    A · Sidebar rows   — every project (and worktree) row carries its branch and change counts.
    B · Toolbar chip   — one chip beside the path for the active project; click → git status popover.
    C · Status line    — VS Code-style segment bottom-left; hover shows the short status.
    D · Window bars    — each terminal's title bar shows the branch of the folder it runs in.

  The "scenario" button on the bar cycles git states so you can see edge cases:
  clean, dirty, ahead/behind, detached HEAD, a lot of files, not a repo.

  How it would map into the app (not built here):
  - Data already exists: `git_status` (src-tauri/src/git.rs) returns branch, upstream, ahead,
    behind and files[{path,x,y}]; src/git.ts keeps it per project. A cheap poll (or a refresh on
    window focus / after an agent turn) would feed the indicator for every project, not only the
    one with the git window open.
  - A click on any indicator opens/focuses the project's git window (Alt+G).
-->
<style>
:root {
  --bg: #fbfbfc; --panel: #f1f2f5; --canvas: #e6e8ed; --line: #d9dce3; --hover: #e6e8ee;
  --raised: #dfe2ea; --text: #23262d; --muted: #6b7080; --warn: #9a6400; --ok: #3d7a1c;
  --bad: #c4314b; --violet: #7c4dbd; --shadow: rgba(30,34,44,.22);
  --accent-raw: #7aa2f7; --accent: color-mix(in oklab, var(--accent-raw) 76%, #000);
  --ui: system-ui, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0f12; --panel: #15171c; --canvas: #0b0c0f; --line: #24272f; --hover: #1c1f26;
    --raised: #232733; --text: #d6d8de; --muted: #7d828f; --warn: #e0af68; --ok: #9ece6a;
    --bad: #f7768e; --violet: #bb9af7; --shadow: rgba(0,0,0,.8);
    --accent: var(--accent-raw);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui); overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; background: var(--panel); }

.app { display: grid; height: 100%; grid-template-columns: 240px 1fr; grid-template-rows: 34px 1fr 26px;
  grid-template-areas: "side top" "side canvas" "side status"; }
aside { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); padding: 4px 6px 8px; overflow-y: auto; }
.side-head { display: flex; align-items: center; height: 26px; padding-left: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
aside h2 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.project { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; cursor: pointer; min-width: 0; }
.project:hover { background: var(--hover); }
.project.active { background: color-mix(in srgb, var(--pa) 16%, var(--raised)); }
.swatch { width: 8px; height: 8px; border-radius: 2px; background: var(--pa); flex: none; }
.project .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project .count { color: var(--muted); font-size: 11px; }
.wt { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 22px; border-radius: 5px; font-size: 12px; color: var(--muted); cursor: pointer; min-width: 0; }
.wt:hover { background: var(--hover); }
.wt .bn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }

.top { grid-area: top; display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.top .tabsnew button { padding: 0 10px; color: var(--muted); height: 100%; }
.top .sep { width: 1px; background: var(--line); margin: 7px 6px; }
.top .where { align-self: center; padding: 0 8px 0 12px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; }
.top .tool { padding: 0 10px; color: var(--muted); }

.viewport { grid-area: canvas; position: relative; overflow: hidden; background: var(--canvas); }
.world { position: absolute; inset: 0; display: grid; gap: 12px; padding: 12px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
.world > .win:first-child { grid-row: span 2; }
.win { display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.win.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.bar { height: 28px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); white-space: nowrap; overflow: hidden; }
.win.focused .bar { color: var(--text); }
.bar .kind { font-weight: 600; }
.bar .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.screen { flex: 1; margin: 0; padding: 8px 10px; overflow: hidden; white-space: pre; font: 12.5px/17px var(--mono); }
.c-m { color: var(--muted); } .c-a { color: var(--accent); } .c-o { color: var(--ok); } .c-w { color: var(--warn); } .c-b { color: var(--bad); }

.status { grid-area: status; display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; white-space: nowrap; }
.status .hints { margin-left: auto; display: flex; gap: 12px; }

/* ---- shared indicator bits ---- */
.br { font-family: var(--mono); font-size: 11.5px; display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.br .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br svg { flex: none; }
.cnt { font: 10.5px var(--mono); display: inline-flex; gap: 5px; flex: none; }
.cnt .M { color: var(--warn); } .cnt .A { color: var(--ok); } .cnt .D { color: var(--bad); } .cnt .U { color: var(--muted); }
.ab { font: 10.5px var(--mono); color: var(--muted); flex: none; }
.dirty { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }
.det { color: var(--bad); }

/* A · sidebar */
.project .meta { display: none; }
.vA .project { flex-wrap: wrap; row-gap: 1px; }
.vA .project .meta { display: flex; width: 100%; padding-left: 14px; gap: 8px; align-items: center; color: var(--muted); min-width: 0; }
.vA .project .meta .br { flex: 1; }

/* B · toolbar chip */
.chipB { display: none; align-self: center; height: 24px; padding: 0 8px; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); max-width: 360px; min-width: 0; }
.chipB:hover { background: var(--hover); }
.chipB.isdirty { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.vB .chipB { display: inline-flex; }
.pop { position: absolute; z-index: 20; width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 16px 40px -12px var(--shadow); font-size: 12px; overflow: hidden; }
.pop .ph { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.pop .ph .l2 { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.pop .sec { padding: 6px 10px 2px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.pop .f { display: flex; gap: 8px; padding: 2px 10px; font: 12px var(--mono); }
.pop .f .s { width: 14px; font-weight: 700; text-align: center; flex: none; }
.pop .f .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .f .s.M { color: var(--warn); } .pop .f .s.A { color: var(--ok); } .pop .f .s.D { color: var(--bad); } .pop .f .s.U { color: var(--muted); }
.pop .more { padding: 2px 10px; color: var(--muted); font-size: 11px; }
.pop .pf { margin-top: 6px; padding: 7px 10px; border-top: 1px solid var(--line); display: flex; gap: 8px; color: var(--muted); font-size: 11px; }
.pop .pf b { color: var(--accent); font-weight: 600; cursor: pointer; }
.pop .clean { padding: 10px; color: var(--muted); }

/* C · status line */
.segC { display: none; align-items: center; gap: 8px; height: 100%; padding: 0 8px; margin-left: -10px; color: var(--text); cursor: pointer; min-width: 0; }
.vC .segC { display: inline-flex; }
.vC .segC:empty { display: none; }

/* D · window bars */
.barD { display: none; align-items: center; gap: 6px; padding: 1px 6px; border-radius: 4px; background: var(--raised); color: var(--text); max-width: 55%; min-width: 0; }
.vD .barD { display: inline-flex; }
.vD .bar .ttl { flex: 0 1 auto; }
.vD .bar .sp { flex: 1; }

/* ---- prototype bar ---- */
.proto-bar { position: fixed; right: 24px; bottom: 40px; z-index: 9999; display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 8px;
  background: #14161cf2; color: #e8eaf0; border: 1px solid #3a3f4d; border-radius: 12px; box-shadow: 0 14px 44px -10px rgba(0,0,0,.65); font: 12px/1.35 var(--ui); }
.proto-bar .tag { font: 600 9.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #9aa3b8; border: 1px solid #3a3f4d; border-radius: 999px; padding: 4px 7px; }
.proto-bar button.arrow { width: 26px; height: 26px; border-radius: 7px; color: #cfd5e4; font-size: 15px; }
.proto-bar button.arrow:hover, .proto-bar button.scn:hover { background: #262b36; color: #fff; }
.proto-bar .cur { width: 230px; }
.proto-bar .cur b { font: 600 12px var(--mono); color: #fff; }
.proto-bar .cur span { display: block; color: #9aa3b8; font-size: 11px; }
.proto-bar button.scn { height: 26px; padding: 0 9px; border-radius: 7px; border: 1px solid #3a3f4d; color: #cfd5e4; font-size: 11.5px; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="side"></aside>
  <div class="top">
    <div class="tabsnew"><button>claude</button><button>pi</button><button>shell</button><button>+</button></div>
    <div class="sep"></div>
    <span class="where">~/Projects/tri-code</span>
    <button class="chipB" id="chipB"></button>
    <span class="grow"></span>
    <button class="tool">◐ Appearance</button><button class="tool">?</button>
  </div>
  <div class="viewport"><div class="world" id="world"></div></div>
  <div class="status">
    <span class="segC" id="segC"></span>
    <span>claude · tri-code</span>
    <div class="hints"><span><kbd>Alt</kbd><kbd>G</kbd> git</span><span><kbd>Alt</kbd><kbd>T</kbd> go to file</span></div>
  </div>
</div>

<div class="proto-bar">
  <span class="tag">prototype</span>
  <button class="arrow" id="prev" title="Previous variant (←)">‹</button>
  <div class="cur"><b id="vlabel">A</b><span id="vdesc"></span></div>
  <button class="arrow" id="next" title="Next variant (→)">›</button>
  <button class="scn" id="scn" title="Cycle git scenario (S)"></button>
</div>

<script>
const BRANCH_SVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>`;

// x/y are porcelain v2 codes as GitStatus.files carries them ("." = unchanged, "?" = untracked).
const f = (path, x, y) => ({ path, x, y });
const MANY = Array.from({ length: 34 }, (_, i) => f(`src/feature/part${i}.ts`, i % 3 ? "." : "M", i % 3 ? "M" : "."));
const SCENARIOS = [
  { key: "dirty", label: "dirty: 2 staged, 3 changed, 1 untracked",
    st: { branch: "feat/branch-indicator", upstream: "origin/feat/branch-indicator", ahead: 0, behind: 0,
      files: [f("src/Sidebar.tsx", "M", "."), f("src/branch.ts", "A", "."), f("src/git.ts", ".", "M"),
              f("src/styles.css", ".", "M"), f("README.md", ".", "D"), f("design/branch-status.html", "?", "?")] } },
  { key: "clean", label: "clean, in sync",
    st: { branch: "main", upstream: "origin/main", ahead: 0, behind: 0, files: [] } },
  { key: "ahead", label: "clean, ↑3 ↓1 vs upstream",
    st: { branch: "fix/ssh-timeout", upstream: "origin/fix/ssh-timeout", ahead: 3, behind: 1, files: [] } },
  { key: "noup", label: "new branch, never pushed",
    st: { branch: "spike/very-long-branch-name-for-the-issue-tri-142-checking-truncation", upstream: null, ahead: 2, behind: 0,
      files: [f("src/App.tsx", ".", "M")] } },
  { key: "detached", label: "detached HEAD (rebase)",
    st: { branch: null, sha: "a298627", upstream: null, ahead: 0, behind: 0, files: [f("src/issues.ts", "M", "M")] } },
  { key: "many", label: "34 files changed",
    st: { branch: "refactor/files", upstream: "origin/refactor/files", ahead: 0, behind: 0, files: MANY } },
  { key: "norepo", label: "not a git repo", st: null },
];

// Other projects in the sidebar keep a fixed state so A shows a mixed list.
const OTHERS = [
  { env: "local", name: "dotfiles", pa: "#9ece6a", st: { branch: "main", upstream: "origin/main", ahead: 0, behind: 0, files: [] } },
  { env: "devbox", name: "infra", pa: "#ff9e64", st: { branch: "ops/terraform-1.9", upstream: "origin/ops/terraform-1.9", ahead: 1, behind: 0, files: [f("main.tf", ".", "M")] } },
  { env: "devbox", name: "notes", pa: "#bb9af7", st: null },
];
const WORKTREE = { branch: "feat/issue-sources", st: { branch: "feat/issue-sources", upstream: "origin/feat/issue-sources", ahead: 0, behind: 2, files: [f("src/IssuesPanel.tsx", ".", "M"), f("src/issues.ts", ".", "M")] } };

const VARIANTS = {
  A: "Sidebar rows — every project & worktree",
  B: "Toolbar chip + git status popover",
  C: "Status line segment, hover for files",
  D: "Each window's title bar",
};
const KEYS = Object.keys(VARIANTS);
let variant = (new URLSearchParams(location.search).get("variant") || location.hash.slice(1) || "C").toUpperCase();
if (!KEYS.includes(variant)) variant = "A";
let scn = 0;

// ---- derive counts like `git status --short` ----
function counts(st) {
  const c = { A: 0, M: 0, D: 0, U: 0 };
  for (const x of st?.files ?? []) {
    if (x.x === "?") c.U++;
    else if (x.x === "A") c.A++;
    else if (x.x === "D" || x.y === "D") c.D++;
    else c.M++;
  }
  return c;
}
const total = (st) => st?.files.length ?? 0;
const esc = (s) => s.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));

function branchHtml(st) {
  if (!st) return `<span class="br c-m">no git</span>`;
  const nm = st.branch ? esc(st.branch) : `<span class="det">HEAD ${st.sha}</span>`;
  return `<span class="br" title="${st.branch ?? "detached at " + st.sha}">${BRANCH_SVG}<span class="nm">${nm}</span></span>`;
}
function countsHtml(st) {
  if (!st) return "";
  const c = counts(st);
  const parts = [["A", "+"], ["M", "~"], ["D", "−"], ["U", "?"]].filter(([k]) => c[k]).map(([k, s]) => `<span class="${k}">${s}${c[k]}</span>`);
  return parts.length ? `<span class="cnt">${parts.join("")}</span>` : "";
}
function abHtml(st) {
  if (!st) return "";
  if (!st.upstream && st.branch) return `<span class="ab" title="no upstream">☁︎✕${st.ahead ? " ↑" + st.ahead : ""}</span>`;
  const s = [st.ahead ? "↑" + st.ahead : "", st.behind ? "↓" + st.behind : ""].filter(Boolean).join(" ");
  return s ? `<span class="ab">${s}</span>` : "";
}

// ---- the active project's state ----
const cur = () => SCENARIOS[scn].st;

function renderSide() {
  const row = (name, pa, st, active, count) => `
    <div class="project${active ? " active" : ""}" style="--pa:${pa}">
      <span class="swatch"></span><span class="name">${name}</span>
      ${variant === "A" ? "" : total(st) ? `<span class="dirty" title="uncommitted changes"></span>` : ""}
      <span class="count">${count}</span>
      <div class="meta">${branchHtml(st)}${countsHtml(st)}${abHtml(st)}</div>
    </div>`;
  const wt = variant === "A" ? `
    <div class="wt"><span class="br">${BRANCH_SVG}</span><span class="bn">${WORKTREE.branch}</span>${countsHtml(WORKTREE.st)}${abHtml(WORKTREE.st)}</div>`
    : `<div class="wt"><span class="br">${BRANCH_SVG}</span><span class="bn">${WORKTREE.branch}</span></div>`;
  let html = `<div class="side-head">Projects</div><h2>local</h2>${row("tri-code", "#7aa2f7", cur(), true, 3)}${wt}`;
  html += row(OTHERS[0].name, OTHERS[0].pa, OTHERS[0].st, false, 1);
  html += `<h2>devbox</h2>` + OTHERS.slice(1).map((o) => row(o.name, o.pa, o.st, false, 1)).join("");
  document.getElementById("side").innerHTML = html;
}

function compact(st) {
  if (!st) return `<span class="br c-m">no git</span>`;
  return `${branchHtml(st)}${countsHtml(st)}${abHtml(st)}`;
}

function renderChip() {
  const el = document.getElementById("chipB");
  el.innerHTML = compact(cur());
  el.classList.toggle("isdirty", total(cur()) > 0);
}
function renderSeg() {
  const el = document.getElementById("segC");
  const st = cur();
  el.innerHTML = st ? `${branchHtml(st)}${total(st) ? "<span>*</span>" : ""}${abHtml(st)}${countsHtml(st)}` : "";
}

function renderWorld() {
  const st = cur();
  const win = (kind, ttl, wst, focused, body) => `
    <div class="win${focused ? " focused" : ""}">
      <div class="bar"><span class="dot"></span><span class="kind">${kind}</span><span class="ttl">${ttl}</span>
        <span class="sp"></span><span class="barD">${compact(wst)}</span></div>
      <pre class="screen">${body}</pre>
    </div>`;
  document.getElementById("world").innerHTML =
    win("claude", "tri-code", st, true,
      `<span class="c-a">●</span> I've added the branch indicator to the sidebar.\n\n  <span class="c-m">⎿ Edited src/Sidebar.tsx (+24 −3)\n  ⎿ Created src/branch.ts</span>\n\n<span class="c-m">&gt;</span> `) +
    win("shell", "~/Projects/tri-code", st, false,
      `<span class="c-o">❯</span> bun run typecheck\n<span class="c-m">$ tsc --noEmit</span>\n<span class="c-o">❯</span> `) +
    win("claude", "worktree · issue-sources", WORKTREE.st, false,
      `<span class="c-m">Waiting for input…</span>\n<span class="c-m">&gt;</span> `);
}

// ---- popover (B: click, C: hover) ----
let pop = null;
function closePop() { pop?.remove(); pop = null; }
function openPop(anchor, below) {
  closePop();
  const st = cur();
  pop = document.createElement("div");
  pop.className = "pop";
  if (!st) pop.innerHTML = `<div class="clean">Not a git repository.</div>`;
  else {
    const stagedF = st.files.filter((x) => x.x !== "." && x.x !== "?");
    const changed = st.files.filter((x) => x.y !== "." && x.x !== "?");
    const untracked = st.files.filter((x) => x.x === "?");
    const line = (code, p) => `<div class="f"><span class="s ${code === "?" ? "U" : code}">${code}</span><span class="p">${esc(p)}</span></div>`;
    const sec = (title, list, pick) => !list.length ? "" :
      `<div class="sec">${title} · ${list.length}</div>${list.slice(0, 8).map((x) => line(pick(x), x.path)).join("")}${list.length > 8 ? `<div class="more">+${list.length - 8} more</div>` : ""}`;
    const up = st.branch ? (st.upstream ? `tracking ${st.upstream}${st.ahead || st.behind ? ` · ↑${st.ahead} ↓${st.behind}` : " · up to date"}` : "no upstream — not pushed yet") : `detached at ${st.sha}`;
    pop.innerHTML = `<div class="ph">${branchHtml(st)}<span class="l2">${up}</span></div>` +
      (st.files.length
        ? sec("Staged", stagedF, (x) => x.x) + sec("Changes", changed, (x) => x.y) + sec("Untracked", untracked, () => "?")
        : `<div class="clean">Nothing to commit, working tree clean.</div>`) +
      `<div class="pf"><b>Open git window</b><span>Alt+G</span></div>`;
  }
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left, innerWidth - 392) + "px";
  if (below) pop.style.top = r.bottom + 6 + "px";
  else pop.style.bottom = innerHeight - r.top + 6 + "px";
}
document.getElementById("chipB").addEventListener("click", (e) => { e.stopPropagation(); pop ? closePop() : openPop(e.currentTarget, true); });
document.getElementById("segC").addEventListener("mouseenter", (e) => openPop(e.currentTarget, false));
document.getElementById("segC").addEventListener("mouseleave", closePop);
document.addEventListener("click", closePop);

// ---- switcher ----
function render() {
  document.getElementById("app").className = "app v" + variant;
  document.getElementById("vlabel").textContent = variant;
  document.getElementById("vdesc").textContent = VARIANTS[variant];
  document.getElementById("scn").textContent = "scenario: " + SCENARIOS[scn].label;
  closePop();
  renderSide(); renderChip(); renderSeg(); renderWorld();
}
function go(d) {
  variant = KEYS[(KEYS.indexOf(variant) + d + KEYS.length) % KEYS.length];
  if (location.protocol === "file:") location.hash = variant;
  else history.replaceState(null, "", "?variant=" + variant);
  render();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("scn").onclick = (e) => { e.stopPropagation(); scn = (scn + 1) % SCENARIOS.length; render(); };
addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key.toLowerCase() === "s") document.getElementById("scn").click();
});
render();
</script>
</body>
</html>
