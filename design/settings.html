<title>tri-code · settings prototype</title>
<!--
  PROTOTYPE: throwaway. Not imported by the app; open this file directly in a browser.
  Question: "Where do app-wide settings live, and how does a user choose what opening a file does?"

  OUTCOME (picked 2026-10-21): variant D, in context, plus a Settings button at the foot of the
  sidebar that opens a small popover (Opening a file, Gap between windows). "Ask each time" is the
  default and one of the modes. Built in src/Settings.tsx, openFile in src/files.ts (ask, tabs,
  preview), FileView.tsx (⋯ menu, ask card, tab strip, preview) and `settings` in state.json.

  Today (v0.1.23) a click in the files window, or Enter in Go to File, always reuses the most
  recently used `file` window (openFile in src/files.ts). Ctrl+Enter / Ctrl+click open a new one.
  There is no app-wide settings surface: the gap lives in the status bar, the rest is per project
  (Appearance, Alt+P).

  The setting being decided, "Opening a file", has four modes. All four work in every variant:
    reuse   · Replace the file in the last file window (today's behaviour)
    window  · Every file gets its own window on the canvas
    tabs    · One file window, a tab per file inside it
    preview · A click previews (replaces the preview window, title in italics); double-click the
              title, or Keep, makes it a normal window, and the next click opens a fresh preview
  In every mode a file that is already open is focused, not opened twice, and Ctrl+click does the
  opposite (a new window, or in "window" mode, reuse the last one).

  Four structurally different settings surfaces, switchable from the floating bar (also ← / →):
    A · Popover: a gear in the toolbar opens a compact popover, the same shape as Appearance.
    B · Settings window: Settings is a canvas Window (TabKind "settings") with a search box and
        every setting in one scrolling list. Opens beside your files, so you change and try at once.
    C · Dialog: a modal with category tabs; file opening is picked from illustrated cards.
    D · In context: no settings page. The choice is asked the first time you open a second file,
        with "remember", and changed later from the file window's ⋯ menu.

  Try it: click files in the files window (left tile), Ctrl+click, double-click a preview title.
  The "state" button on the bar shows what would persist in state.json (`settings`) and the
  windows on the canvas. Nothing persists.
-->

<script>

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  "src-tauri/src/git.rs": ["/// Go to File's index: tracked plus untracked-but-not-ignored", "#[tauri::command]", "pub async fn project_files(host: String, path: String)", "    -> Result<FileIndex, String> {", "    blocking(move || match multi(&host, &path, CMDS) {", "        …"],

/* ---------- settings: what state.json would keep under `settings` ---------- */
const MODES = {
  reuse: { name: "Reuse the last file window", short: "Replace", help: "The file replaces what the last file window shows. Today's behaviour." },
  window: { name: "A new window per file", short: "New window", help: "Every file gets its own window on the canvas." },

/* ---------- the app model ---------- */
let S, uid = 1, clock = 1;
function fresh(v) {
  const files = { id: "w" + uid++, kind: "files" };
  const agent = { id: "w" + uid++, kind: "claude" };
  const first = { id: "w" + uid++, kind: "file", tabs: ["src/files.ts"], at: 0, preview: false, used: clock++ };
  return {
    v, settings: { ...DEFAULTS(), fileOpen: v === "D" ? null : "reuse" },
    wins: [files, first, agent], focus: first.id, flash: "", lastFlash: null,
    pop: false, dlg: null, menu: null, ask: null, q: "",
  };
}
const fileWins = () => S.wins.filter((w) => w.kind === "file");
const lastFileWin = () => fileWins().sort((a, b) => b.used - a.used)[0];
const openPaths = () => new Set(fileWins().flatMap((w) => w.tabs));
const pathOf = (w) => w.tabs[w.at];
function flash(m) { S.flash = m; clearTimeout(S.ft); S.ft = setTimeout(() => { S.flash = ""; render(); }, 3500); }
function touch(w) { w.used = clock++; S.focus = w.id; S.lastFlash = w.id; }

/** The heart of it: what a click (or Enter in Go to File) on `path` does under the current setting. */
function openFile(path, ctrl) {
  const mode = S.settings.fileOpen;
  // already open somewhere: focus it, never open twice
  for (const w of fileWins()) {
    const i = w.tabs.indexOf(path);
    if (i >= 0) { w.at = i; touch(w); return flash(`${path} is already open: focused it`); }
  }
  if (mode === null) {
    // variant D, nothing chosen yet: the first file reuses; the second one asks
    const w = lastFileWin();
    if (!w) return newWin(path, false);
    S.ask = { path, win: w.id, remember: true };
    return;
  }
  let how = mode;
  if (ctrl && S.settings.ctrlOpposite) how = mode === "window" ? "reuse" : "window";
  const last = lastFileWin();
  if (how === "window" || !last) return newWin(path, how === "preview");
  if (how === "reuse") { last.tabs = [path]; last.at = 0; last.preview = false; touch(last); return flash(ctrl ? `Ctrl: ${path} replaced the last file window` : ""); }
  if (how === "tabs") {
    last.tabs.push(path); last.at = last.tabs.length - 1; last.preview = false; touch(last); return;
  }
  if (how === "preview") {
    const pv = fileWins().find((w) => w.preview);
    if (pv) { pv.tabs = [path]; pv.at = 0; touch(pv); return; }
    return newWin(path, true);
  }
}
function newWin(path, preview) {
  const w = { id: "w" + uid++, kind: "file", tabs: [path], at: 0, preview, used: clock++ };
  const i = S.wins.findIndex((x) => x.kind === "claude");
  S.wins.splice(i < 0 ? S.wins.length : i, 0, w);
  touch(w);
}
function keep(id) { const w = S.wins.find((x) => x.id === id); if (w?.preview) { w.preview = false; flash(`kept ${pathOf(w)}: the next click opens a new preview`); } }
function closeWin(id) {
  S.wins = S.wins.filter((w) => w.id !== id);
  if (S.focus === id) S.focus = (lastFileWin() ?? S.wins[0])?.id;
}
function closeTab(id, i) {
  const w = S.wins.find((x) => x.id === id);
  w.tabs.splice(i, 1);
  if (!w.tabs.length) return closeWin(id);
  w.at = Math.min(w.at, w.tabs.length - 1);
}
function setSetting(k, v) {
  S.settings[k] = v;
  if (k === "theme") document.documentElement.dataset.theme = v === "system" ? "" : v;
  if (k === "fileOpen" && v !== "tabs") {
    // leaving tabs: each extra tab becomes its own window so nothing silently closes
    for (const w of fileWins()) {
      if (w.tabs.length < 2) continue;
      const others = w.tabs.filter((_, i) => i !== w.at);
      w.tabs = [pathOf(w)]; w.at = 0;
      for (const p of others) newWin(p, false);
    }
  }
  if (k === "fileOpen" && v !== "preview") for (const w of fileWins()) w.preview = false;
}
function openSettings() {
  if (S.v === "A") S.pop = !S.pop;
  else if (S.v === "B") {
    const w = S.wins.find((x) => x.kind === "settings");
    if (w) { S.focus = w.id; S.lastFlash = w.id; }
    else { const n = { id: "w" + uid++, kind: "settings", used: 0 }; S.wins.splice(1, 0, n); S.focus = n.id; S.lastFlash = n.id; }
  } else if (S.v === "C") S.dlg = S.dlg ? null : { tab: "files" };
}

/* ---------- setting controls (shared building blocks, laid out differently per variant) ---------- */
const SETTINGS = [
  { k: "fileOpen", group: "Files", label: "Opening a file", help: "What a click in the files window, or Enter in Go to File, does.", wide: true },
  { k: "ctrlOpposite", group: "Files", label: "Ctrl+click does the opposite", help: "Ctrl+click opens a new window, or in “new window” mode reuses the last one." },
  { k: "gotoIgnored", group: "Files", label: "Ignored files in Go to File", help: "List gitignored files like .env (not whole ignored folders like node_modules)." },
  { k: "theme", group: "Appearance", label: "Theme", help: "System follows the OS light or dark mode." },
  { k: "gap", group: "Windows", label: "Gap between windows", help: "Also Alt+, and Alt+. (and the status bar)." },
];
function control(s, hl = (x) => esc(x)) {
  const v = S.settings[s.k];
  if (s.k === "fileOpen") return Object.entries(MODES).map(([m, d]) => `
    <label class="radio"><input type="radio" name="fo-${S.v}" data-set="fileOpen" value="${m}" ${v === m ? "checked" : ""}>
    <span>${hl(d.name)}<small>${hl(d.help)}</small></span></label>`).join("");
  if (s.k === "theme") return `<div class="seg">${["system", "light", "dark"].map((t) => `<button data-seg="theme" data-val="${t}" class="${v === t ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>`;
  if (s.k === "gap") return `<select data-set="gap">${[0, 4, 8, 12, 16, 24].map((g) => `<option ${v === g ? "selected" : ""}>${g}</option>`).join("")}</select>`;
  return `<input type="checkbox" data-set="${s.k}" ${v ? "checked" : ""}>`;
}

/* ---------- render ---------- */
const GEAR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`;

function render() {
  const showGear = S.v !== "D";
  const tabs = S.wins.filter((w) => w.kind !== "files").map((w) => {
    const name = w.kind === "file" ? pathOf(w).split("/").pop() + (w.tabs.length > 1 ? ` +${w.tabs.length - 1}` : "") : w.kind;
    return `<button class="tab ${S.focus === w.id ? "on" : ""} ${w.preview ? "pv" : ""}" data-focus="${w.id}">${esc(name)}</button>`;
  }).join("");
  const gearOn = (S.v === "A" && S.pop) || (S.v === "C" && S.dlg) || (S.v === "B" && S.wins.some((w) => w.kind === "settings"));
  const rest = S.wins.filter((w) => w.kind !== "files");
  const cols = rest.length <= 2 ? 1 : rest.length <= 4 ? 2 : 3;
  $("root").innerHTML = `
  <div class="app">
    <aside>
      <h2>Local</h2>
      <div class="project active"><span class="swatch">T</span>tri-code<span class="count">${S.wins.length}</span></div>
      <div class="project"><span class="swatch" style="background:var(--raised);color:var(--text)">D</span>dotfiles</div>
    </aside>
    <div class="top">
      <div class="spaces"><button class="cur">1</button><button>2</button><button>3</button></div>
      <div class="tabs">${tabs}</div>
      <div class="where">~/Projects/tri-code</div>
      <button class="tool">Appearance</button>
      ${showGear ? `<button class="tool ${gearOn ? "on" : ""}" id="gear" data-act="settings" title="Settings (Ctrl+,)">${GEAR}Settings</button>` : ""}
      <button class="tool">?</button>
    </div>
    <div class="viewport">
      <div class="world" style="--gap:${S.settings.gap}px">
        ${winHtml(S.wins.find((w) => w.kind === "files"))}
        <div class="rest" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr))">${rest.map(winHtml).join("")}</div>
      </div>
      ${S.v === "A" && S.pop ? popHtml() : ""}
      ${S.v === "C" && S.dlg ? dlgHtml() : ""}
    </div>
    <div class="status">
      <span>gap ${S.settings.gap}</span>
      <span>opening a file: <b style="color:var(--text)">${S.settings.fileOpen ? MODES[S.settings.fileOpen].short : "ask the first time"}</b></span>
      <span class="flash">${esc(S.flash)}</span>
    </div>
  </div>`;
  S.lastFlash = null;
  if (!$("drawer").hidden) drawer();
  const qi = $("swq");
  if (qi && S.keepFocus) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); S.keepFocus = false; }
}

function winHtml(w) {
  if (!w) return "";
  const cls = `win ${S.focus === w.id ? "focused" : ""} ${S.lastFlash === w.id ? "flashin" : ""}`;
  const x = `<button class="x" data-close="${w.id}" title="Close">✕</button>`;
  if (w.kind === "files") {
    const open = openPaths();
    const rows = TREE.map((n) => n.f ? fileRow(n.f, 0, open) : `<div class="row dir"><span class="ic">▾</span>${esc(n.d)}</div>` + n.kids.map((k) => fileRow(`${n.d}/${k}`, 1, open)).join("")).join("");
    return `<div class="${cls}" data-win="${w.id}"><div class="bar"><span class="kind">files</span><span class="ttl">tri-code</span></div>
      <div class="body tree">${rows}<div class="hint">Click a file. <kbd>Ctrl</kbd>+click ${S.settings.ctrlOpposite ? "does the opposite" : "does the same"}.${S.settings.fileOpen === "preview" ? " Double-click a preview's title to keep it." : ""}</div></div></div>`;
  }
  if (w.kind === "claude") return `<div class="${cls}" data-win="${w.id}"><div class="bar"><span class="kind">claude</span><span class="ttl">fixing Go to File</span>${x}</div>
    <div class="body term"><b>&gt;</b> .env doesn't show in Go to File<br>● Reading src-tauri/src/git.rs<br>● project_files uses --exclude-standard…</div></div>`;
  if (w.kind === "settings") return `<div class="${cls}" data-win="${w.id}"><div class="bar"><span class="kind">settings</span><span class="ttl">tri-code · all projects</span>${x}</div>${settingsWindowHtml()}</div>`;
  // file window
  const p = pathOf(w);
  const ftabs = S.settings.fileOpen === "tabs" || w.tabs.length > 1
    ? `<div class="ftabs">${w.tabs.map((t, i) => `<span class="ft ${i === w.at ? "on" : ""}" data-ftab="${w.id}|${i}">${esc(t.split("/").pop())}<i data-ftclose="${w.id}|${i}" title="Close tab">✕</i></span>`).join("")}</div>` : "";
  const more = S.v === "D" ? `<button class="more" data-menu="${w.id}" title="Window options">⋯</button>` : "";
  const keepBtn = w.preview ? `<span class="pvtag">preview</span><button class="keep" data-keep="${w.id}" title="Keep this file open (or double-click the title)">Keep</button>` : "";
  return `<div class="${cls}" data-win="${w.id}">
    <div class="bar"><span class="kind">file</span><span class="ttl ${w.preview ? "pv" : ""}" data-ttl="${w.id}" title="${esc(p)}">${esc(p)}</span>${keepBtn}${more}${x}</div>
    ${ftabs}
    <div class="body"><pre class="code">${body(p).map((l) => `<span>${esc(l) || " "}</span>`).join("")}</pre></div>
    ${S.menu === w.id ? menuHtml() : ""}
    ${S.ask?.win === w.id ? askHtml() : ""}
  </div>`;
}
function fileRow(f, depth, open) {
  const ign = IGNORED.has(f);
  return `<button class="row ${ign ? "ign" : ""} ${open.has(f) ? "open" : ""}" data-file="${esc(f)}" style="padding-left:${8 + depth * 14}px"><span class="ic">${f.endsWith(".rs") ? "rs" : f.endsWith(".md") ? "md" : f.startsWith(".") ? "··" : "ts"}</span><span class="nm">${esc(f.split("/").pop())}</span></button>`;
}

/* A · popover */
function popHtml() {
  const groups = [...new Set(SETTINGS.map((s) => s.group))];
  return `<div class="pop" role="dialog" aria-label="Settings">
    <header><b>Settings</b><span>every project</span></header>
    ${groups.map((g) => `<h5>${g}</h5>${SETTINGS.filter((s) => s.group === g).map((s) => s.wide
      ? `<div class="set"><span class="lbl">${s.label}</span>${control(s)}</div>`
      : `<div class="set"><label class="chk" style="justify-content:space-between"><span class="lbl">${s.label}</span>${control(s)}</label></div>`).join("")}`).join("")}
  </div>`;
}

/* B · settings window */
function settingsWindowHtml() {
  const q = S.q.trim().toLowerCase();
  const hl = (t) => { if (!q) return esc(t); const i = t.toLowerCase().indexOf(q); return i < 0 ? esc(t) : esc(t.slice(0, i)) + `<mark>${esc(t.slice(i, i + q.length))}</mark>` + esc(t.slice(i + q.length)); };
  const match = (s) => !q || [s.label, s.help, s.group, ...(s.k === "fileOpen" ? Object.values(MODES).flatMap((m) => [m.name, m.help]) : [])].some((t) => t.toLowerCase().includes(q));
  const shown = SETTINGS.filter(match);
  const groups = [...new Set(shown.map((s) => s.group))];
  return `<div class="body sw">
    <div class="search"><svg viewBox="0 0 16 16" width="13" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
      <input id="swq" placeholder="Search settings" value="${esc(S.q)}" spellcheck="false"></div>
    <div class="list">${groups.length ? groups.map((g) => `<h5>${g}</h5>${shown.filter((s) => s.group === g).map((s) => `
      <div class="set ${s.wide ? "wide" : ""}"><span class="lbl">${hl(s.label)}<small>${s.k}</small></span><span class="help">${hl(s.help)}</span><div class="ctl">${control(s, hl)}</div></div>`).join("")}`).join("")
      : `<div class="none">No setting matches “${esc(S.q)}”</div>`}</div>
  </div>`;
}

/* C · dialog */
const DIA = {
  reuse: `<i class="f">tree</i><i class="hl">b.ts</i>`,
  window: `<i class="f">tree</i><div class="col"><i>a.ts</i><i class="hl">b.ts</i></div>`,
  tabs: `<i class="f">tree</i><i class="tb hl">b.ts</i>`,
  preview: `<i class="f">tree</i><div class="col"><i>a.ts</i><i class="pv hl">b.ts</i></div>`,
};
function dlgHtml() {
  const tab = S.dlg.tab;
  const NAV = { files: "Files", windows: "Windows", appearance: "Appearance" };
  let pane = "";
  if (tab === "files") {
    pane = `<div class="set"><span class="lbl">Opening a file</span><span class="help">What a click in the files window, or Enter in Go to File, does.</span>
      <div class="cards">${Object.entries(MODES).map(([m, d]) => `<button class="card ${S.settings.fileOpen === m ? "on" : ""}" data-seg="fileOpen" data-val="${m}">
        <div class="dia">${DIA[m]}</div><b>${d.short}</b><small>${d.help}</small></button>`).join("")}</div></div>
      ${SETTINGS.filter((s) => s.group === "Files" && !s.wide).map((s) => `<div class="set"><label class="chk">${control(s)}<span><span class="lbl">${s.label}</span><br><span class="help">${s.help}</span></span></label></div>`).join("")}`;
  } else if (tab === "windows") {
    const s = SETTINGS.find((x) => x.k === "gap");
    pane = `<div class="set"><span class="lbl">${s.label}</span><span class="help">${s.help}</span>${control(s)}</div>`;
  } else {
    const s = SETTINGS.find((x) => x.k === "theme");
    pane = `<div class="set"><span class="lbl">${s.label}</span><span class="help">${s.help} Per-project accent and background stay in Appearance (Alt+P).</span>${control(s)}</div>`;
  }
  return `<div class="scrim" data-scrim><div class="dlg" role="dialog" aria-label="Settings">
    <header><b>Settings</b><kbd>Esc</kbd></header>
    <nav>${Object.entries(NAV).map(([k, n]) => `<button class="${tab === k ? "on" : ""}" data-dtab="${k}">${n}</button>`).join("")}</nav>
    <div class="pane">${pane}</div>
    <footer><span>Saved as you change them · every project</span><button data-act="dlgDone">Done</button></footer>
  </div></div>`;
}

/* D · in context */
function menuHtml() {
  const v = S.settings.fileOpen;
  return `<div class="menu" style="right:30px;top:30px">
    <h6>Opening a file</h6>
    ${Object.entries(MODES).map(([m, d]) => `<button data-seg="fileOpen" data-val="${m}"><span class="ck">${v === m ? "✓" : ""}</span>${d.short}<small>${m === "reuse" ? "today" : ""}</small></button>`).join("")}
    <button data-seg="fileOpen" data-val="__ask"><span class="ck">${v === null ? "✓" : ""}</span>Ask each time</button>
    <h6>This window</h6>
    <button data-close="${S.menu}"><span class="ck"></span>Close<small>Alt Q</small></button>
  </div>`;
}
function askHtml() {
  const w = S.wins.find((x) => x.id === S.ask.win);
  const cur = pathOf(w).split("/").pop(), nxt = S.ask.path.split("/").pop();
  return `<div class="ask" role="dialog" aria-label="Open file">
    <p>Open <code>${esc(nxt)}</code> with <code>${esc(cur)}</code> still open?</p>
    <div class="opts">
      <button data-answer="window">Beside it</button>
      <button data-answer="tabs">As a tab</button>
      <button data-answer="reuse">Replace ${esc(cur)}</button>
      <button data-answer="preview">Preview</button>
    </div>
    <label><input type="checkbox" id="remember" ${S.ask.remember ? "checked" : ""}> Remember (change it later from ⋯ on any file window)</label>
  </div>`;
}

function drawer() {
  const wins = S.wins.map((w) => w.kind === "file" ? { kind: "file", tabs: w.tabs, ...(w.tabs.length > 1 ? { active: w.at } : {}), ...(w.preview ? { preview: true } : {}) } : { kind: w.kind });
  $("drawer").innerHTML = `<h5>state.json · settings</h5><pre>${esc(JSON.stringify(S.settings, null, 2))}</pre>
    <h5>canvas windows (runtime)</h5><pre>${esc(JSON.stringify(wins, null, 1))}</pre>`;
}

/* ---------- variants ---------- */
const ORDER = ["A", "B", "C", "D"];
const NAMES = { A: "Popover", B: "Settings window", C: "Dialog", D: "In context" };
const DESC = {
  A: "A gear in the toolbar opens a compact popover, like Appearance",
  B: "Settings is a canvas window with search, beside your files",
  C: "A modal with tabs; file opening picked from illustrated cards",
  D: "No settings page: asked on the second file, changed from ⋯",
};
function setVariant(v, push) {
  if (!ORDER.includes(v)) v = "A";
  document.documentElement.dataset.theme = "";
  S = fresh(v);
  if (v === "B") openSettings();
  $("vlabel").textContent = `${v} · ${NAMES[v]}`;
  $("vdesc").textContent = DESC[v];
  if (push) {
    try {
      if (location.protocol === "file:") history.replaceState(null, "", "#" + v);
      else { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
    } catch { /* ignore */ }
  }
  render();
}
function cycle(d) { setVariant(ORDER[(ORDER.indexOf(S.v) + d + ORDER.length) % ORDER.length], true); }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target, g = (sel) => t.closest(sel);
  if (g(".proto-bar, .drawer")) return;
  let el;
  if (S.pop && !g(".pop") && !g("#gear")) S.pop = false;
  if (S.menu && !g(".menu") && !g("[data-menu]")) S.menu = null;
  if (t.matches("[data-scrim]")) { S.dlg = null; return render(); }
  if ((el = g("[data-act]"))) {
    const a = el.dataset.act;
    if (a === "settings") openSettings();
    if (a === "dlgDone") S.dlg = null;
    return render();
  }
  if ((el = g("[data-answer]"))) {
    const m = el.dataset.answer, { path } = S.ask, remember = $("remember").checked;
    S.ask = null;
    const before = S.settings.fileOpen;
    S.settings.fileOpen = m;
    openFile(path, false);
    if (!remember) S.settings.fileOpen = before;
    else flash(`remembered: ${MODES[m].short}. Change it from ⋯ on a file window`);
    return render();
  }
  if ((el = g("[data-seg]"))) {
    const v = el.dataset.val;
    setSetting(el.dataset.seg, v === "__ask" ? null : v);
    if (el.closest(".menu")) S.menu = null;
    return render();
  }
  if ((el = g("[data-ftclose]"))) { const [id, i] = el.dataset.ftclose.split("|"); closeTab(id, +i); return render(); }
  if ((el = g("[data-ftab]"))) { const [id, i] = el.dataset.ftab.split("|"); const w = S.wins.find((x) => x.id === id); w.at = +i; touch(w); return render(); }
  if ((el = g("[data-keep]"))) { keep(el.dataset.keep); return render(); }
  if ((el = g("[data-menu]"))) { S.menu = S.menu === el.dataset.menu ? null : el.dataset.menu; return render(); }
  if ((el = g("[data-close]"))) { closeWin(el.dataset.close); S.menu = null; return render(); }
  if ((el = g("[data-dtab]"))) { S.dlg.tab = el.dataset.dtab; return render(); }
  if ((el = g("[data-file]"))) { if (e.detail > 1) return; S.ask = null; openFile(el.dataset.file, e.ctrlKey || e.metaKey); return render(); }
  if ((el = g("[data-focus]"))) { const w = S.wins.find((x) => x.id === el.dataset.focus); S.focus = w.id; if (w.kind === "file") w.used = clock++; return render(); }
  if (g(".ask")) return;
  if ((el = g("[data-win]")) && !g("input, select, label")) { if (S.focus !== el.dataset.win) { S.focus = el.dataset.win; const w = S.wins.find((x) => x.id === S.focus); if (w.kind === "file") w.used = clock++; } return render(); }
  render();
});
document.addEventListener("dblclick", (e) => {
  const el = e.target.closest("[data-ttl]");
  if (el) { keep(el.dataset.ttl); render(); }
});
document.addEventListener("change", (e) => {
  const t = e.target, k = t.dataset?.set;
  if (!k) return;
  setSetting(k, t.type === "checkbox" ? t.checked : k === "gap" ? +t.value : t.value);
  render();
});
document.addEventListener("input", (e) => {
  if (e.target.id === "swq") { S.q = e.target.value; S.keepFocus = true; render(); }
});
addEventListener("keydown", (e) => {
  const t = document.activeElement;
  const typing = t && ((t.tagName === "INPUT" && !["checkbox", "radio"].includes(t.type)) || t.tagName === "SELECT");
  if (e.key === "Escape") { S.pop = false; S.dlg = null; S.menu = null; S.ask = null; return render(); }
  if (e.key === "," && e.ctrlKey && S.v !== "D") { e.preventDefault(); openSettings(); return render(); }
  if (typing) return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});
$("prev").onclick = () => cycle(-1);
$("next").onclick = () => cycle(1);
$("resetBtn").onclick = () => setVariant(S.v, false);
$("stateBtn").onclick = () => { $("drawer").hidden = !$("drawer").hidden; render(); };

const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
setVariant(initial, false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
</body>
