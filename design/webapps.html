<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tri-code · web apps prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser
  (or visit /design/webapps.html on the dev server). Needs the network once for lucide
  (unpkg); without it icons fall back to their names.

  Question: "Can a browser window be set up like an Agent?" A web app would be the same four
  things as an Agent (a name, a lucide icon, an Alt hotkey and a place in the New Window Menu),
  with a URL where the Agent has a command. Opening one makes a browser window at that URL,
  and the window takes the app's icon and name in the Tab Strip and title bar, the way a
  terminal takes its Agent's.

  OUTCOME (settled): variant A — one list. A web app is an Agent with a `url` (state.ts),
  edited in the same agents window row (src/AgentsPanel.tsx TargetField), launched by
  launchAgent (src/agents.ts) and shown with "app" mode in src/Canvas.tsx. The project's
  Favourites are offered under the add row as optional adds. The ssh port forward ("via devbox")
  was not built.

  Three variants, A–C, switchable from the floating bar (also ← / → when no field is
  focused). URL keeps the choice: webapps.html?variant=B (served) or webapps.html#B (file://).
  Every variant uses the same in-memory lists. The + menu, the Tab Strip and the hotkeys follow
  them live: add "grafana", give it Alt+Shift+M and press it. "{} state" on the bar shows what
  would land in state.json.

  A  One list            Agents and web apps share the agents table. The Command cell takes a
                         URL too, and its kind chip (terminal / globe) flips when you type
                         one. Global, like Agents.
  B  Two sections        The agents window gets a second "Web apps" table: icon, name, URL,
                         hotkey and address bar. Global, and its own group in the + menu.
  C  Favourites grow up  No new concept. A project's Favourites get an icon, a hotkey and a
                         "show in +" pin, and they are edited in a table. Per project, since
                         localhost:5173 means something different in each project.

  Shared by all three:
  - Address bar: "full" is today's browser window; "app" hides the nav row and leaves only the
    title bar, like a PWA. ⋯ in the title bar brings the address back for that window.
  - A bare "localhost:5173" gets http://, and anything else without a scheme gets https://.
  - On an ssh project, a localhost URL means the remote box. The window would need a port
    forward, shown here as "via devbox" in the title bar. Try it on the infra project.
  - Hotkey conflicts are checked across agents and web apps together.
-->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>

  --accent-raw: #7aa2f7; --accent: color-mix(in oklab, var(--accent-raw) 76%, #000);

  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0f12; --panel: #15171c; --canvas: #0b0c0f; --line: #24272f; --hover: #1c1f26;
    --raised: #232733; --text: #d6d8de; --muted: #7d828f; --warn: #e0af68; --ok: #9ece6a;
    --bad: #f7768e; --violet: #bb9af7; --scrim: rgba(8,9,11,.6); --shadow: rgba(0,0,0,.8);
    --accent: var(--accent-raw);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
input { font: inherit; color: var(--text); }
kbd {
  font: 10.5px var(--mono); padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 3px; color: var(--muted); background: var(--bg); white-space: nowrap;
}
svg.lucide { width: 14px; height: 14px; stroke-width: 2; flex: none; display: block; }
.ic { display: inline-grid; place-items: center; flex: none; }
.ic-miss { font: 9px var(--mono); color: var(--muted); }

/* ---- app shell ---- */
.app {

aside h2 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.project { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 8px; border-radius: 5px; text-align: left; }
.project:hover { background: var(--hover); }
.project.active { background: color-mix(in srgb, var(--pa) 16%, var(--raised)); }
.project .swatch { width: 8px; height: 8px; border-radius: 2px; background: var(--pa); }
.project .name { flex: 1; }
.project .count { color: var(--muted); font-size: 11px; }

.top { grid-area: top; display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.top .sep { width: 1px; background: var(--line); margin: 7px 6px; flex: none; }
.top .where { align-self: center; padding: 0 12px; color: var(--muted); font-size: 11px; flex: 1; white-space: nowrap; overflow: hidden; }
.spaces { display: flex; align-self: center; gap: 2px; margin: 0 4px; }
.spaces span { display: grid; place-items: center; width: 26px; height: 22px; border-radius: 4px; color: var(--muted); font: 600 11px var(--mono); border: 1px solid transparent; }
.spaces span.cur { background: color-mix(in srgb, var(--accent) 22%, var(--raised)); border-color: var(--accent); color: var(--text); }

.tabs { display: flex; align-items: stretch; padding-left: 4px; min-width: 0; overflow: hidden; }
.tabs button { display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--muted); font-size: 12.5px; white-space: nowrap; box-shadow: inset 0 -2px transparent; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.tabs .plus { justify-content: center; width: 26px; font-size: 15px; box-shadow: none; }

/* New Window Menu */
.tabmenu {

.tabmenu .item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 5px; font-size: 12.5px; text-align: left; }

/* address bar toggle */

</style>

<body>
<div class="app">
  <aside>
    <div class="side-head">Projects</div>
    <h2>local</h2>
    <button class="project" data-proj="tri" style="--pa:#7aa2f7"><span class="swatch"></span><span class="name">tri-code</span><span class="count" data-count="tri"></span></button>
    <button class="project" data-proj="shop" style="--pa:#9ece6a"><span class="swatch"></span><span class="name">shopfront</span><span class="count" data-count="shop"></span></button>

<script>
/* ================= icons (lucide UMD) ================= */
const L = window.lucide;
const toKebab = (s) => s.replace(/([a-z0-9])([A-Z])/g, "$1-$2").replace(/([a-zA-Z])(\d)/g, "$1-$2").toLowerCase();
const ICONS = {};
if (L && L.icons) for (const [k, node] of Object.entries(L.icons)) ICONS[toKebab(k)] = node;
const ICON_NAMES = Object.keys(ICONS).sort();
const SUGGESTED = [
  "globe", "app-window", "monitor", "layout-dashboard", "github", "gitlab", "git-pull-request", "book-open",
  "chart-line", "gauge", "activity", "database", "server", "cloud", "bug", "flame", "rocket", "store",
  "shopping-cart", "figma", "palette", "message-square", "mail", "calendar", "list-todo", "kanban",
  "file-text", "notebook-pen", "search", "lock", "shield", "box", "container", "zap", "star", "heart",
  "asterisk", "pi", "square-terminal", "bot", "sparkles", "code", "wrench", "cat", "leaf",
].filter((n) => ICONS[n] || !L);

function icon(name, cls = "") {
  const node = ICONS[name];
  if (!node || !L) return `<span class="ic ic-miss ${cls}">${name ? name.slice(0, 3) : "?"}</span>`;
  const el = L.createElement(node);
  el.setAttribute("class", "lucide");
  return `<span class="ic ${cls}">${el.outerHTML}</span>`;

const chordId = (h) => h ? `Alt+${h.ctrl ? "Ctrl+" : ""}${h.shift ? "Shift+" : ""}${h.code}` : "";
function keyLabel(code) {
  if (code.startsWith("Key")) return code.slice(3);
  if (code.startsWith("Digit")) return code.slice(5);
  return { Enter: "↵", Semicolon: ";", Quote: "'", Minus: "-", Equal: "=", Backquote: "`", Comma: ",", Period: ".",
    Slash: "/", Backslash: "\\", BracketLeft: "[", BracketRight: "]", Space: "Space" }[code] || code;
}
const kbds = (h) => h ? ["Alt", h.ctrl && "Ctrl", h.shift && "⇧", keyLabel(h.code)].filter(Boolean).map((k) => `<kbd>${k}</kbd>`).join("") : "";

}

function hotkeyProblem(e) {
  if (!e.hotkey) return "";

  const other = launchables().find((b) => b !== e && chordId(b.hotkey) === id);
  return other && launchables().indexOf(other) < launchables().indexOf(e) ? `${chordText(e.hotkey)} is already ${other.name || "another entry"}'s` : "";
}
function nameProblem(e) {
  if (!e.name.trim()) return "needs a name";

  return same.length ? "another entry has this name" : "";

function urlProblem(e) {
  if (e.kind === "term") return "";

  s = s.trim();

  return (/^(localhost|127\.|\d+\.\d+\.\d+\.\d+)/.test(s) ? "http://" : "https://") + s;
}
const hostOf = (s) => { try { return new URL(normUrl(s)).host; } catch { return s; } };

let flashTimer = 0;

function render() {

  const keep = ae && ae.dataset && (ae.dataset.f ? `[data-f="${ae.dataset.f}"][data-id="${ae.dataset.id}"]` : null);
  const caret = keep ? [ae.selectionStart, ae.selectionEnd] : null;

  document.querySelectorAll("[data-proj]").forEach((b) => b.classList.toggle("active", b.dataset.proj === st.proj));
  document.querySelectorAll("[data-count]").forEach((c) => { c.textContent = st.tabs.filter((t) => t.proj === c.dataset.count).length || ""; });
  document.getElementById("where").textContent = PROJECTS[st.proj].path;

  const tabs = projTabs();
  document.getElementById("tabs").innerHTML = tabs.map((t) => {
    const l = tabLook(t);
    return `<button data-focus="${t.id}" aria-pressed="${st.focus === t.id}" title="${esc(t.snap?.target || "")}">${icon(l.icon)}${esc(l.name)}</button>`;
  }).join("") + `<button class="plus" id="plus" data-menu="1" title="New window">+</button>`;

  const world = document.getElementById("world");
  const side = tabs.some((t) => t.kind === "settings") && tabs.length > 1;
  world.classList.toggle("has-settings", side);
  world.style.gridTemplateRows = side ? `repeat(${tabs.length - 1}, minmax(0, 1fr))` : "";
  world.innerHTML = tabs.map((t) => {
    const l = tabLook(t);
    let bar = "", body;
    if (t.kind === "settings") body = settingsBody();
    else if (t.kind === "term") { bar = `<span class="ttl mono">${esc(t.snap.target || "$SHELL")}</span>`; body = `<pre class="screen">${termScreen(t.snap.target)}</pre>`; }
    else ({ bar, body } = webWin(t));
    if (t.kind === "settings") bar = `<span class="ttl">${isC() ? "favourites + agents" : "agents" + (st.v === "A" ? " & web apps" : "")}</span>`;
    return `<div class="win ${t.kind === "settings" ? "settings" : ""} ${st.focus === t.id ? "focused" : ""}" data-win="${t.id}">
      <div class="bar">${icon(l.icon)}<span class="kind">${esc(l.name)}</span>${bar}<button data-close="${t.id}" title="Close (Alt+Q)">×</button></div>${body}</div>`;
  }).join("");
  document.getElementById("worldEmpty").hidden = tabs.length > 0;

  document.getElementById("overlay").innerHTML = st.menu ? `<div class="tabmenu" id="tabmenu" role="menu">${menuHtml()}</div>` : "";
  placeFixed(document.getElementById("tabmenu"), document.getElementById("plus"));

  const ph = document.getElementById("pickerHost");
  if (st.picker) {
    if (!document.getElementById("picker")) { ph.innerHTML = pickerHtml(); fillPickerGrid(); document.getElementById("pickq").focus(); }
    else fillPickerGrid();
    placeFixed(document.getElementById("picker"), document.querySelector(`[data-pick="${st.picker.id}"]`));
  } else ph.innerHTML = "";

  const hk = launchables().filter((e) => e.hotkey && !hotkeyProblem(e));
  document.getElementById("state").textContent = `${PROJECTS[st.proj].name} · ` + hk.map((e) => `${chordText(e.hotkey)} ${e.name}`).join(" · ") + ` · ${tabs.length} windows${st.recording ? " · recording…" : ""}`;
  document.getElementById("vlabel").textContent = `${st.v} · ${NAMES[st.v]}`;
  document.getElementById("vdesc").textContent = DESC[st.v];
  const out = (e) => ({ id: e.id, name: e.name, icon: e.icon, ...(e.hotkey ? { hotkey: chordText(e.hotkey) } : {}) });
  const json = st.v === "A"
    ? { agents: st.entries.map((e) => ({ ...out(e), ...(e.kind === "web" ? { url: normUrl(e.target), bar: e.bar } : { command: e.target }) })) }
    : st.v === "B"
      ? { agents: agents().map((e) => ({ ...out(e), command: e.target })), webApps: webs().map((e) => ({ ...out(e), url: normUrl(e.target), bar: e.bar })) }
      : { agents: agents().map((e) => ({ ...out(e), command: e.target })), projects: Object.fromEntries(Object.entries(st.favs).map(([k, fs]) => [PROJECTS[k].name, { favs: fs.map((f) => ({ url: normUrl(f.target), name: f.name, icon: f.icon, ...(f.hotkey ? { hotkey: chordText(f.hotkey) } : {}), ...(f.bar === "app" ? { bar: "app" } : {}), ...(f.menu ? { menu: true } : {}) })) }])) };
  document.getElementById("json").textContent = "// state.json\n" + JSON.stringify(json, null, 2);

  if (keep) { const el = document.querySelector(keep); if (el) { el.focus(); try { el.setSelectionRange(caret[0], caret[1]); } catch {} } }
}

/* ================= events ================= */
document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.id === "pickq") { st.picker.q = el.value; fillPickerGrid(); return; }
  if (el.dataset.f) {
    const e = entry(el.dataset.id);
    const wasUrl = looksLikeUrl(e.target);
    e[el.dataset.f] = el.value;
    // A: the kind follows what you type, unless you've flipped the chip yourself
    if (st.v === "A" && el.dataset.f === "target" && !e.forced && looksLikeUrl(el.value) !== wasUrl) {
      e.kind = looksLikeUrl(el.value) ? "web" : "term"; e.bar ??= "full";
    }
    render(); return;
  }
  if (el.dataset.new && el.value.trim()) {
    const k = el.dataset.new, name = el.value;
    let e;
    if (k === "fav") { e = fav(name, "", "globe", null); st.favs[st.proj].push(e); }
    else if (k === "web") { e = web(name, "", "globe", null); st.entries.push(e); }
    else { e = term(name, "", "bot", null); st.entries.push(e); }
    el.value = ""; render();
    const f = document.querySelector(`[data-f="name"][data-id="${e.id}"]`);
    if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  }
});

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-launch],[data-panel],[data-menu],[data-focus],[data-close],[data-pick],[data-icon],[data-rec],[data-del],[data-try],[data-kind],[data-bar],[data-menu-pin],[data-addr],[data-proj],[data-win]");
  if (st.picker && !ev.target.closest("#picker") && !(el && el.dataset.pick)) { st.picker = null; render(); if (!el) return; }
  if (st.recording && !(el && el.dataset.rec === st.recording)) { st.recording = null; render(); }
  if (st.menu && !ev.target.closest("#tabmenu") && !(el && el.dataset.menu)) { st.menu = false; render(); }
  if (!el) return;
  const d = el.dataset;
  if (d.launch) return launch(entry(d.launch));
  if (d.panel) { if (d.panel === "browser") return openBlankBrowser(); if (d.panel === "agents") return openSettings(); st.menu = false; flash(`(${d.panel} not mocked here)`); render(); return; }
  if (d.menu) { st.menu = !st.menu; render(); return; }
  if (d.focus) { st.focus = d.focus; render(); return; }
  if (d.close) return closeTab(d.close);
  if (d.pick) { st.picker = st.picker?.id === d.pick ? null : { id: d.pick, q: "" }; document.getElementById("pickerHost").innerHTML = ""; render(); return; }
  if (d.icon) { entry(st.picker.id).icon = d.icon; st.picker = null; render(); return; }
  if (d.rec) { st.recording = st.recording === d.rec ? null : d.rec; render(); return; }
  if (d.del) { removeEntry(d.del); render(); return; }
  if (d.try) return launch(entry(d.try));
  if (d.kind) { const e = entry(d.kind); e.kind = e.kind === "web" ? "term" : "web"; e.bar ??= "full"; e.forced = true; flash(`${e.name} is now ${e.kind === "web" ? "a web app" : "an agent"}`); render(); return; }
  if (d.bar) { entry(d.bar).bar = d.val; render(); return; }
  if (d.menuPin) { const e = entry(d.menuPin); e.menu = !e.menu; render(); return; }
  if (d.addr) { const t = st.tabs.find((x) => x.id === d.addr); t.showAddr = !t.showAddr; render(); return; }
  if (d.proj) { st.proj = d.proj; st.focus = projTabs()[0]?.id ?? null; flash(`${PROJECTS[d.proj].name}`); render(); return; }
  if (d.win && st.focus !== d.win && !ev.target.closest("input")) { st.focus = d.win; render(); }
});

// drag the grip to reorder (within its list)
let dragId = null;
document.addEventListener("dragstart", (ev) => { const g = ev.target.closest?.("[data-drag]"); if (g) { dragId = g.dataset.drag; ev.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", (ev) => { if (dragId && ev.target.closest?.(".tbl")) ev.preventDefault(); });
document.addEventListener("drop", (ev) => {
  if (!dragId) return;
  let c = ev.target.closest?.(".cell");
  while (c && !c.dataset.drag) c = c.previousElementSibling;
  const a = entry(dragId), b = c && entry(c.dataset.drag), list = listOf(a);
  if (b && b !== a && listOf(b) === list) { list.splice(list.indexOf(a), 1); list.splice(list.indexOf(b), 0, a); flash(`${a.name} moved`); }
  dragId = null; render();
});

addEventListener("keydown", (ev) => {
  if (st.recording) {
    ev.preventDefault(); ev.stopPropagation();
    const e = entry(st.recording);
    if (ev.key === "Escape") { st.recording = null; render(); return; }
    if (ev.key === "Backspace" || ev.key === "Delete") { e.hotkey = null; st.recording = null; render(); return; }
    if (["Alt", "Shift", "Control", "Meta"].includes(ev.key)) return;
    if (!ev.altKey) { flash("hotkeys start with Alt"); return; }
    e.hotkey = { code: ev.code, ...(ev.shiftKey ? { shift: true } : {}), ...(ev.ctrlKey ? { ctrl: true } : {}) };
    st.recording = null;
    flash(hotkeyProblem(e) ? `⚠ ${hotkeyProblem(e)}` : `${e.name} → ${chordText(e.hotkey)}`);
    render(); return;
  }
  if (ev.key === "Escape") { if (st.picker) st.picker = null; else if (st.menu) st.menu = false; else return; render(); return; }
  if (ev.altKey) {
    const id = chordId({ code: ev.code, shift: ev.shiftKey, ctrl: ev.ctrlKey });
    if (id === "Alt+Semicolon") { ev.preventDefault(); return openSettings(); }
    if (id === "Alt+KeyQ") { ev.preventDefault(); if (st.focus) closeTab(st.focus); return; }
    if (id === "Alt+KeyB") { ev.preventDefault(); return openBlankBrowser(); }
    const e = launchables().find((x) => chordId(x.hotkey) === id && !problem(x));
    if (e) { ev.preventDefault(); return launch(e); }
    if (BUILTIN[id]) { ev.preventDefault(); flash(`${chordText({ code: ev.code, shift: ev.shiftKey, ctrl: ev.ctrlKey })}: ${BUILTIN[id]} (not mocked)`); }
    return;
  }
  if (ev.target.closest?.("input")) return;
  if (ev.key === "ArrowLeft") cycle(-1);
  else if (ev.key === "ArrowRight") cycle(1);
});
addEventListener("resize", () => render());

/* ================= variant switcher ================= */
function setVariant(v, push) {
  if (!VARIANTS.includes(v)) v = "A";
  st.v = v; st.menu = false; st.picker = null; st.recording = null;
  if (push) {
    try {
      if (location.protocol === "file:") location.hash = v;
      else { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
    } catch {}
  }
  render();
}
const cycle = (d) => setVariant(VARIANTS[(VARIANTS.indexOf(st.v) + d + VARIANTS.length) % VARIANTS.length], true);
document.getElementById("prev").onclick = (e) => { e.stopPropagation(); cycle(-1); };
document.getElementById("next").onclick = (e) => { e.stopPropagation(); cycle(1); };
document.getElementById("jsonBtn").onclick = (e) => { e.stopPropagation(); const j = document.getElementById("json"); j.hidden = !j.hidden; };

/* ================= boot ================= */
const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
st.v = VARIANTS.includes(initial) ? initial : "A";
openSettings();
launch(st.entries[0]);
launch(webs()[0]);
st.focus = projTabs()[0].id;
setVariant(st.v, false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
</body>
