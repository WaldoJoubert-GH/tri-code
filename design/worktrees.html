<html lang="en">

<title>tri-code · branches & worktrees prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser.
  Question: "Where do branches and git worktrees fit in tri-code's model
  (Environment → Project → Workspace → Window), so several agents can work on different
  branches of one repo at once?"

  OUTCOME (settled 2026-10-20): variant A — a worktree is a sub-project under its repo, with its
  own windows, workspaces and signals. On the collapsed rail it uses "stack": the repo tile, then
  one mini tile per checkout hung under it — main first (branch glyph), then each worktree
  (issue number, branch colour, own signal badge), then "+" for a new worktree.
  It shipped in 0.1.18: a Worktree is a Project with a `parent` (state.ts, `addWorktree`/`repoOf`),
  src/worktrees.ts + src/NewWorktree.tsx (Alt+W), the rows and rail tiles in src/Sidebar.tsx,
  and git_worktree_* in src-tauri/src/git.rs.

  Four structurally different answers, switchable from the floating bar (also ← / →).
  URL keeps the choice: worktrees.html?variant=B (served) or worktrees.html#B (file://).
    A · Worktree = sub-project — each worktree is a child row under its repo in the sidebar,
        with its own windows, workspaces and signal badge. Switching = clicking a row.
    B · Worktree = workspace   — workspaces 1–4 are each bound to a worktree; Alt+2 is
        "go to branch tri-14". Windows on a workspace run in that worktree's folder.
    C · Worktree = window      — every agent window can sit in its own worktree; one canvas
        mixes them, each title bar carries a branch chip. The git window is the worktree hub.
    D · Branches only (baseline) — no worktrees: one checkout, a branch switcher in the toolbar,
        `git switch` under every running agent's feet.

  All variants drive the same in-memory model. The "state" drawer (bottom-right button) shows
  it as the variant would persist it, plus the git commands each action would run on the
  project's host. Nothing touches git. Use "step" on a branch to walk it
  changes → commits → PR → merged, then "finish" to merge and remove the worktree.
-->
<style>
:root {
  --bg: #fbfbfc; --panel: #f1f2f5; --canvas: #e6e8ed; --line: #d9dce3; --hover: #e6e8ee;
  --raised: #dfe2ea; --text: #23262d; --muted: #6b7080; --warn: #9a6400; --ok: #3d7a1c;
  --bad: #c4314b; --violet: #7c4dbd; --scrim: rgba(30,34,44,.35); --shadow: rgba(30,34,44,.22);
  --accent-raw: #7aa2f7; --accent: color-mix(in oklab, var(--accent-raw) 76%, #000);
  --ui: system-ui, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0f12; --panel: #15171c; --canvas: #0b0c0f; --line: #24272f; --hover: #1c1f26;
    --raised: #232733; --text: #d6d8de; --muted: #7d828f; --warn: #e0af68; --ok: #9ece6a;
    --bad: #f7768e; --violet: #bb9af7; --scrim: rgba(8,9,11,.6); --shadow: rgba(0,0,0,.8);
    --accent: var(--accent-raw);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--ui); overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; background: var(--panel); }

.app { display: grid; height: 100%; grid-template-columns: 220px 1fr; grid-template-rows: 34px 1fr 26px;
  grid-template-areas: "side top" "side canvas" "side status"; }
aside { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); padding: 4px 6px 8px; overflow-y: auto; }
.side-head { display: flex; align-items: center; height: 26px; padding-left: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
aside h2 { margin: 10px 8px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.project { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 5px; cursor: pointer; position: relative; }
.project:hover { background: var(--hover); }
.project.active { background: color-mix(in srgb, var(--pa) 16%, var(--raised)); }
.project .ic { width: 18px; height: 18px; border-radius: 4px; background: var(--pa); color: #111; font: 700 11px/18px var(--ui); text-align: center; flex: none; }
.project .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project .count { color: var(--muted); font-size: 11px; }
/* A: worktree rows under the repo */
.wt { display: flex; align-items: center; gap: 6px; margin-left: 16px; padding: 3px 8px 3px 10px; border-radius: 5px; cursor: pointer;
  border-left: 1px solid var(--line); border-top-left-radius: 0; border-bottom-left-radius: 0; font-size: 12px; }
.wt:hover { background: var(--hover); }
.wt.active { background: color-mix(in srgb, var(--tc) 18%, var(--raised)); }
.wt .bn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
.wt.add { color: var(--muted); }
.wt.add:hover { color: var(--text); }
.br { color: var(--tc, var(--muted)); font-family: var(--mono); flex: none; }
.meta { color: var(--muted); font: 10.5px var(--mono); flex: none; }
.sig { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.sig.working { background: var(--accent); animation: pulse 1.2s infinite; }
.sig.blocked { background: var(--warn); }
.sig.done { background: var(--ok); }
.sig.none { background: transparent; }
@keyframes pulse { 50% { opacity: .35; } }

.top { grid-area: top; display: flex; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.top .sep { width: 1px; background: var(--line); margin: 7px 6px; flex: none; }
.spaces { display: flex; align-self: center; gap: 2px; margin: 0 4px; flex: none; }
.spaces button { min-width: 26px; height: 22px; padding: 0 6px; border-radius: 4px; color: var(--muted); font: 600 11px var(--mono); border: 1px solid transparent; display: flex; align-items: center; gap: 5px; }
.spaces button.used { color: var(--text); }
.spaces button[aria-current="true"] { background: color-mix(in srgb, var(--tc, var(--accent)) 22%, var(--raised)); border-color: var(--tc, var(--accent)); color: var(--text); }
.spaces button .bn { font-weight: 400; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: flex; align-items: stretch; flex: none; }
.tabs button { padding: 0 10px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tabs button.on { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.tabs button:hover { background: var(--hover); color: var(--text); }
.where { align-self: center; padding: 0 12px; color: var(--muted); font: 11px var(--mono); flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.where b { color: var(--text); font-weight: 600; }
.brsw { align-self: center; display: flex; align-items: center; gap: 6px; padding: 2px 9px; margin: 0 4px; border: 1px solid var(--line); border-radius: 5px; font: 12px var(--mono); position: relative; }
.brsw:hover { background: var(--hover); }
.tool { padding: 0 10px; color: var(--muted); }
.tool:hover { color: var(--text); background: var(--hover); }

.viewport { grid-area: canvas; position: relative; overflow: hidden; background: var(--canvas); }
.world { position: absolute; inset: 0; display: grid; gap: 12px; padding: 12px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); }
.world.one { grid-template-columns: minmax(0, 1fr); }
.world.three { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
.world.three > .win:first-child { grid-row: span 2; }
.world.four { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.empty { display: grid; place-items: center; color: var(--muted); text-align: center; }
.empty .card { background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 20px 26px; max-width: 420px; }
.empty .card p { margin: 0 0 12px; }

.win { position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-width: 0; min-height: 0; }
.win.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.win.tinted { border-top: 3px solid var(--tc); }
.bar { height: 28px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); }
.bar .kind { font-weight: 600; color: var(--text); }
.bar .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px; font: 11px var(--mono);
  background: color-mix(in srgb, var(--tc) 18%, transparent); color: var(--text); border: 1px solid color-mix(in srgb, var(--tc) 45%, transparent); white-space: nowrap; }
.screen { flex: 1; margin: 0; padding: 8px 10px; overflow: hidden; white-space: pre-wrap; font: 12px/17px var(--mono); }
.c-a { color: var(--accent); } .c-m { color: var(--muted); } .c-o { color: var(--ok); } .c-w { color: var(--warn); } .c-v { color: var(--violet); }

/* git window as worktree hub */
.hub { flex: 1; overflow: auto; padding: 6px; }
.hub .row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 7px 8px; border-radius: 6px; border: 1px solid transparent; }
.hub .row:hover { background: var(--hover); }
.hub .row.cur { border-color: color-mix(in srgb, var(--tc) 50%, transparent); background: color-mix(in srgb, var(--tc) 8%, transparent); }
.hub .row .bn { font: 600 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hub .row .sub { grid-column: 2 / 4; color: var(--muted); font: 11px var(--mono); display: flex; gap: 10px; flex-wrap: wrap; }
.hub .acts { display: flex; gap: 4px; }
.btn { padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); font-size: 11.5px; color: var(--text); background: var(--bg); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.hub .new { margin: 8px 8px 2px; }
.step { font: 10.5px var(--mono); padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.step.pr { color: var(--violet); border-color: var(--violet); }
.step.merged { color: var(--ok); border-color: var(--ok); }

.status { grid-area: status; display: flex; align-items: center; gap: 12px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; }
.status .flash { color: var(--accent); }
.status .hints { margin-left: auto; display: flex; gap: 12px; }

/* new branch dialog */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: start center; padding-top: 80px; z-index: 50; }
.dlg { width: min(520px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 20px 50px -12px var(--shadow); padding: 14px; }
.dlg h3 { margin: 0 0 10px; font-size: 13px; }
.dlg input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: 12.5px var(--mono); user-select: text; }
.dlg .lbl { margin: 12px 0 6px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.dlg .issues { display: flex; flex-wrap: wrap; gap: 6px; }
.dlg .issues button { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; }
.dlg .issues button:hover { border-color: var(--accent); }
.dlg .opts { display: flex; flex-direction: column; gap: 6px; }
.dlg .opts label { display: flex; gap: 8px; align-items: center; }
.dlg .cmd { margin-top: 12px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 11.5px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; }
.dlg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.dlg .warn { margin-top: 10px; color: var(--warn); }

/* branch dropdown (D) / + menu (C) */
.mwrap { position: relative; display: flex; align-items: stretch; flex: none; }
.mwrap > .brsw { align-self: center; }
.bri { width: 12px; height: 12px; vertical-align: -1px; flex: none; }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 40; min-width: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 14px 40px -10px var(--shadow); padding: 4px; }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; text-align: left; font-size: 12px; }
.menu button:hover { background: var(--hover); }
.menu .hd { padding: 6px 8px 2px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }

/* A collapsed: the 48px rail of src/styles.css (.app.rail), peek floats the full list over the canvas */
.side-head .collapse { margin-left: auto; width: 24px; height: 24px; border-radius: 4px; color: var(--muted); }
.side-head .collapse:hover { background: var(--hover); color: var(--text); }
.app.rail { grid-template-columns: 48px 1fr; }
.app.rail aside { position: relative; z-index: 20; width: 48px; overflow-x: hidden; transition: width 140ms ease, box-shadow 140ms ease; }
.app.rail.peek aside { width: 220px; box-shadow: 12px 0 32px -12px var(--shadow); }
.app.rail:not(.peek) aside { padding-inline: 6px; overflow: visible; }
.app.rail:not(.peek) .side-head { justify-content: center; padding: 0; }
.app.rail:not(.peek) .side-head .collapse { margin: 0; }
.rl { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rl hr { width: 28px; border: 0; border-top: 1px solid var(--line); margin: 6px 0 2px; }
.rtile { position: relative; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; cursor: pointer; flex: none;
  background: color-mix(in srgb, var(--pa) 22%, var(--raised)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pa) 45%, transparent); font: 600 13px var(--ui); }
.rtile.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--pa); }
.rtile > .sig, .rmini > .sig { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; box-shadow: 0 0 0 2px var(--panel); }
.rtile > .sig.none, .rmini > .sig.none { display: none; }
/* stack: a mini tile per worktree, hung off a stem under the repo tile */
.rstack { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: -1px; padding-top: 7px; position: relative; }
.rstack::before { content: ""; position: absolute; top: 0; bottom: 11px; left: 50%; border-left: 1px solid var(--line); }
.rmini { position: relative; width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; cursor: pointer; z-index: 1;
  background: color-mix(in srgb, var(--tc) 26%, var(--panel)); color: var(--text); font: 600 9.5px var(--mono); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); }
.rmini.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--tc); }
.rmini.trunk .bri { width: 11px; height: 11px; color: var(--tc); }
.rmini.add { background: var(--panel); border-style: dashed; border-color: var(--line); color: var(--muted); font-size: 13px; }
.rmini.add:hover { color: var(--text); border-color: var(--muted); }
/* fold: one tile, a branch count, the active worktree as a coloured bar; click opens a flyout */
.rtile .rbar { position: absolute; left: 4px; right: 4px; bottom: -4px; height: 3px; border-radius: 2px; background: var(--tc); }
.rtile .rcount { position: absolute; right: -6px; bottom: -6px; min-width: 15px; height: 13px; padding: 0 3px; border-radius: 7px; background: var(--raised);
  box-shadow: 0 0 0 2px var(--panel); font: 600 9px/13px var(--mono); color: var(--text); text-align: center; }
.flyout { position: absolute; left: 44px; top: 0; z-index: 30; min-width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 14px 40px -10px var(--shadow); padding: 4px; }
.flyout .wt { margin-left: 0; border-left: 0; border-radius: 5px; padding: 5px 8px; }
.flyout .hd { padding: 4px 8px 4px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
/* dots: one dot per worktree under the repo tile */
.rdots { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; width: 32px; margin-top: 2px; }
.rdot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); cursor: pointer; border: 0; padding: 0; }
.rdot.on { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px var(--tc); }
.rdot.working { animation: pulse 1.2s infinite; }
.rdot.blocked { background: var(--warn); }
.proto-bar .rs { display: flex; border: 1px solid #3a3f4d; border-radius: 7px; overflow: hidden; }
.proto-bar .rs button { border-radius: 0; padding: 4px 8px; font: 11px var(--mono); }
.proto-bar .rs button[aria-pressed="true"] { background: #262b36; color: #fff; }
.proto-bar .rs[hidden] { display: none; }

/* state drawer */
.state { position: fixed; right: 12px; bottom: 74px; width: min(440px, calc(100vw - 24px)); max-height: calc(100vh - 140px); z-index: 60;
  background: #14161cf5; color: #d8dce6; border: 1px solid #3a3f4d; border-radius: 10px; box-shadow: 0 14px 44px -10px rgba(0,0,0,.65); display: flex; flex-direction: column; overflow: hidden; }
.state[hidden] { display: none; }
.state h4 { margin: 0; padding: 8px 12px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #9aa3b8; border-bottom: 1px solid #2a2f3b; }
.state pre { margin: 0; padding: 8px 12px; font: 11px/1.45 var(--mono); white-space: pre-wrap; overflow: auto; user-select: text; }
.state .log { color: #9ece6a; max-height: 34vh; }
.state .model { flex: 1; }

.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9999; display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 8px;
  background: #14161cf2; color: #e8eaf0; border: 1px solid #3a3f4d; border-radius: 12px; box-shadow: 0 14px 44px -10px rgba(0,0,0,.65); font: 12px/1.35 var(--ui); }
.proto-bar .tag { font: 600 9.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #9aa3b8; border: 1px solid #3a3f4d; border-radius: 999px; padding: 4px 7px; }
.proto-bar button { color: #cfd5e4; border-radius: 7px; }
.proto-bar button.arrow { width: 26px; height: 26px; font-size: 15px; }
.proto-bar button:hover { background: #262b36; color: #fff; }
.proto-bar .cur { width: 330px; }
.proto-bar .cur b { font: 600 12px var(--mono); color: #fff; }
.proto-bar .cur span { display: block; color: #9aa3b8; font-size: 11px; }
.proto-bar .st { padding: 4px 9px; border: 1px solid #3a3f4d; font: 11px var(--mono); }
.proto-bar .st[aria-pressed="true"] { border-color: #7aa2f7; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <div class="top" id="top"></div>
  <div class="viewport"><div class="world" id="world"></div></div>
  <div class="status" id="status"></div>
</div>
<div id="overlay"></div>
<div class="state" id="state" hidden>
  <h4>git commands (newest first)</h4><pre class="log" id="log"></pre>
  <h4>model, as this variant would keep it</h4><pre class="model" id="model"></pre>
</div>
<div class="proto-bar">
  <span class="tag">prototype</span>
  <button class="arrow" id="prev" title="Previous variant (←)">‹</button>
  <div class="cur"><b id="vlabel"></b><span id="vdesc"></span></div>
  <button class="arrow" id="next" title="Next variant (→)">›</button>
  <div class="rs" id="railStyles" hidden title="How worktrees show on the collapsed rail"><button data-rs="stack">stack</button><button data-rs="fold">fold</button><button data-rs="dots">dots</button></div>
  <button class="st" id="stBtn" aria-pressed="false" title="Show state (S)">state</button>
  <button class="st" id="resetBtn" title="Reset the sample">reset</button>
</div>

<script>
const ORDER = ["A", "B", "C", "D"];
const NAMES = { A: "Worktree = sub-project", B: "Worktree = workspace", C: "Worktree = window", D: "Branches only (baseline)" };
const DESC = {
  A: "Sidebar rows under the repo; each worktree has its own canvas.",
  B: "Workspace 1–4 bound to a worktree; Alt+N switches branch.",
  C: "One canvas; each agent window in its own worktree, git window is the hub.",
  D: "One checkout; `git switch` changes files under every agent.",
};
const HUES = ["#7aa2f7", "#bb9af7", "#ff9e64", "#73daca", "#f7768e", "#e0af68"];
const ISSUES = [
  { slug: "TRI-14", title: "Worktrees per agent" },
  { slug: "TRI-9", title: "ConPTY resize flicker" },
  { slug: "TRI-17", title: "Issues panel: filter by label" },
  { slug: "S-4412", title: "TypeError in favs.tsx" },
];
const ROOT = "~/code/tri-code";
const WT_DIR = "~/code/tri-code.worktrees";
const STEPS = ["clean", "changes", "commits", "pr", "merged"];

let st;
function reset() {
  st = {
    v: st?.v ?? "A", showState: st?.showState ?? false, rail: st?.rail ?? false, railStyle: st?.railStyle ?? "stack", peek: false, fly: false, dlg: null, menu: null, flash: "",
    log: [],
    // Worktrees (or plain branches in D). `space` is B's binding; `wins` are the windows that run in it.
    trees: [
      { id: "main", branch: "main", main: true, hue: HUES[0], step: "clean", signal: "none", space: 0,
        wins: [{ id: "w1", kind: "claude", focused: true }, { id: "w2", kind: "git" }] },
      { id: "t14", branch: "tri-14-worktrees", issue: "TRI-14", hue: HUES[1], step: "changes", signal: "working", space: 1, dirty: 3,
        wins: [{ id: "w3", kind: "claude" }] },
      { id: "t9", branch: "tri-9-conpty-resize", issue: "TRI-9", hue: HUES[2], step: "pr", signal: "done", space: 2, ahead: 4, pr: 41,
        wins: [{ id: "w4", kind: "pi" }, { id: "w5", kind: "browser" }] },
    ],
    active: "main", // A/B/C: the worktree in front; D: the one checked-out branch
    space: 0,       // B: active workspace
  };
  st.dCheckout = "main";
}
reset();

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tree = (id) => st.trees.find((t) => t.id === id);
const pathOf = (t) => (t.main || st.v === "D" ? ROOT : `${WT_DIR}/${t.branch}`);
const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
const cmd = (...lines) => { st.log.unshift(...lines.reverse().map((l) => `$ ${l}`)); };
const flash = (m) => { st.flash = m; };
const nextHue = () => HUES.find((h) => !st.trees.some((t) => t.hue === h)) ?? HUES[st.trees.length % HUES.length];
const metaOf = (t) => [t.dirty ? `●${t.dirty}` : "", t.ahead ? `↑${t.ahead}` : "", t.pr ? `#${t.pr}` : ""].filter(Boolean).join(" ");
const BR = `<svg class="bri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 7.2v9.6M18 9.2c0 5-12 3-12 7.6"/></svg>`;

/* ---------- actions ---------- */
function createBranch(name, issue, opts) {
  const branch = slugify(name) || "branch";
  if (st.trees.some((t) => t.branch === branch)) { flash(`${branch} already exists`); return; }
  const t = { id: "t" + Math.random().toString(36).slice(2, 6), branch, issue, hue: nextHue(), step: "clean", signal: "none", wins: [] };
  if (st.v === "D") {
    if (!switchOk()) return;
    cmd(`git switch -c ${branch} main`);
    st.trees.push(t); st.dCheckout = t.id;
    flash(`switched to new branch ${branch}; every window now sees it`);
    return;
  }
  cmd(`git worktree add -b ${branch} ${WT_DIR}/${branch} main`);
  if (opts.install) cmd(`cd ${WT_DIR}/${branch} && bun install   # node_modules is per worktree`);
  if (opts.agent) {
    t.wins.push({ id: "w" + Math.random().toString(36).slice(2, 6), kind: "claude", focused: true });
    t.signal = "working";
  }
  if (st.v === "B") {
    const free = [0, 1, 2, 3].find((i) => !st.trees.some((x) => x.space === i));
    if (free === undefined) { flash("all 4 workspaces are bound — finish a branch first"); cmd(`git worktree remove ${WT_DIR}/${branch}   # rolled back`); return; }
    t.space = free; st.space = free;
  }
  st.trees.push(t);
  st.active = t.id;
  if (st.v === "C") st.trees.forEach((x) => x.wins.forEach((w) => (w.focused = x === t && w === t.wins[0])));
  flash(`worktree ${branch} at ${WT_DIR}/${branch}`);
}

function switchOk() {
  const cur = tree(st.dCheckout);
  const busy = st.trees.flatMap((t) => t.wins).length;
  if (cur.dirty) {
    cmd(`git stash push -m "tri-code: switching from ${cur.branch}"`);
    flash(`stashed ${cur.dirty} changes on ${cur.branch}`);
    cur.stash = cur.dirty; cur.dirty = 0;
  }
  if (cur.signal === "working") {
    if (!confirm(`An agent is working on ${cur.branch}. Switching branch changes its files under it. Switch anyway?`)) return false;
    cur.signal = "none";
  }
  return true;
}

function activate(id) {
  if (st.v === "D") {
    if (id === st.dCheckout || !switchOk()) return;
    const t = tree(id);
    cmd(`git switch ${t.branch}`);
    if (t.stash) { cmd(`git stash pop   # tri-code: ${t.branch}`); t.dirty = t.stash; t.stash = 0; }
    st.dCheckout = id; flash(`checked out ${t.branch}`);
    return;
  }
  st.active = id;
  if (st.v === "B") st.space = tree(id).space;
}

function stepTree(id) {
  const t = tree(id);
  const i = STEPS.indexOf(t.step);
  if (i >= STEPS.length - 1) return;
  t.step = STEPS[i + 1];
  const at = st.v === "D" ? "" : `-C ${pathOf(t)} `;
  if (t.step === "changes") { t.dirty = 2; t.signal = "working"; }
  if (t.step === "commits") { cmd(`git ${at}commit -am "…"`); t.ahead = (t.ahead || 0) + 2; t.dirty = 0; t.signal = "done"; }
  if (t.step === "pr") { cmd(`git ${at}push -u origin ${t.branch}`, `gh pr create --head ${t.branch} --base main`); t.pr = 40 + st.trees.length; t.signal = "blocked"; }
  if (t.step === "merged") { cmd(`gh pr merge ${t.pr} --squash`); t.ahead = 0; t.signal = "done"; }
}

function finish(id) {
  const t = tree(id);
  if (t.main) return;
  if (t.step !== "merged" && !confirm(`${t.branch} is not merged. Remove the worktree and delete the branch anyway?`)) return;
  if (t.wins.length) cmd(`# close ${t.wins.length} window(s) running in ${pathOf(t)}`);
  if (st.v === "D") {
    if (st.dCheckout === id) { cmd("git switch main"); st.dCheckout = "main"; }
    cmd(`git branch -D ${t.branch}`);
  } else {
    cmd(`git worktree remove ${WT_DIR}/${t.branch}`, `git branch -D ${t.branch}`, "git -C " + ROOT + " pull --ff-only   # main picks up the merge");
  }
  st.trees = st.trees.filter((x) => x !== t);
  if (st.active === id) st.active = "main";
  if (st.v === "B") st.space = tree(st.active).space;
  flash(`${t.branch} finished`);
}

function addWin(id, kind) {
  const t = tree(id);
  st.trees.forEach((x) => x.wins.forEach((w) => (w.focused = false)));
  t.wins.push({ id: "w" + Math.random().toString(36).slice(2, 6), kind, focused: true });
  if (kind === "claude" || kind === "pi") t.signal = "working";
}

/* ---------- pieces ---------- */
const sig = (t) => `<span class="sig ${t.signal}" title="${t.signal}"></span>`;
const chip = (t) => `<span class="chip" style="--tc:${t.hue}">${BR} ${esc(t.branch)}</span>`;
const stepPill = (t) => `<span class="step ${t.step}">${t.step}</span>`;

function screen(t, w) {
  const cwd = pathOf(t);
  const br = st.v === "D" ? tree(st.dCheckout).branch : t.branch;
  if (w.kind === "browser") return `<pre class="screen"><span class="c-m">localhost:${t.main ? 1420 : 1420 + st.trees.indexOf(t)}  ·  vite dev server from ${esc(cwd)}</span>\n\n<span class="c-w">Each worktree needs its own dev server port.</span></pre>`;
  const issue = t.issue ? ISSUES.find((i) => i.slug === t.issue) : null;
  const task = issue ? `${issue.slug}: ${issue.title}` : "look around the repo";
  const glyph = w.kind === "pi" ? "π" : "✻";
  return `<pre class="screen"><span class="c-v">${glyph}</span> <b>${w.kind}</b>  <span class="c-m">cwd: ${esc(cwd)}</span>
<span class="c-m">  branch: </span><span class="c-a">${esc(br)}</span>

<span class="c-a">&gt;</span> ${esc(task)}

${t.signal === "working" ? `<span class="c-o">●</span> Edit(src/state.ts)\n<span class="c-w">✻ Working…</span>` : t.signal === "blocked" ? `<span class="c-w">? PR #${t.pr} is open — review it?</span>` : t.signal === "done" ? `<span class="c-o">✓ done</span>` : ""}
</pre>`;
}

function hubHtml(focusId) {
  const rows = st.trees.map((t) => {
    const cur = st.v === "D" ? t.id === st.dCheckout : t.id === focusId;
    const agents = t.wins.filter((w) => w.kind !== "git").map((w) => w.kind).join(", ");
    return `<div class="row${cur ? " cur" : ""}" style="--tc:${t.hue}">
      ${sig(t)}<span class="bn">${BR} ${esc(t.branch)}</span>
      <span class="acts">
        ${cur ? "" : `<button class="btn" data-act="activate" data-id="${t.id}">${st.v === "D" ? "switch" : st.v === "C" ? "focus" : "open"}</button>`}
        ${st.v === "C" ? `<button class="btn" data-act="addwin" data-id="${t.id}" data-kind="claude">+ claude</button>` : ""}
        ${t.main ? "" : `<button class="btn" data-act="step" data-id="${t.id}" ${t.step === "merged" ? "disabled" : ""}>step</button>
        <button class="btn${t.step === "merged" ? " pri" : ""}" data-act="finish" data-id="${t.id}">finish</button>`}
      </span>
      <span class="sub">${stepPill(t)}<span>${esc(pathOf(t))}</span>${metaOf(t) ? `<span>${metaOf(t)}</span>` : ""}${t.issue ? `<span>${t.issue}</span>` : ""}${agents && st.v !== "D" ? `<span>agents: ${agents}</span>` : ""}${t.stash ? `<span>stash: ${t.stash}</span>` : ""}</span>
    </div>`;
  }).join("");
  return `<div class="hub">${rows}<button class="btn new" data-act="new">+ New ${st.v === "D" ? "branch" : "worktree"}…</button></div>`;
}

function winHtml(t, w, opts = {}) {
  const body = w.kind === "git" ? hubHtml(opts.focusId ?? t.id) : screen(t, w);
  const title = w.kind === "git" ? (st.v === "D" ? "branches" : "worktrees") : esc(pathOf(t));
  return `<div class="win${w.focused ? " focused" : ""}${opts.tint ? " tinted" : ""}" style="--tc:${t.hue}" data-win="${w.id}" data-tree="${t.id}">
    <div class="bar">${w.kind !== "git" ? sig(t) : ""}<span class="kind">${w.kind}</span>${opts.chip ? chip(t) : ""}<span class="ttl">${title}</span></div>${body}</div>`;
}

function layout(n) { return n <= 1 ? "one" : n === 2 ? "" : n === 3 ? "three" : "four"; }

/* ---------- variants ---------- */
const collapseBtn = () => `<button class="collapse" data-act="rail" title="${st.rail ? "Expand" : "Collapse"} sidebar (Alt+S)">${st.peek ? "⇥" : st.rail ? "»" : "«"}</button>`;
function sidebar(children) {
  return `<div class="side-head">${st.rail && !st.peek ? "" : "Projects"}${collapseBtn()}</div><h2>local</h2>${children}
    <div class="project" style="--pa:#9ece6a"><span class="ic">d</span><span class="name">dotfiles</span><span class="count">1</span></div>
    <h2>devbox</h2><div class="project" style="--pa:#ff9e64"><span class="ic">i</span><span class="name">infra</span><span class="count">2</span></div>`;
}
const repoRow = (extra = "") => {
  const loud = ["blocked", "done", "working"].find((s) => st.trees.some((t) => t.signal === s)) ?? "none";
  return `<div class="project active" style="--pa:#7aa2f7"><span class="ic">t</span><span class="name">tri-code</span>${extra}<span class="sig ${loud}"></span></div>`;
};
const tabsHtml = (wins) => `<div class="tabs">${wins.map(([t, w]) => `<button class="${w.focused ? "on" : ""}" data-act="focus" data-win="${w.id}">${w.kind === "git" ? "" : sig(t)}${w.kind}</button>`).join("")}<span class="mwrap"><button data-act="plus">+</button>${st.menu === "plus" ? plusMenu() : ""}</span></div>`;
function plusMenu() {
  if (st.v !== "C") {
    const t = tree(st.v === "D" ? st.dCheckout : st.active);
    return `<div class="menu"><button data-act="addwin" data-id="${t.id}" data-kind="claude">claude</button><button data-act="addwin" data-id="${t.id}" data-kind="pi">pi</button><button data-act="addwin" data-id="${t.id}" data-kind="browser">browser</button></div>`;
  }
  return `<div class="menu"><div class="hd">claude in…</div>
    ${st.trees.map((t) => `<button data-act="addwin" data-id="${t.id}" data-kind="claude">${chip(t)}</button>`).join("")}
    <button data-act="new">✦ claude in a new worktree…</button></div>`;
}
const spaceBtns = () => `<div class="spaces">${[0, 1, 2, 3].map((i) => `<button class="${i === 0 ? "used" : ""}" ${i === 0 ? 'aria-current="true"' : ""}>${i + 1}</button>`).join("")}</div>`;

/** Variant A on the collapsed rail: three ways to show the repo's worktrees in 48px. */
function railA() {
  const main = tree("main");
  const wts = st.trees.filter((x) => !x.main);
  const loud = ["blocked", "done", "working"].find((s) => st.trees.some((t) => t.signal === s)) ?? "none";
  const label = (x) => x.issue ? x.issue.replace(/^\D+-/, "") : x.branch[0];
  const tip = (x) => `${x.branch}${metaOf(x) ? " · " + metaOf(x) : ""}${x.signal !== "none" ? " · " + x.signal : ""}`;
  const onMain = st.active === "main";
  let repo, below = "";
  if (st.railStyle === "stack") {
    // The repo tile is the project (ring = active project, badge = loudest branch); every
    // checkout hangs under it, main first with the branch glyph, worktrees by issue number.
    repo = `<div class="rtile on" style="--pa:#7aa2f7" title="tri-code @ ${esc(tree(st.active).branch)}">t<span class="sig ${loud}"></span></div>`;
    below = `<div class="rstack">${st.trees.map((x) => `<div class="rmini${x.main ? " trunk" : ""}${x.id === st.active ? " on" : ""}" style="--tc:${x.hue}" data-act="activate" data-id="${x.id}" title="${esc(tip(x))}">${x.main ? BR : esc(label(x))}<span class="sig ${x.signal}"></span></div>`).join("")}
      <div class="rmini add" data-act="new" title="New worktree…">+</div></div>`;
  } else if (st.railStyle === "fold") {
    const a = tree(st.active);
    repo = `<div class="rtile on" style="--pa:#7aa2f7;--tc:${a.hue}" data-act="fly" title="tri-code @ ${esc(a.branch)} · ${wts.length} worktrees">t<span class="sig ${loud}"></span>${a.main ? "" : `<span class="rbar"></span>`}<span class="rcount">${st.trees.length}</span>
      ${st.fly ? `<div class="flyout" data-stop><div class="hd">tri-code · worktrees</div>${st.trees.map((x) => `<div class="wt${x.id === st.active ? " active" : ""}" style="--tc:${x.hue}" data-act="activate" data-id="${x.id}"><span class="br">${BR}</span><span class="bn">${esc(x.branch)}</span><span class="meta">${metaOf(x)}</span>${sig(x)}</div>`).join("")}<div class="wt add" data-act="new"><span class="br">+</span><span class="bn">new worktree…</span></div></div>` : ""}</div>`;
  } else {
    repo = `<div class="rtile${onMain ? " on" : ""}" style="--pa:#7aa2f7" data-act="activate" data-id="main" title="tri-code @ main">t<span class="sig ${loud}"></span></div>`;
    below = `<div class="rdots">${wts.map((x) => `<button class="rdot ${x.signal}${x.id === st.active ? " on" : ""}" style="--tc:${x.hue}" data-act="activate" data-id="${x.id}" title="${esc(tip(x))}"></button>`).join("")}</div>`;
  }
  return `<div class="side-head">${collapseBtn()}</div><div class="rl">
    <hr>${repo}${below}
    <div class="rtile" style="--pa:#9ece6a">d</div>
    <hr><div class="rtile" style="--pa:#ff9e64">i</div></div>`;
}

function renderA() {
  const t = tree(st.active);
  const side = st.rail && !st.peek ? railA() : sidebar(repoRow(`<span class="count">${st.trees.length}</span>`) + st.trees.map((x) =>
    `<div class="wt${x.id === st.active ? " active" : ""}" style="--tc:${x.hue}" data-act="activate" data-id="${x.id}">
      <span class="br">${BR}</span><span class="bn">${esc(x.branch)}</span><span class="meta">${metaOf(x)}</span>${sig(x)}</div>`).join("")
    + `<div class="wt add" data-act="new"><span class="br">+</span><span class="bn">new worktree…</span></div>`);
  const wins = t.wins.map((w) => [t, w]);
  return {
    side,
    top: `${spaceBtns()}<div class="sep"></div>${tabsHtml(wins)}<span class="where">${esc(pathOf(t))}  <b style="color:${t.hue}">${BR} ${esc(t.branch)}</b></span>`,
    world: wins.length ? [layout(wins.length), wins.map(([x, w]) => winHtml(x, w)).join("")] : ["one", emptyCard(t)],
    status: `tri-code @ ${t.branch} · each worktree keeps its own 4 workspaces`,
  };
}

function renderB() {
  const t = st.trees.find((x) => x.space === st.space);
  const spaces = [0, 1, 2, 3].map((i) => {
    const b = st.trees.find((x) => x.space === i);
    return `<button class="${b ? "used" : ""}" ${i === st.space ? 'aria-current="true"' : ""} style="${b ? `--tc:${b.hue}` : ""}" data-act="space" data-i="${i}" title="Alt+${i + 1}">${i + 1}${b ? `${sig(b)}<span class="bn">${esc(b.branch)}</span>` : ""}</button>`;
  }).join("");
  const wins = t ? t.wins.map((w) => [t, w]) : [];
  return {
    side: sidebar(repoRow(`<span class="count">${st.trees.length}/4</span>`)),
    top: `<div class="spaces">${spaces}</div><div class="sep"></div>${t ? tabsHtml(wins) : ""}<span class="where">${t ? `${esc(pathOf(t))}  <b style="color:${t.hue}">${BR} ${esc(t.branch)}</b>` : "workspace not bound to a branch"}</span>`,
    world: !t ? ["one", `<div class="empty"><div class="card"><p>Workspace ${st.space + 1} has no branch.</p><button class="btn pri" data-act="new">Bind to a new worktree…</button></div></div>`]
      : wins.length ? [layout(wins.length), wins.map(([x, w]) => winHtml(x, w)).join("")] : ["one", emptyCard(t)],
    status: `Alt+1–4 = switch branch · at most 4 live branches per project`,
  };
}

function renderC() {
  const all = st.trees.flatMap((t) => t.wins.map((w) => [t, w]));
  const focusT = all.find(([, w]) => w.focused)?.[0] ?? tree("main");
  return {
    side: sidebar(repoRow(`<span class="count">${st.trees.length} wt</span>`)),
    top: `${spaceBtns()}<div class="sep"></div>${tabsHtml(all)}<span class="where">${esc(pathOf(focusT))}  <b style="color:${focusT.hue}">${BR} ${esc(focusT.branch)}</b></span>`,
    world: [all.length <= 2 ? layout(all.length) : "four", all.slice(0, 4).map(([t, w]) => winHtml(t, w, { chip: w.kind !== "git", tint: w.kind !== "git", focusId: focusT.id })).join("")
      + (all.length > 4 ? "" : "")],
    status: `${all.length} windows across ${st.trees.length} worktrees on one workspace${all.length > 4 ? ` (showing 4 of ${all.length}: tiling gets crowded)` : ""}`,
  };
}

function renderD() {
  const t = tree(st.dCheckout);
  const all = st.trees.flatMap((x) => x.wins.map((w) => [x, w]));
  const wins = all.map(([, w]) => [t, w]); // every window lives in the one checkout
  const dd = st.menu === "branch" ? `<div class="menu"><div class="hd">switch branch</div>${st.trees.map((x) =>
    `<button data-act="activate" data-id="${x.id}">${x.id === st.dCheckout ? "✓" : "&nbsp;&nbsp;"} <span class="br" style="--tc:${x.hue}">${BR}</span> ${esc(x.branch)} <span class="meta">${metaOf(x)}${x.stash ? ` stash ${x.stash}` : ""}</span></button>`).join("")}
    <button data-act="new">+ new branch…</button></div>` : "";
  return {
    side: sidebar(repoRow()),
    top: `${spaceBtns()}<div class="sep"></div>${tabsHtml(wins)}<span class="mwrap"><button class="brsw" data-act="branchmenu" style="--tc:${t.hue}"><span class="br">${BR}</span>${esc(t.branch)} ▾</button>${dd}</span><span class="where">${ROOT}</span>`,
    world: [wins.length <= 2 ? layout(wins.length) : "four", wins.slice(0, 4).map(([x, w]) => winHtml(x, w)).join("")],
    status: `one checkout: switching branch moves every window (${wins.length}) with it`,
  };
}

function emptyCard(t) {
  return `<div class="empty"><div class="card"><p>No windows in <b>${esc(t.branch)}</b> yet.</p>
    <button class="btn pri" data-act="addwin" data-id="${t.id}" data-kind="claude">+ claude here</button>
    <button class="btn" data-act="addwin" data-id="${t.id}" data-kind="git">+ git</button></div></div>`;
}

/* ---------- dialog ---------- */
function dialogHtml() {
  const d = st.dlg;
  const branch = slugify(d.name);
  const wt = st.v !== "D";
  const lines = wt
    ? [`git worktree add -b ${branch || "<name>"} ${WT_DIR}/${branch || "<name>"} main`, d.install ? `bun install   # in the new folder` : null, d.agent ? `claude   # new window, cwd = the worktree` : null]
    : [`git switch -c ${branch || "<name>"} main`];
  const dirty = st.v === "D" && tree(st.dCheckout).dirty;
  return `<div class="scrim" data-act="close"><div class="dlg" data-stop>
    <h3>New ${wt ? "worktree" : "branch"} from main</h3>
    <input id="bname" placeholder="branch name" value="${esc(d.name)}" spellcheck="false" autocomplete="off">
    <div class="lbl">or start from an In Progress issue</div>
    <div class="issues">${ISSUES.map((i) => `<button data-act="pickissue" data-slug="${i.slug}">${i.slug} · ${esc(i.title)}</button>`).join("")}</div>
    ${wt ? `<div class="lbl">then</div><div class="opts">
      <label><input type="checkbox" id="optAgent" ${d.agent ? "checked" : ""} style="width:auto"> open claude in it${d.issue ? ` and paste ${d.issue}` : ""}</label>
      <label><input type="checkbox" id="optInstall" ${d.install ? "checked" : ""} style="width:auto"> install dependencies (node_modules is per folder)</label></div>` : ""}
    <div class="cmd">${lines.filter(Boolean).map((l) => "$ " + esc(l)).join("\n")}</div>
    ${dirty ? `<div class="warn">${tree(st.dCheckout).dirty} uncommitted changes on ${esc(tree(st.dCheckout).branch)} will be stashed.</div>` : ""}
    ${st.v === "B" && st.trees.length >= 4 ? `<div class="warn">All 4 workspaces are bound. Finish a branch first.</div>` : ""}
    <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="create" ${branch ? "" : "disabled"}>Create</button></div>
  </div></div>`;
}

/* ---------- render ---------- */
const $ = (id) => document.getElementById(id);
function render() {
  const r = { A: renderA, B: renderB, C: renderC, D: renderD }[st.v]();
  $("side").innerHTML = r.side;
  const app = document.querySelector(".app");
  app.classList.toggle("rail", st.v === "A" && st.rail);
  app.classList.toggle("peek", st.v === "A" && st.rail && st.peek);
  $("railStyles").hidden = !(st.v === "A" && st.rail);
  document.querySelectorAll("[data-rs]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.rs === st.railStyle));
  $("top").innerHTML = r.top + `<button class="tool">◐</button><button class="tool">?</button>`;
  $("world").className = "world " + r.world[0];
  $("world").innerHTML = r.world[1];
  $("status").innerHTML = `<span>${esc(r.status)}</span><span class="flash">${esc(st.flash)}</span><span class="hints"><span><kbd>←</kbd><kbd>→</kbd> variant</span><span><kbd>S</kbd> state</span></span>`;
  $("overlay").innerHTML = st.dlg ? dialogHtml() : "";
  $("vlabel").textContent = `${st.v} · ${NAMES[st.v]}`;
  $("vdesc").textContent = DESC[st.v];
  $("state").hidden = !st.showState;
  $("stBtn").setAttribute("aria-pressed", st.showState);
  $("log").textContent = st.log.join("\n") || "(nothing run yet)";
  $("model").textContent = modelText();
  if (st.dlg) { const i = $("bname"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

/** What would land in state.json (and what is runtime-only) under each variant. */
function modelText() {
  const wins = (t) => t.wins.map((w) => ({ id: w.id, kind: w.kind }));
  if (st.v === "A") return JSON.stringify({ project: { id: "tri", path: ROOT, worktrees: st.trees.filter((t) => !t.main).map((t) => ({ branch: t.branch, path: pathOf(t), issue: t.issue, tabs: wins(t), ws: 0, spaces: "…4 like a project" })), tabs: wins(tree("main")) }, activeWorktree: st.active }, null, 2);
  if (st.v === "B") return JSON.stringify({ project: { id: "tri", path: ROOT, ws: st.space, spaces: [0, 1, 2, 3].map((i) => { const t = st.trees.find((x) => x.space === i); return t ? { worktree: t.main ? null : pathOf(t), branch: t.branch, layout: "master" } : { worktree: null, branch: null }; }), tabs: st.trees.flatMap((t) => t.wins.map((w) => ({ id: w.id, kind: w.kind, space: t.space }))) } }, null, 2);
  if (st.v === "C") return JSON.stringify({ project: { id: "tri", path: ROOT, tabs: st.trees.flatMap((t) => t.wins.map((w) => ({ id: w.id, kind: w.kind, space: 0, cwd: t.main ? undefined : pathOf(t) }))) }, "runtime (from `git worktree list`)": st.trees.map((t) => ({ branch: t.branch, path: pathOf(t), step: t.step })) }, null, 2);
  return JSON.stringify({ project: { id: "tri", path: ROOT, tabs: st.trees.flatMap((t) => wins(t)) }, "runtime (git)": { head: tree(st.dCheckout).branch, branches: st.trees.map((t) => t.branch), stashes: st.trees.filter((t) => t.stash).map((t) => `${t.branch}: ${t.stash}`) } }, null, 2);
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (e.target.closest("[data-stop]") && (!el || !e.target.closest("[data-stop]").contains(el))) return;
  if (!el) { if (st.menu || st.fly) { st.menu = null; st.fly = false; render(); } return; }
  const { act, id } = el.dataset;
  const keepMenu = act === "plus" || act === "branchmenu";
  if (!keepMenu) st.menu = null;
  st.flash = "";
  if (act !== "fly") st.fly = false;
  if (act === "rail") { st.rail = !st.rail; st.peek = false; }
  else if (act === "fly") st.fly = !st.fly;
  else if (act === "activate") activate(id);
  else if (act === "space") { st.space = +el.dataset.i; const t = st.trees.find((x) => x.space === st.space); if (t) st.active = t.id; }
  else if (act === "step") stepTree(id);
  else if (act === "finish") finish(id);
  else if (act === "addwin") addWin(id, el.dataset.kind);
  else if (act === "focus") st.trees.forEach((t) => t.wins.forEach((w) => (w.focused = w.id === el.dataset.win)));
  else if (act === "plus") st.menu = st.menu === "plus" ? null : "plus";
  else if (act === "branchmenu") st.menu = st.menu === "branch" ? null : "branch";
  else if (act === "new") st.dlg = { name: "", issue: null, agent: true, install: true };
  else if (act === "pickissue") { const i = ISSUES.find((x) => x.slug === el.dataset.slug); st.dlg.name = `${i.slug}-${i.title}`; st.dlg.issue = i.slug; }
  else if (act === "close") { if (e.target === el || el.tagName === "BUTTON") st.dlg = null; else return; }
  else if (act === "create") { const d = st.dlg; st.dlg = null; createBranch(d.name, d.issue, d); }
  render();
});
document.addEventListener("input", (e) => {
  if (!st.dlg) return;
  if (e.target.id === "bname") { st.dlg.name = e.target.value; st.dlg.issue = null; const pos = e.target.selectionStart; render(); $("bname").setSelectionRange(pos, pos); }
  if (e.target.id === "optAgent") st.dlg.agent = e.target.checked;
  if (e.target.id === "optInstall") st.dlg.install = e.target.checked;
});
document.addEventListener("keydown", (e) => {
  if (st.dlg) {
    if (e.key === "Escape") { st.dlg = null; render(); }
    if (e.key === "Enter" && slugify(st.dlg.name)) { const d = st.dlg; st.dlg = null; createBranch(d.name, d.issue, d); render(); }
    return;
  }
  if (e.altKey && e.code === "KeyS") { e.preventDefault(); if (st.v === "A") { st.rail = !st.rail; st.peek = false; render(); } return; }
  if (e.key === "Escape" && st.fly) { st.fly = false; render(); return; }
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
  else if (e.key === "s" || e.key === "S") { st.showState = !st.showState; render(); }
  else if (st.v === "B" && e.altKey && /^Digit[1-4]$/.test(e.code)) { e.preventDefault(); st.space = +e.code.slice(5) - 1; const t = st.trees.find((x) => x.space === st.space); if (t) st.active = t.id; render(); }
});

function setVariant(v, push) {
  st.v = ORDER.includes(v) ? v : "A";
  st.menu = null; st.dlg = null; st.flash = "";
  if (st.v === "B") st.space = tree(st.active)?.space ?? 0;
  if (push) {
    try {
      if (location.protocol === "file:") location.hash = st.v;
      else { const u = new URL(location.href); u.searchParams.set("variant", st.v); history.replaceState(null, "", u); }
    } catch { /* ignore */ }
  }
  render();
}
const cycle = (d) => setVariant(ORDER[(ORDER.indexOf(st.v) + d + ORDER.length) % ORDER.length], true);
$("prev").onclick = (e) => { e.stopPropagation(); cycle(-1); };
$("next").onclick = (e) => { e.stopPropagation(); cycle(1); };
// Peek like the real rail: a short delay in so sweeping past doesn't flicker, a longer one out.
let peekTimer;
const wantPeek = (want) => { clearTimeout(peekTimer); peekTimer = setTimeout(() => { if (st.rail && st.peek !== want && !st.fly) { st.peek = want; render(); } }, want ? 180 : 260); };
$("side").addEventListener("mouseenter", () => st.rail && st.railStyle !== "fold" && wantPeek(true));
$("side").addEventListener("mouseleave", () => wantPeek(false));
document.querySelectorAll("[data-rs]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); st.railStyle = b.dataset.rs; st.peek = false; st.fly = false; render(); }));
$("stBtn").onclick = (e) => { e.stopPropagation(); st.showState = !st.showState; render(); };
$("resetBtn").onclick = (e) => { e.stopPropagation(); reset(); render(); };

const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
setVariant(initial, false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
</body>
</html>
