<!doctype html>
<!-- PROTOTYPE (throwaway). Question: what should the tri-code logo be?
     Trident + terminal variants, each shown large, at dock/taskbar/favicon sizes, on light and dark.
     Export the winner to assets/icon.svg (outline any <text> first), regenerate src-tauri/icons, then delete me. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>tri-code · Logo prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap">
<style>
:root {
  --bg: #fbfbfc; --panel: #f1f2f5; --line: #d9dce3; --text: #23262d; --muted: #6b7080;
  --accent: color-mix(in oklab, #7aa2f7 76%, #000);
  --ui: system-ui, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e0f12; --panel: #15171c; --line: #24272f; --text: #d6d8de; --muted: #7d828f; --accent: #7aa2f7; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--ui); }
header { padding: 32px 24px 8px; max-width: 1200px; margin: 0 auto; }
h1 { font: 600 20px var(--mono); margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 16px 24px 48px; max-width: 1200px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card.pick { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.big { display: grid; place-items: center; padding: 8px 0; }
.big svg { width: 220px; height: 220px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
.sizes { display: grid; gap: 8px; }
.strip { display: flex; align-items: end; gap: 12px; padding: 12px; border-radius: 8px; }
.strip.dark { background: #1e1f24; } .strip.light { background: #e9ebf0; }
.strip svg { display: block; flex: none; }
h2 { font: 600 15px var(--mono); margin: 0; display: flex; justify-content: space-between; align-items: center; }
h2 small { font: 12px var(--ui); color: var(--muted); }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
button.choose { font: 12px var(--ui); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.card.pick button.choose { border-color: var(--accent); color: var(--accent); }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (max-width: 420px) { main { padding: 16px; grid-template-columns: 1fr; } header { padding: 24px 16px 4px; } }
</style>
</head>
<body>
<header>
  <h1>tri-code logo</h1>
  <p>Trident × terminal. Click "pick" on the ones you like; your picks are remembered in this browser.</p>
</header>
<main id="grid"></main>
<script>
// Tokyo Night accents the app already uses.
const C = { cyan: "#7dcfff", blue: "#7aa2f7", violet: "#bb9af7", green: "#9ece6a", red: "#f7768e", amber: "#e0af68", fg: "#c0caf5", mute: "#565f89" };
const sq = (inner, bg = ["#1c1f2b", "#0c0d12"], id = "") => `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs><linearGradient id="bg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></linearGradient>
  <linearGradient id="tri${id}" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="824" y2="0"><stop offset="0" stop-color="${C.cyan}"/><stop offset=".5" stop-color="${C.blue}"/><stop offset="1" stop-color="${C.violet}"/></linearGradient></defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg${id})"/>
  <rect x="6" y="6" width="1012" height="1012" rx="218" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="12"/>
  ${inner}
</svg>`;

// Monoline trident: tines at cx±dx, join curve at yj, shaft to yb.
const trident = (cx, top, dx, yj, yb, w, color) => {
  const tip = (x, y) => `<path d="M${x} ${y - w * 1.9} L${x + w * .95} ${y} L${x - w * .95} ${y} Z" fill="${color}" stroke="${color}" stroke-width="${w * .35}" stroke-linejoin="round"/>`;
  const side = top + w * 1.4;
  return `<g fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round">
    <path d="M${cx - dx} ${side} V${yj - dx * .5} Q${cx - dx} ${yj} ${cx} ${yj} Q${cx + dx} ${yj} ${cx + dx} ${yj - dx * .5} V${side}"/>
    <path d="M${cx} ${top} V${yb}"/></g>${tip(cx - dx, side)}${tip(cx, top)}${tip(cx + dx, side)}`;
};

const asciiTrident = (x, y, size, lh, fill) => {
  const rows = ["^   ^   ^", "|   |   |", "\\___|___/", "    |    ", "    |    ", "    |    "];
  return `<text x="${x}" y="${y}" font-family="JetBrains Mono, monospace" font-weight="800" font-size="${size}" fill="${fill}" style="white-space:pre">${
    rows.map((r, i) => `<tspan x="${x}" dy="${i ? lh : 0}">${r.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</tspan>`).join("")}</text>`;
};

const pixel = (() => {
  const P = ["....X....", "X...X...X", "X...X...X", "X...X...X", "XXXXXXXXX", "....X....", "....X....", "....X....", "....X....", "....X...."];
  const u = 76, x0 = (1024 - 9 * u) / 2, y0 = (1024 - P.length * u) / 2, g = 8;
  let out = "";
  P.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch !== "X") return;
    const col = c <= 1 ? C.cyan : c >= 7 ? C.violet : C.blue;
    const last = r === P.length - 1;
    out += `<rect ${last ? 'class="blink"' : ""} x="${x0 + c * u + g / 2}" y="${y0 + r * u + g / 2}" width="${u - g}" height="${u - g}" rx="6" fill="${last ? C.fg : col}"/>`;
  }));
  return out;
})();

const titlebar = (x, y, w, r = 18) => [C.red, C.amber, C.green].map((c, i) => `<circle cx="${x + 40 + i * 60}" cy="${y + 48}" r="${r}" fill="${c}"/>`).join("") +
  `<path d="M${x} ${y + 96} H${x + w}" stroke="#2a2e3d" stroke-width="6"/>`;

const V = [
  { id: "A", name: "Prompt + trident", note: "A terminal window: a > prompt, then the trident as the command. The shaft ends in a blinking block cursor.",
    svg: sq(`<rect x="120" y="168" width="784" height="688" rx="60" fill="#13151d" stroke="#2a2e3d" stroke-width="8"/>${titlebar(120, 168, 784)}
      <path d="M220 452 L316 532 L220 612" fill="none" stroke="${C.green}" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      ${trident(612, 352, 128, 600, 712, 44, "url(#triA)")}
      <rect class="blink" x="584" y="730" width="56" height="74" rx="6" fill="${C.fg}"/>`, undefined, "A") },
  { id: "B", name: "ASCII trident", note: "Plain ASCII, the way you'd draw it in a README. Prongs fade cyan → blue → violet, one colour per agent.",
    svg: sq(asciiTrident(212, 270, 114, 100, "url(#triB)"), undefined, "B") },
  { id: "C", name: "Cell trident", note: "Drawn on a monospace character grid, each cell a block character. Holds up at 16 px; the last cell blinks like a cursor.",
    svg: sq(pixel, undefined, "C") },
  { id: "D", name: "ψ_ prompt", note: "The trident as a shell prompt symbol followed by a cursor underscore. Simplest mark; works as a single-colour glyph too.",
    svg: sq(`${trident(420, 230, 150, 590, 800, 60, C.blue)}<rect class="blink" x="640" y="744" width="200" height="60" rx="10" fill="${C.fg}"/>`, undefined, "D") },
  { id: "D1", name: "ψ_ · prong gradient", note: "Left to right cyan → blue → violet, so each prong gets one agent colour. The cursor stays neutral.",
    svg: sq(`<defs><linearGradient id="gD1" gradientUnits="userSpaceOnUse" x1="230" y1="0" x2="610" y2="0"><stop offset="0" stop-color="${C.cyan}"/><stop offset=".5" stop-color="${C.blue}"/><stop offset="1" stop-color="${C.violet}"/></linearGradient></defs>
      ${trident(420, 230, 150, 590, 800, 60, "url(#gD1)")}<rect class="blink" x="640" y="744" width="200" height="60" rx="10" fill="${C.fg}"/>`, undefined, "D1") },
  { id: "D2", name: "ψ_ · vertical gradient", note: "Violet at the tips fading down to cyan at the base. The cursor picks up the cyan, so the trident and cursor read as one stroke.",
    svg: sq(`<defs><linearGradient id="gD2" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="830"><stop offset="0" stop-color="${C.violet}"/><stop offset=".55" stop-color="${C.blue}"/><stop offset="1" stop-color="${C.cyan}"/></linearGradient></defs>
      ${trident(420, 230, 150, 590, 800, 60, "url(#gD2)")}<rect class="blink" x="640" y="744" width="200" height="60" rx="10" fill="${C.cyan}"/>`, undefined, "D2") },
  { id: "D3", name: "ψ_ · diagonal sweep", note: "One diagonal gradient across the whole mark, cyan at the top left to violet at the cursor.",
    svg: sq(`<defs><linearGradient id="gD3" gradientUnits="userSpaceOnUse" x1="250" y1="140" x2="840" y2="820"><stop offset="0" stop-color="${C.cyan}"/><stop offset=".5" stop-color="${C.blue}"/><stop offset="1" stop-color="${C.violet}"/></linearGradient></defs>
      ${trident(420, 230, 150, 590, 800, 60, "url(#gD3)")}<rect class="blink" x="640" y="744" width="200" height="60" rx="10" fill="url(#gD3)"/>`, undefined, "D3") },
  { id: "D4", name: "ψ_ · gradient tile", note: "The gradient moves to the background (deep blue to violet dusk) with a pale glyph on top. The strongest dock presence.",
    svg: sq(`${trident(420, 230, 150, 590, 800, 60, "#eef1ff")}<rect class="blink" x="640" y="744" width="200" height="60" rx="10" fill="#eef1ff" fill-opacity=".85"/>`, ["#3d59a1", "#2a1f4f"], "D4") },
  { id: "E", name: "Three cursors", note: "Each tine is a block cursor: three terminals, three agents, one shaft. Chunky enough for the taskbar.",
    svg: sq(`<rect x="232" y="232" width="104" height="320" rx="14" fill="${C.cyan}"/>
      <rect x="460" y="148" width="104" height="404" rx="14" fill="${C.blue}"/>
      <rect x="688" y="232" width="104" height="320" rx="14" fill="${C.violet}"/>
      <path d="M232 520 H792 V560 Q792 640 712 640 H312 Q232 640 232 560 Z" fill="${C.fg}"/>
      <rect x="460" y="600" width="104" height="276" rx="14" fill="${C.fg}"/>`, undefined, "E") },
  { id: "F", name: "Terminal with ASCII", note: "Both ideas at once: a terminal window running tri-code, with the ASCII trident as its output. Busy below 32 px.",
    svg: sq(`<rect x="104" y="152" width="816" height="720" rx="60" fill="#13151d" stroke="#2a2e3d" stroke-width="8"/>${titlebar(104, 152, 816)}
      <text x="168" y="340" font-family="JetBrains Mono, monospace" font-weight="800" font-size="56" fill="${C.fg}" style="white-space:pre"><tspan fill="${C.green}">$</tspan> tri-code<tspan class="blink" fill="${C.fg}">▌</tspan></text>
      ${asciiTrident(339, 452, 66, 60, "url(#triF)")}`, undefined, "F") },
  { id: "G", name: "Light terminal", note: "Variant A's prompt + trident on a pale squircle, for a lighter dock presence.",
    svg: sq(`<path d="M196 452 L300 532 L196 612" fill="none" stroke="#3d7a1c" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
      ${trident(600, 250, 150, 590, 800, 56, "#2f4fa8")}`, ["#f4f5f8", "#d9dde6"], "G") },
  { id: "now", name: "Current", note: "The logo in assets/icon.svg today, for comparison.", svg: null },
];

const grid = document.getElementById("grid");
let picks = new Set();
try { picks = new Set(JSON.parse(localStorage.getItem("logo-picks") || "[]")); } catch {}

fetch("../assets/icon.svg").then(r => r.ok ? r.text() : null).catch(() => null).then(cur => {
  const all = new URLSearchParams(location.search).has("all");
  for (const v of V) {
    if (!all && !/^(D\d*|now)$/.test(v.id)) continue;
    const svg = v.svg ?? cur;
    if (!svg) continue;
    const card = document.createElement("section");
    card.className = "card" + (picks.has(v.id) ? " pick" : "");
    const strip = cls => `<div class="strip ${cls}">${[128, 64, 32, 16].map(s => svg.replace("<svg ", `<svg width="${s}" height="${s}" `)).join("")}</div>`;
    card.innerHTML = `<h2>${v.id} · ${v.name} ${v.id === "now" ? "" : `<button class="choose">${picks.has(v.id) ? "picked" : "pick"}</button>`}</h2>
      <div class="big">${svg}</div><div class="sizes">${strip("dark")}${strip("light")}</div><p>${v.note}</p>`;
    card.querySelector(".choose")?.addEventListener("click", e => {
      picks.has(v.id) ? picks.delete(v.id) : picks.add(v.id);
      card.classList.toggle("pick", picks.has(v.id));
      e.target.textContent = picks.has(v.id) ? "picked" : "pick";
      try { localStorage.setItem("logo-picks", JSON.stringify([...picks])); } catch {}
    });
    grid.append(card);
  }
});
</script>
</body>
</html>
