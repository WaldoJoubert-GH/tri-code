<title>tri-code · onboarding prototype</title>
<!--
  PROTOTYPE: throwaway. Not imported by the app; open this file directly in a browser.
  Question: "What should a new user's first minutes in tri-code look like?"

  Today (v0.1.21) a first launch shows an empty canvas with one line, "Open a project (Alt+O) to
  get started.", and an empty LOCAL group in the sidebar. Nothing checks that claude or pi is
  installed, nothing explains environments, workspaces, the tab strip or agent signals, and
  desktop notifications are never asked for up front.

  OUTCOME (picked 2026-10-20): variant D, the guided tour, with two more stops added: Go to File
  (Alt+T, after the windows stop) and Appearance (Alt+P, before the palette). Eight stops in all.
  Built in src/Tour.tsx (stops, spotlight, try-it checks), src/demo.ts (scripted terminals in place
  of a PTY), addSampleProject in src/state.ts and src-tauri/src/tour.rs (the sample folder). The pi
  window lives on workspace 2, so "make an agent ask" shows the workspace badge and Alt+U jumps there.

  Four structurally different answers, switchable from the floating bar (also ← / →). Switching
  resets to a first launch. URL keeps the choice: onboarding.html?variant=B (served) or #B (file://).
    A · Start page: the empty canvas becomes a welcome page: git repos found under ~/code, ssh
        hosts from ~/.ssh/config, the agents found on PATH, four hotkeys. One click opens a
        project with an agent. Nothing is modal, and nothing shows once a project is open.
    B · Setup wizard: a four-step dialog before the app (agents, environments, first project,
        signals). Everything is checked and configured up front; you land on a working canvas.
    C · Checklist: the app as it is today, plus a "Getting started" card under the sidebar.
        Its six items tick themselves as you do them in the real UI; "show me" points at the control.
    D · Guided tour: the first launch opens a sample project with windows already tiled and an
        agent mid-task. A spotlight walks through eight stops, then hands over to Open project.

  All four drive the same in-memory app (projects, windows, workspaces, signals). The "state"
  button on the bar shows what each variant would persist in state.json and what it would detect
  on the host, and has toggles for the machine: is claude / pi on PATH, are there ssh aliases.
  Nothing is detected for real; nothing persists.
-->

.repo:hover { background: color-mix(in srgb, var(--panel) 70%, var(--hover)); }
.repo .ri { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; font-weight: 600; text-transform: uppercase; background: color-mix(in srgb, var(--pa) 25%, var(--raised)); flex: none; }

/* ---- B · Wizard ---- */

.wbody { overflow-y: auto; padding: 18px 22px; }

.wbody .sub { margin: 0 0 16px; color: var(--muted); max-width: 62ch; }
.wfoot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.wfoot .sp { flex: 1; }
.wfoot .note { color: var(--muted); font-size: 11.5px; }
.wlist { display: grid; gap: 8px; }
.wrow { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.wrow .wb { flex: 1; min-width: 0; }
.wrow .wt { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.wrow .wd { color: var(--muted); font-size: 12px; margin-top: 2px; }
.wrow.choose { cursor: pointer; }
.wrow.choose:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.wrow.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wsplit { display: grid; grid-template-columns: 170px 1fr; gap: 12px; height: 270px; }
.wsplit nav { display: flex; flex-direction: column; gap: 1px; }
.agents-pick { display: flex; gap: 6px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.agents-pick .lab { color: var(--muted); font-size: 12px; margin-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { padding: 4px 10px; color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.notif-demo { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
.sigrow { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }

/* ---- C · Checklist ---- */
.gs { margin-top: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; flex: none; }
.gs-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; text-align: left; font-weight: 600; font-size: 12px; }
.gs-head .prog { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.gs-bar { height: 3px; background: var(--line); }
.gs-bar i { display: block; height: 100%; background: var(--ok); transition: width 300ms ease; }
.gs ol { list-style: none; margin: 0; padding: 4px 0; }
.gs li { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; padding: 6px 10px; font-size: 12px; }
.gs li .ck { width: 14px; height: 14px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-size: 9px; color: var(--bg); }
.gs li.done .ck { background: var(--ok); border-color: var(--ok); }
.gs li.done .t { color: var(--muted); text-decoration: line-through; }
.gs li.next { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.gs li .d { grid-column: 2; color: var(--muted); font-size: 11px; margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.gs li .d kbd { font-size: 10px; }
.gs li .show { color: var(--accent); font-size: 11px; padding: 0 2px; }
.gs-foot { display: flex; justify-content: space-between; padding: 6px 10px; border-top: 1px solid var(--line); font-size: 11px; }
.gs-foot button { color: var(--muted); } .gs-foot button:hover { color: var(--text); }
.gs-done { padding: 10px; font-size: 12px; color: var(--muted); }
.gs-done b { color: var(--ok); }

/* ---- D · Tour ---- */
.spot { position: fixed; z-index: 800; border-radius: 8px; box-shadow: 0 0 0 9999px var(--scrim), 0 0 0 2px var(--accent); pointer-events: none; transition: all 220ms ease; }
.coach { position: fixed; z-index: 801; width: 320px; padding: 14px 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 24px 60px -16px var(--shadow); transition: top 220ms ease, left 220ms ease; }
.coach .cn { font: 600 10.5px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.coach h4 { margin: 4px 0 6px; font-size: 14px; }
.coach p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
.coach p kbd { font-size: 10.5px; }
.coach .try { margin: -2px 0 10px; padding: 7px 9px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 10%, transparent); font-size: 12px; }
.coach .try.did { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.coach .row { display: flex; align-items: center; gap: 6px; }
.coach .dots { display: flex; gap: 4px; margin-right: auto; }
.coach .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.coach .dots i.on { background: var(--accent); }
.tour-end { width: min(440px, calc(100% - 32px)); padding: 20px 22px; }
.tour-end h2 { margin: 0 0 6px; font-size: 16px; }
.tour-end p { margin: 0 0 14px; color: var(--muted); }
.tour-end .row { display: flex; gap: 8px; justify-content: flex-end; }

/* ---- prototype switcher + state drawer (throwaway, sit above everything) ---- */
.proto-bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9999; display: flex; align-items: center; gap: 10px; padding: 7px 8px; background: #14161cf2; color: #e8eaf0; border: 1px solid #3a3f4d; border-radius: 12px; box-shadow: 0 14px 44px -10px rgba(0,0,0,.65); font: 12px/1.35 var(--ui); }
.proto-bar .tag { font: 600 9.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #9aa3b8; border: 1px solid #3a3f4d; border-radius: 999px; padding: 4px 7px; }
.proto-bar button { color: #cfd5e4; }
.proto-bar .arrow { width: 26px; height: 26px; border-radius: 7px; font-size: 15px; }
.proto-bar .arrow:hover, .proto-bar .pb:hover { background: #262b36; color: #fff; }
.proto-bar .cur { min-width: 270px; }
.proto-bar .cur b { font: 600 12px var(--mono); color: #fff; }
.proto-bar .cur span { display: block; color: #9aa3b8; font-size: 11px; }
.proto-bar .pb { white-space: nowrap; padding: 4px 9px; border-radius: 7px; border: 1px solid #3a3f4d; font-size: 11.5px; }
.drawer { position: fixed; right: 16px; bottom: 72px; z-index: 9999; width: 360px; max-height: calc(100% - 100px); overflow: auto; padding: 12px; background: #14161cf7; color: #e8eaf0; border: 1px solid #3a3f4d; border-radius: 12px; font: 12px/1.4 var(--ui); box-shadow: 0 14px 44px -10px rgba(0,0,0,.65); }
.drawer h5 { margin: 0 0 6px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: #9aa3b8; }
.drawer label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.drawer pre { margin: 8px 0 0; padding: 8px; background: #0b0c10; border-radius: 6px; font: 11px/1.45 var(--mono); white-space: pre-wrap; color: #c9d1e3; user-select: text; }
.drawer .dbtn { margin-top: 8px; padding: 4px 9px; border-radius: 6px; border: 1px solid #3a3f4d; color: #cfd5e4; }
.drawer .dbtn:hover { background: #262b36; }
.drawer .row { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>

<div class="proto-bar">
  <span class="tag">prototype</span>
  <button class="arrow" id="prev" title="Previous variant (←)">‹</button>
  <div class="cur"><b id="vlabel"></b><span id="vdesc"></span></div>
  <button class="arrow" id="next" title="Next variant (→)">›</button>
  <button class="pb" id="replay" title="Back to a first launch">↺ first launch</button>
  <button class="pb" id="stateBtn">state</button>
</div>
<div class="drawer" id="drawer" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------- the machine (what tri-code would detect; toggled in the state drawer) ---------- */
const machine = { claude: true, pi: false, ssh: true, notifPermission: "default" };
const AGENTS = [
  { id: "claude", glyph: "✱", cmd: "claude", what: "Claude Code", install: "npm install -g @anthropic-ai/claude-code", ver: "2.3.1" },
  { id: "pi", glyph: "π", cmd: "pi", what: "pi coding agent", install: "npm install -g @mariozechner/pi-coding-agent", ver: "0.41.0" },
  { id: "shell", glyph: ">_", cmd: "", what: "your login shell", install: null, ver: null },
];
const has = (id) => id === "shell" || machine[id];
const SSH = { devbox: { backend: "shpool", note: "shpool 0.8 · sessions survive restarts" }, pi5: { backend: "tmux", note: "no shpool, falls back to tmux: agent signals don't pass through tmux" } };
const sshHosts = () => machine.ssh ? Object.keys(SSH) : [];
const FOLDERS = {
  local: { "~": ["code", "Documents", "Downloads"], "~/code": ["tri-code", "dotfiles", "api-server", "notes", "playground"] },
  devbox: { "~": ["src", "deploy"], "~/src": ["infra", "api-server", "ml-jobs"] },
  pi5: { "~": ["projects"], "~/projects": ["home-assistant", "sensors"] },
};
const REPOS = new Set(["~/code/tri-code", "~/code/dotfiles", "~/code/api-server", "~/code/playground", "~/src/infra", "~/src/api-server", "~/src/ml-jobs", "~/projects/home-assistant"]);
const FOUND = [ // git repos under ~/code, newest commit first (what the Start page would scan)
  { path: "~/code/tri-code", when: "2 hours ago" }, { path: "~/code/api-server", when: "yesterday" },
  { path: "~/code/dotfiles", when: "3 weeks ago" }, { path: "~/code/playground", when: "2 months ago" },
];
const ACCENTS = ["#7aa2f7", "#9ece6a", "#ff9e64", "#bb9af7", "#f7768e", "#2ac3de"];

/* ---------- the app model ---------- */
let S, uid = 1;
function fresh() {
  return {
    projects: [], active: null, envs: ["local"], menu: null, pal: false, goto: null, appear: false, open: null, notif: null, flash: "",
    // variant state
    startOnLaunch: true,
    wiz: { step: 0, envTest: {}, host: "local", dir: "~/code", sel: null, agent: null, alert: "away", notif: machine.notifPermission, done: false },
    check: { open: true, hidden: false, did: {} },
    tour: { step: 0, active: false, end: false, did: {} },
  };
}
const proj = () => S.projects.find((p) => p.id === S.active);
const winsOn = (p) => p.wins.filter((w) => w.ws === p.ws);
function addProject(host, path, agent, extra = {}) {
  const ex = S.projects.find((p) => p.host === host && p.path === path);
  if (ex) { S.active = ex.id; return ex; }
  if (!S.envs.includes(host)) S.envs.push(host);
  const p = { id: "p" + uid++, name: path.split("/").pop(), host, path, accent: ACCENTS[S.projects.length % ACCENTS.length], wins: [], ws: 0, focus: null, ...extra };
  S.projects.push(p); S.active = p.id;
  if (agent) addWin(p, agent);
  tick("open");
  return p;
}
function addWin(p, kind, opts = {}) {
  const w = { id: "w" + uid++, kind, ws: p.ws, sig: null, exited: AGENTS.some((a) => a.id === kind) && !has(kind), ...opts };
  p.wins.push(w); p.focus = w.id;
  if (["claude", "pi", "shell"].includes(kind)) tick("agent");
  if (winsOn(p).length >= 2) tick("second");
  return w;
}
function setWs(n) { const p = proj(); if (!p) return; p.ws = n; p.focus = winsOn(p)[0]?.id ?? null; if (n > 0) tick("ws"); }
function closeWin(id) { const p = proj(); p.wins = p.wins.filter((w) => w.id !== id); if (p.focus === id) p.focus = winsOn(p)[0]?.id ?? null; }
function flash(msg) { S.flash = msg; clearTimeout(flash.t); flash.t = setTimeout(() => { S.flash = ""; render(); }, 2600); }

/* simulate an agent stopping to ask you something (OSC 7501 "blocked") */
function raiseSignal() {
  const all = S.projects.flatMap((p) => p.wins.filter((w) => (w.kind === "claude" || w.kind === "pi") && !w.exited).map((w) => [p, w]));
  const pick = all.find(([p, w]) => !(p.id === S.active && p.focus === w.id && p.ws === w.ws)) ?? all[0];
  if (!pick) { flash("no running agent to signal: start claude or pi first"); return render(); }
  pick[1].sig = "blocked";
  const seen = pick[0].id === S.active && pick[0].focus === pick[1].id;
  if (!seen && (S.wiz.notif === "granted" || machine.notifPermission === "granted")) { S.notif = { title: `${pick[0].name} · ${pick[1].kind} needs you`, body: "Allow edit to src/App.tsx?" }; setTimeout(() => { S.notif = null; render(); }, 3500); }
  flash(`${pick[1].kind} in ${pick[0].name} needs you`);
  render();
}
function nextSignal() {
  for (const p of S.projects) for (const w of p.wins) if (w.sig === "blocked") {
    S.active = p.id; p.ws = w.ws; p.focus = w.id; w.sig = null; tick("signal"); flash(`jumped to ${w.kind} in ${p.name}`); return render();
  }
  flash("no agent needs you"); render();
}
const sigCount = () => S.projects.reduce((n, p) => n + p.wins.filter((w) => w.sig === "blocked").length, 0);

/* checklist (C) and tour (D) both listen to what you do */
function tick(key) { S.check.did[key] = true; S.tour.did[key] = true; }

/* ---------- screens ---------- */
function screen(p, w) {
  const cwd = `${p.host === "local" ? "" : p.host + ":"}${p.path}`;
  if (w.exited) return `<span class="c-m">${esc(cwd)} $</span> ${w.kind}\n<span class="c-b">${w.kind}: command not found</span>\n\n<span class="c-m">[exited 127 · press Enter to restart]</span>`;
  if (w.kind === "claude") {
    if (w.demo) return `<span class="c-v">✻</span> Welcome to <b>Claude Code</b>\n  <span class="c-m">cwd: ${esc(cwd)}</span>\n\n<span class="c-a">&gt;</span> add a dark theme toggle to the settings page\n\n<span class="c-o">●</span> Read(src/Settings.tsx)\n  <span class="c-m">└ Read 142 lines</span>\n<span class="c-o">●</span> Update(src/Settings.tsx)\n  <span class="c-m">└ 18 additions, 2 removals</span>\n\n<span class="c-w">✻ Running tests…</span> <span class="c-m">(esc to interrupt)</span>`;
    return `<span class="c-v">✻</span> Welcome to <b>Claude Code</b> <span class="c-m">v${AGENTS[0].ver}</span>\n  <span class="c-m">cwd: ${esc(cwd)}</span>\n\n<span class="c-a">&gt;</span> <span class="cursor"> </span>`;
  }
  if (w.kind === "pi") return `<span class="c-a">pi</span> <span class="c-m">v${AGENTS[1].ver} · ${esc(cwd)}</span>\n\n<span class="c-a">›</span> <span class="cursor"> </span>`;
  if (w.demo) return `<span class="c-m">${esc(cwd)} $</span> bun dev\n  <span class="c-o">VITE v8.0.16</span>  ready in 312 ms\n  ➜  Local:   <span class="c-a">http://localhost:5173/</span>\n`;
  return `<span class="c-m">${esc(cwd)} $</span> <span class="cursor"> </span>`;
}
function winHtml(p, w) {
  const f = p.focus === w.id;
  const chip = w.sig === "blocked" ? `<span class="chip blocked">needs you</span>` : w.demo && w.kind === "claude" ? `<span class="chip working">working</span>` : "";
  const body = w.kind === "file" ? `<pre class="code">${fileText(w.path)}</pre>` : w.kind === "browser"
    ? `<div class="page"><div class="addr">http://localhost:5173/</div><div class="blank">your dev server, live</div></div>`
    : `<pre class="screen">${screen(p, w)}</pre>`;
  return `<div class="win${f ? " focused" : ""}${w.sig ? " sig-" + w.sig : ""}" data-win="${w.id}">
    <div class="bar"><span class="dot${w.exited ? " exited" : ""}"></span><span class="kind">${w.kind}</span>${chip}<span class="ttl">${esc(w.kind === "file" ? w.path : p.path)}</span><button class="x" data-close="${w.id}" title="Close (Alt+Q)">×</button></div>${body}</div>`;
}

/* ---------- chrome ---------- */
function sidebar() {
  const envs = S.envs.map((h) => {
    const ps = S.projects.filter((p) => p.host === h);
    return `<h2><span class="ic">${h === "local" ? "▭" : "⇄"}</span>${esc(h)}</h2>` + (ps.length ? ps.map((p) => {
      const blocked = p.wins.some((w) => w.sig === "blocked");
      return `<div class="project${p.id === S.active ? " active" : ""}" style="--pa:${p.accent}" data-proj="${p.id}"><span class="swatch"><b>${esc(p.name[0])}</b>${blocked ? `<i class="sb"></i>` : ""}</span><span class="name">${esc(p.name)}</span>${p.sample ? `<span class="sample">sample</span>` : ""}<span class="count">${p.wins.length}</span></div>`;
    }).join("") : `<button class="env-empty" data-act="open">No projects · open one</button>`);
  }).join("");
  return `<aside id="side"><div class="side-head"><span>Projects</span><button class="collapse">«</button></div>${envs}
    <button class="add" id="openBtn" data-act="open"><span class="glyph">+</span>Open project<kbd>Alt O</kbd></button>
    <button class="add" data-act="addenv"><span class="glyph">⇄</span>Add environment</button>
    ${S.v === "C" ? checklistHtml() : ""}</aside>`;
}
function toolbar() {
  const p = proj();
  if (!p) return `<div class="top"><span class="where"></span><button class="tool" id="palBtn" data-act="pal" title="Commands (Alt+X)">⌘</button><button class="tool">?</button></div>`;
  const spaces = [0, 1, 2, 3].map((i) => {
    const used = p.wins.some((w) => w.ws === i), sig = p.wins.some((w) => w.ws === i && w.sig === "blocked");
    return `<button data-ws="${i}" class="${used ? "used" : ""}" aria-current="${p.ws === i}" title="Workspace ${i + 1} · Alt+${i + 1}">${i + 1}${sig ? `<i class="sb"></i>` : ""}</button>`;
  }).join("");
  const tabs = winsOn(p).map((w) => `<button class="tab" data-focus="${w.id}" aria-pressed="${p.focus === w.id}">${w.kind}${w.sig ? `<i class="att"></i>` : ""}</button>`).join("");
  return `<div class="top"><div class="spaces" id="spaces">${spaces}</div><div class="sep"></div>
    <div class="tabs" id="tabs">${tabs}<button class="tab-add" id="addBtn" data-act="menu" title="New window">+</button></div>
    <button class="where" id="where" data-act="goto" title="Go to file (Alt+T)">${esc((p.host === "local" ? "" : p.host + ":") + p.path)}</button>
    <button class="tool" id="palBtn" data-act="pal" title="Commands (Alt+X)">⌘</button><button class="tool" id="appBtn" data-act="appear" title="Project appearance (Alt+P)">◐ Appearance</button><button class="tool">?</button></div>`;
}
function stage() {
  const p = proj();
  if (!p) {
    if (S.v === "A" && S.startOnLaunch !== "off") return startPage();
    return `<div class="empty">Open a project (Alt+O) to get started.</div>`;
  }
  const ws = winsOn(p);
  if (!ws.length) return `<div class="empty"><b>Workspace ${p.ws + 1} of ${esc(p.name)} is empty</b><span>+ in the toolbar, or <kbd>Alt</kbd><kbd>Enter</kbd> for a terminal</span></div>`;
  return `<div class="world${ws.length === 1 ? " one" : ""}" style="grid-template-rows:repeat(${Math.max(1, ws.length - 1)}, minmax(0,1fr))">${ws.map((w) => winHtml(p, w)).join("")}</div>`;
}
function statusbar() {

function placeSpot() {
  const spot = $("spot"), coach = $("coach");
  if (!spot) return;
  const s = TOUR[S.tour.step], el = document.querySelector(s.sel);
  if (!el) return;
  const r = el.getBoundingClientRect(), pad = 4;
  Object.assign(spot.style, { left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: r.height + pad * 2 + "px" });
  const cw = coach.offsetWidth, ch = coach.offsetHeight, W = innerWidth, H = innerHeight;
  let x, y;
  if (s.side === "right") { x = r.right + 16; y = r.top + 60; }
  else if (s.side === "above") { x = r.left; y = r.top - ch - 16; }
  else if (s.side === "below-left") { x = r.right - cw; y = r.bottom + 14; }
  else { x = r.left; y = r.bottom + 14; }
  x += s.dx ?? 0; y += s.dy ?? 0; // clear of the popover this stop opens
  coach.style.left = Math.max(12, Math.min(W - cw - 12, x)) + "px";
  coach.style.top = Math.max(12, Math.min(H - ch - 80, y)) + "px";
}

const FILES = ["README.md", "package.json", "index.html", "src/App.tsx", "src/Settings.tsx", "src/main.tsx", "src/theme.ts", "src/components/Toggle.tsx", "tests/settings.test.ts"];
function fuzzy(q, f) { // subsequence match; returns f with matched letters bolded and its folder dimmed, or null
  const hit = new Set();
  let i = 0;
  [...f].forEach((c, j) => { if (i < q.length && c.toLowerCase() === q[i].toLowerCase()) { hit.add(j); i++; } });
  if (i < q.length) return null;
  const cut = f.lastIndexOf("/") + 1;
  const run = (a, b) => [...f.slice(a, b)].map((c, k) => hit.has(a + k) ? `<b>${esc(c)}</b>` : esc(c)).join("");
  return (cut ? `<span class="dir">${run(0, cut)}</span>` : "") + run(cut, f.length);
}
function gotoList() {
  const q = S.goto.q.trim();
  const hits = FILES.map((f) => [f, fuzzy(q, f)]).filter(([, m]) => m !== null).sort((a, b) => a[0].length - b[0].length);
  S.goto.hits = hits.map(([f]) => f);
  return hits.map(([f, m], i) => { return `<button class="gr${i === 0 ? " hi" : ""}" data-gfile="${f}">${m}</button>`; }).join("") || `<div class="mut" style="padding:8px">No file matches “${esc(q)}”</div>`;
}
function gotoHtml() {
  const r = $("where")?.getBoundingClientRect(); if (!r) return "";
  return `<div class="goto" style="left:${r.left}px;top:${r.bottom + 4}px"><input id="gotoq" placeholder="Go to file" autocomplete="off" spellcheck="false" value="${esc(S.goto.q)}"><div class="gl" id="gotol">${gotoList()}</div>
    <div class="gh"><span><kbd>Enter</kbd> open</span><span><kbd>Shift</kbd><kbd>Enter</kbd> @path to agent</span><span><kbd>Esc</kbd> close</span></div></div>`;
}
function openFile(f, toAgent) {
  const p = proj(); S.goto = null; tick("goto");
  if (toAgent) { flash(`typed @${f} into claude`); return render(); }
  const ex = p.wins.find((w) => w.kind === "file" && w.ws === p.ws);
  if (ex) { ex.path = f; p.focus = ex.id; } else addWin(p, "file", { path: f });
  render();
}
function fileText(f) {
  const body = f === "src/Settings.tsx"
    ? `import { createSignal } from "solid-js";\nimport { Toggle } from "./components/Toggle";\nimport { theme, setTheme } from "./theme";\n\nexport function Settings() {\n  const [saved, setSaved] = createSignal(false);\n  return (\n    <section class="settings">\n      <h2>Settings</h2>\n      <Toggle\n        label="Dark theme"\n        on={theme() === "dark"}\n        onChange={(on) => setTheme(on ? "dark" : "light")}\n      />\n    </section>\n  );\n}`
    : f.endsWith(".md") ? `# tour\n\nA sample project for the tri-code tour.\nClose it from the sidebar when you're done.` : `// ${f}\n// (sample file)`;
  return body.split("\n").map((l, i) => `<span class="ln">${i + 1}</span>${esc(l)}`).join("\n");
}
function appearHtml() {
  const r = $("appBtn")?.getBoundingClientRect(), p = proj(); if (!r || !p) return "";
  return `<div class="apop" style="left:${Math.max(8, r.right - 280)}px;top:${r.bottom + 4}px;--pa:${p.accent}"><div class="al">Name</div><div class="nm"><input value="${esc(p.name)}" spellcheck="false"></div>
    <div class="al">Icon</div><div class="icons"><span class="on">${esc(p.name[0].toUpperCase())}</span><span>◆</span><span>✦</span><span>λ</span><span>⚙</span></div>
    <div class="al">Accent</div><div class="sw">${ACCENTS.concat(["#e0af68", "#73daca"]).map((c) => `<button style="--c:${c}" data-accent="${c}" aria-pressed="${p.accent === c}"></button>`).join("")}</div>
    <div class="mut" style="font-size:11.5px">Background and signal sounds are in the full panel.</div></div>`;
}
const PAL = ["New claude window", "New browser window", "Next agent that needs you", "Layout: grid", "Open project…", "New worktree…", "Appearance", "Go to file…"];
function palHtml() { return `<div class="pal"><input id="palq" placeholder="Run a command…" autocomplete="off">${PAL.map((c, i) => `<button class="${i === 0 ? "hi" : ""}" data-pal="${i}">${c}</button>`).join("")}</div>`; }

/* ---------- render ---------- */
function render() {
  $("root").innerHTML = `<div class="app"${proj() ? ` style="--accent-raw:${proj().accent}"` : ""}>${sidebar()}${toolbar()}<div class="viewport" id="vp">${stage()}</div>${statusbar()}</div>`;
  let layer = "";
  if (S.v === "B" && !S.wiz.done) layer += wizard();
  if (S.v === "D") layer += tourLayer();
  if (S.open) layer += openDialog();
  if (S.menu) layer += menuHtml();
  if (S.pal) layer += palHtml();
  if (S.goto) layer += gotoHtml();
  if (S.appear) layer += appearHtml();
  if (S.notif) layer += `<div class="toastn"><b>${esc(S.notif.title)}</b><span class="mut">${esc(S.notif.body)}</span></div>`;
  $("layer").innerHTML = layer;
  if (S.pal) $("palq")?.focus();
  if (S.goto) { const i = $("gotoq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  placeSpot();
  vlabel.textContent = `${S.v} · ${NAMES[S.v]}`; vdesc.textContent = DESC[S.v];
  if (!$("drawer").hidden) drawer();
}

/* ---------- state drawer: what would persist, what would be detected ---------- */
function drawer() {
  const persisted = {
    A: { onboarding: { startPage: S.startOnLaunch !== "off" } },
    B: { onboarding: { wizardDone: S.wiz.done, step: S.wiz.step }, signals: { alert: S.wiz.alert, desktop: S.wiz.notif === "granted" } },
    C: { onboarding: { checklist: Object.keys(S.check.did).filter((k) => CHECK.some((c) => c.k === k)), hidden: S.check.hidden } },
    D: { onboarding: { tourDone: S.tour.end || (!S.tour.active && S.projects.length > 0), step: S.tour.step } },
  }[S.v];
  const out = {
    "state.json (new keys)": persisted,
    projects: S.projects.map((p) => `${p.host}:${p.path} (${p.wins.length} window${p.wins.length === 1 ? "" : "s"})${p.sample ? " sample" : ""}`),
    environments: S.envs,
    "detected on host": { claude: machine.claude ? `v${AGENTS[0].ver}` : null, pi: machine.pi ? `v${AGENTS[1].ver}` : null, sshAliases: sshHosts(), notifications: machine.notifPermission },
  };
  $("drawer").innerHTML = `<h5>The machine</h5>
    <label><input type="checkbox" data-m="claude" ${machine.claude ? "checked" : ""}> claude on PATH</label>
    <label><input type="checkbox" data-m="pi" ${machine.pi ? "checked" : ""}> pi on PATH</label>
    <label><input type="checkbox" data-m="ssh" ${machine.ssh ? "checked" : ""}> ~/.ssh/config has hosts (devbox, pi5)</label>
    <div class="row"><button class="dbtn" data-act="raise">Simulate: an agent needs you</button><button class="dbtn" data-act="replay">↺ first launch</button></div>
    <pre>${esc(JSON.stringify(out, null, 2))}</pre>`;
}

/* ---------- variants ---------- */
const ORDER = ["A", "B", "C", "D"];
const NAMES = { A: "Start page", B: "Setup wizard", C: "Checklist", D: "Guided tour" };
const DESC = {
  A: "The empty canvas becomes a welcome page: repos, servers, agents, four keys",
  B: "Four steps before the app: agents, environments, first project, signals",
  C: "Today's app plus a self-ticking Getting started card in the sidebar",
  D: "A sample project, already running, with an eight-stop spotlight tour",
};
const vlabel = $("vlabel"), vdesc = $("vdesc");
function reset() {
  S = { ...fresh(), v: S?.v ?? "A" };
  if (S.v === "D") startTour();
}
function setVariant(v, push) {
  if (!ORDER.includes(v)) v = "A";
  machine.notifPermission = "default";
  S = { v }; reset();
  if (push) {
    try {
      if (location.protocol === "file:") history.replaceState(null, "", "#" + v);
      else { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
    } catch { /* ignore */ }
  }
  render();
}
function cycle(d) { setVariant(ORDER[(ORDER.indexOf(S.v) + d + ORDER.length) % ORDER.length], true); }

/* ---------- events ---------- */
function testHost(h, then) {
  S.wiz.envTest[h] = "testing"; render();
  setTimeout(() => { S.wiz.envTest[h] = "ok"; if (!S.envs.includes(h)) S.envs.push(h); flash(`added ${h} · ${SSH[h].backend}`); then?.(); render(); }, 700);
}
function act(a, el) {
  const p = proj();
  switch (a) {
    case "open": S.open = { host: "local", dir: "~/code", sel: null }; S.menu = null; break;
    case "addenv": S.open = { host: "local", dir: "~", sel: null, addEnv: true }; break;
    case "openAddEnv": S.open.addEnv = true; break;
    case "closeOpen": S.open = null; break;
    case "doOpen": if (S.open.sel || S.open.dir !== "~") { addProject(S.open.host, S.open.sel ?? S.open.dir, null); S.open = null; flash("opened: + in the toolbar starts an agent"); } break;
    case "menu": S.menu = !S.menu; break;
    case "pal": S.pal = !S.pal; if (S.pal) tick("palette"); break;
    case "goto": if (!p) return; S.goto = S.goto ? null : { q: "" }; S.appear = false; break;
    case "appear": if (!p) return; S.appear = !S.appear; S.goto = null; break;
    case "raise": raiseSignal(); return;
    case "nextsig": nextSignal(); return;
    case "replay": reset(); break;
    case "startToggle": S.startOnLaunch = el.checked ? true : "off"; break;
    case "recheck": break;
    case "sound": flash("♪ two-note chime (the needs-you sound)"); break;
    case "notif": S.wiz.notif = "granted"; machine.notifPermission = "granted"; flash("the OS asked; you allowed it"); break;
    case "wnext": if (S.wiz.step < 3) S.wiz.step++; else wizFinish(); break;
    case "wback": S.wiz.step = Math.max(0, S.wiz.step - 1); break;
    case "wskip": S.wiz.done = true; flash("setup skipped: run it again from Alt+X › Set up tri-code"); break;
    case "cktoggle": S.check.open = !S.check.open; break;
    case "ckhide": S.check.hidden = true; flash("checklist hidden: bring it back from Alt+X › Getting started"); break;
    case "tourNext": if (S.tour.step < TOUR.length - 1) S.tour.step++; else { S.tour.active = false; S.tour.end = true; } break;
    case "tourBack": S.tour.step = Math.max(0, S.tour.step - 1); break;
    case "tourSkip": S.tour.active = false; S.tour.end = true; break;
    case "tourAgain": startTourAgain(); break;
    case "tourRemove": S.projects = S.projects.filter((x) => !x.sample); S.active = S.projects[0]?.id ?? null; S.tour.end = false; break;
    case "tourOpen": S.tour.end = false; S.open = { host: "local", dir: "~/code", sel: null }; break;
  }
  render();
}
function startTourAgain() { const p = S.projects.find((x) => x.sample); if (p) { S.active = p.id; p.ws = 0; p.focus = p.wins[0]?.id; } S.tour = { step: 0, active: true, end: false, did: {} }; }

document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest(".proto-bar, .drawer")) {
    if (t.closest("[data-act]") && t.closest(".drawer")) act(t.closest("[data-act]").dataset.act);
    return;
  }
  if (S.menu && !t.closest(".menu") && !t.closest("#addBtn")) { S.menu = null; render(); }
  if (S.pal && !t.closest(".pal") && !t.closest("#palBtn")) { S.pal = false; render(); }
  if (S.goto && !t.closest(".goto") && !t.closest("#where")) { S.goto = null; render(); }
  if (S.appear && !t.closest(".apop") && !t.closest("#appBtn")) { S.appear = false; render(); }
  if (t.matches("[data-scrim]")) { S.open = null; return render(); }
  const g = (sel) => t.closest(sel);
  let el;
  if ((el = g("[data-copy]"))) { navigator.clipboard?.writeText(el.dataset.copy).catch(() => {}); flash("copied: paste it in a terminal, then Recheck"); return render(); }
  if (g("[data-recheck]")) { flash(`rechecked PATH: ${AGENTS.filter((a) => has(a.id)).map((a) => a.id).join(", ")}`); return render(); }
  if ((el = g("[data-test]"))) { const h = el.dataset.test; const andOpen = el.dataset.andopen; testHost(h, andOpen ? () => { S.open = { host: h, dir: "~", sel: null }; } : null); return; }
  if ((el = g("[data-unenv]"))) { S.envs = S.envs.filter((h) => h !== el.dataset.unenv); delete S.wiz.envTest[el.dataset.unenv]; return render(); }
  if ((el = g("[data-openhost]"))) { S.open = { host: el.dataset.openhost, dir: "~", sel: null }; return render(); }
  if ((el = g("[data-quick]"))) { const [h, path, ag] = el.dataset.quick.split("|"); addProject(h, path, ag); flash(`opened ${path} with ${ag}`); return render(); }
  if ((el = g("[data-act]"))) return act(el.dataset.act, el);
  if ((el = g("[data-wstep]"))) { const n = +el.dataset.wstep; if (n <= S.wiz.step || (n === 3 && S.wiz.sel) || n < 2) S.wiz.step = n; return render(); }
  if ((el = g("[data-whost]"))) { Object.assign(S.wiz, { host: el.dataset.whost, dir: FOLDERS[el.dataset.whost]?.["~/code"] ? "~/code" : "~", sel: null }); return render(); }
  if ((el = g("[data-wdir]"))) { Object.assign(S.wiz, { dir: el.dataset.wdir, sel: null }); return render(); }
  if ((el = g("[data-wsel]"))) { const path = el.dataset.wsel; if (e.detail > 1 && FOLDERS[S.wiz.host]?.[path]) Object.assign(S.wiz, { dir: path, sel: null }); else S.wiz.sel = path; return render(); }
  if ((el = g("[data-wagent]"))) { S.wiz.agent = el.dataset.wagent; return render(); }
  if ((el = g("[data-walert]"))) { S.wiz.alert = el.dataset.walert; return render(); }
  if ((el = g("[data-ohost]"))) { Object.assign(S.open, { host: el.dataset.ohost, dir: "~", sel: null }); return render(); }
  if ((el = g("[data-odir]"))) { Object.assign(S.open, { dir: el.dataset.odir, sel: null }); return render(); }
  if ((el = g("[data-ouse]"))) { addProject(S.open.host, el.dataset.ouse, null); S.open = null; flash("opened: + in the toolbar starts an agent"); return render(); }
  if ((el = g("[data-osel]"))) { const path = el.dataset.osel; if (e.detail > 1 && FOLDERS[S.open.host]?.[path]) Object.assign(S.open, { dir: path, sel: null }); else S.open.sel = path; return render(); }
  if ((el = g("[data-new]"))) { const k = el.dataset.new; S.menu = null; const pr = proj(); if (pr) addWin(pr, k); return render(); }
  if ((el = g("[data-pal]"))) { S.pal = false; flash(`ran “${PAL[+el.dataset.pal]}”`); if (+el.dataset.pal === 2) return nextSignal(); return render(); }
  if ((el = g("[data-close]"))) { closeWin(el.dataset.close); return render(); }
  if ((el = g("[data-ws]"))) { setWs(+el.dataset.ws); return render(); }
  if ((el = g("[data-focus]"))) { proj().focus = el.dataset.focus; return render(); }
  if ((el = g("[data-win]"))) { const pr = proj(); const w = pr.wins.find((x) => x.id === el.dataset.win); pr.focus = w.id; if (w.sig) { w.sig = null; tick("signal"); } return render(); }
  if ((el = g("[data-proj]"))) { S.active = el.dataset.proj; return render(); }
  if ((el = g("[data-gfile]"))) return openFile(el.dataset.gfile, e.shiftKey);
  if ((el = g("[data-accent]"))) { proj().accent = el.dataset.accent; tick("appear"); return render(); }
  if ((el = g("[data-show]"))) { showMe(el.dataset.show); return; }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "gotoq") return;
  S.goto.q = e.target.value; $("gotol").innerHTML = gotoList();
});
document.addEventListener("change", (e) => {
  const m = e.target.dataset?.m;
  if (m) { machine[m] = e.target.checked; render(); }
  if (e.target.dataset?.act === "startToggle") act("startToggle", e.target);
});

addEventListener("keydown", (e) => {
  const t = document.activeElement;
  const typing = t && (t.tagName === "INPUT" && t.type !== "checkbox" || t.tagName === "TEXTAREA" || t.isContentEditable);
  if (e.key === "Escape") { S.open = null; S.menu = null; S.pal = false; S.goto = null; S.appear = false; return render(); }
  if (typing && t.id === "gotoq" && e.key === "Enter") { e.preventDefault(); const f = S.goto.hits?.[0]; if (f) openFile(f, e.shiftKey); return; }
  if (typing) { if (e.key === "Enter" && t.id === "palq") { S.pal = false; flash(`ran “${PAL[0]}”`); render(); } return; }
  if (e.altKey) {
    const k = e.key.toLowerCase(), p = proj();
    if (k === "o") { e.preventDefault(); return act("open"); }
    if (k === "x") { e.preventDefault(); return act("pal"); }
    if (k === "t") { e.preventDefault(); return act("goto"); }
    if (k === "p") { e.preventDefault(); return act("appear"); }
    if (k === "u") { e.preventDefault(); return nextSignal(); }
    if (k === "enter" && p) { e.preventDefault(); const f = p.wins.find((w) => w.id === p.focus); addWin(p, f && f.kind !== "browser" ? f.kind : "shell"); return render(); }
    if (k === "b" && p) { e.preventDefault(); addWin(p, "browser"); return render(); }
    if (/^[1-4]$/.test(k) && p) { e.preventDefault(); setWs(+k - 1); return render(); }
    if (k === "q" && p && p.focus) { e.preventDefault(); closeWin(p.focus); return render(); }
    return;
  }
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});
addEventListener("resize", placeSpot);
$("prev").onclick = () => cycle(-1);
$("next").onclick = () => cycle(1);
$("replay").onclick = () => act("replay");
$("stateBtn").onclick = () => { $("drawer").hidden = !$("drawer").hidden; render(); };

const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
setVariant(ORDER.includes(initial) ? initial : "A", false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
</body>
</html>
