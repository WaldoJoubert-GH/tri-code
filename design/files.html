<title>tri-code · files window prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser.
  Question: "What should a files window (file list + file view) look like on the canvas?"

  Four structurally different variants, switchable from the floating bar at the bottom
  (also ← / → keys). URL keeps the choice: files.html?variant=B (served) or files.html#B (file://).

  How it would map into the app (not built here):
  - New TabKind "files" beside "claude" | "pi" | "shell" | "browser" (issues is the same shape).
  - Canvas.tsx: a `files` case renders a panel instead of <div class="body"> / browser chrome.
  - Backend (src-tauri/src/dirs.rs is the model): list_files(host, path) + read_file(host, path),
    local via std::fs, remote over the existing ssh/sq helpers. Per-file size/type in the listing.
  - No new persistence beyond the tab itself; the selected path lives in runtime state.
  Layout variants differ in how the list and the view are arranged, so the winner decides the
  component split (one window vs. two) and the keyboard model, not just the CSS.
-->

/* ---------- sample project ---------- */
const TREE = [

const SRC_LAYOUT = `// Pure tiling maths: where each window of a workspace goes.
// No DOM, no state.

import type { Layout } from "./state";

export type Rect = { x: number; y: number; w: number; h: number };

export type Tiling = {
  rects: Rect[];
  split?: Rect;
};

export function tile(n, layout, ratio, width, height, gap, mono = -1): Tiling {
  const g = gap, ax = g, ay = g;
  const aw = Math.max(0, width - 2 * g);
  const ah = Math.max(0, height - 2 * g);
  const rects: Rect[] = [];
  if (layout === "master" && n > 1) {
    const mw = (aw - g) * ratio, k = n - 1;
    rects.push({ x: ax, y: ay, w: mw, h: ah });
    for (let i = 0; i < k; i++) {
      rects.push({ x: ax + mw + g, y: ay + i * 8, w: 1, h: 1 });
    }
  }
  return { rects };
}`;

const SRC_STATE = `import { createStore, produce } from "solid-js/store";

export type TabKind = "claude" | "pi" | "shell" | "browser";

export type Tab = {
  id: string;
  kind: TabKind;
  space: number;
  url?: string;
};

export const SPACES = 4;
export const GAPS = [0, 4, 8, 12, 16, 24, 32];

export function addTab(projectId: string, kind: TabKind) {
  const id = Math.random().toString(36).slice(2, 10);
  edit(projectId, (p) => {
    p.tabs.push({ id, kind, space: p.ws });
    p.spaces[p.ws].focus = id;
  });
  return id;
}`;

const SRC_APP = `import { For, Show, createSignal, onMount } from "solid-js";

export default function App() {
  const [ready, setReady] = createSignal(false);

  onMount(async () => {

    setReady(true);

}`;

const CONTENT = { "src/layout.ts": SRC_LAYOUT, "src/state.ts": SRC_STATE, "src/App.tsx": SRC_APP };
const META = {
  "src/layout.ts": ["TypeScript", 155],

/* ---------- helpers ---------- */
const NAMES = { A: "Explorer + editor", B: "Drill-down columns", C: "Quick open + tabs", D: "List window + view window" };
const DESC = {
  A: "Persistent tree, content beside it in one window",
  B: "Navigate folder by folder; the last column previews the file",
  C: "Search-first flat list overlaying a full-bleed code view with tabs",
  D: "Two tiled canvas windows: the list and the view are independent",
};
const ORDER = ["A", "B", "C", "D"];
const escAttr = (s) => String(s).replace(/"/g, "&quot;").replace(/</g, "&lt;");
const codeEsc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const TOK = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)*')|\b(import|export|from|type|const|let|function|return|if|else|for|of|new|class|extends|as|default|false|true|null|undefined)\b|\b(\d+(?:\.\d+)?)\b/g;
function hl(line) {
  return line.replace(TOK, (m, c, dq, sq, k, n) =>
    c ? `<span class="t-c">${c}</span>` : dq ? `<span class="t-s">${dq}</span>` : sq ? `<span class="t-s">${sq}</span>`
      : k ? `<span class="t-k">${k}</span>` : `<span class="t-n">${n}</span>`);
}
function codeHtml(src) {
  if (src == null || src === "") {
    return `<div class="cl"><span class="ln">  1</span><span class="ct t-c">// (file preview not included in this prototype)</span></div>`;
  }
  return String(src).split("\n").map((line, i) =>
    `<div class="cl"><span class="ln">${String(i + 1).padStart(3, " ")}</span><span class="ct">${hl(codeEsc(line)) || " "}</span></div>`).join("");
}
const EXT = { ts: ["TS", "#4d7fd6"], tsx: ["TX", "#3f9fd0"], css: ["CS", "#5aa7c9"], rs: ["RS", "#d08b4a"], json: ["{}", "#c9a24a"], md: ["MD", "#7aa87a"], svg: ["SV", "#a97fd0"], toml: ["TM", "#c96a7a"], html: ["<>", "#d08b4a"], lock: ["LK", "#8a8f9c"] };
function fileIcon(name) {
  const ext = name.split(".").pop();
  const [t, c] = EXT[ext] ?? ["··", "#8a8f9c"];
  return `<span class="fic" style="--fc:${c}">${t}</span>`;
}
function crumbs(p) { return p.split("/").join(' <span class="sepc">›</span> '); }
function meta(p) { const m = META[p]; return m ? `${m[1]} lines · ${m[0]}` : ""; }
function flatFiles(nodes = TREE, prefix = "", out = []) {
  for (const node of nodes) { const path = prefix ? prefix + "/" + node.n : node.n; node.d ? flatFiles(node.c, path, out) : out.push(path); }
  return out;
}
function childrenAt(segs) {
  let list = TREE;
  for (const s of segs) { const node = list.find((x) => x.d && x.n === s); if (!node) return []; list = node.c; }
  return list;
}

/* ---------- runtime state (in memory only — this is the thing being judged) ---------- */
const st = {
  v: "A",
  sel: "src/layout.ts",
  dirOpen: new Set(["src", "src-tauri"]),
  drill: ["src"],
  tabs: ["src/layout.ts", "src/state.ts"],
  active: "src/layout.ts",
  quickOpen: true,
  filter: "",
};

/* ---------- window primitives ---------- */
const win = (o) => `<div class="win ${o.cls || ""}">`
  + `<div class="bar"><span class="dot ${o.dot}"></span><span class="kind">${o.kind}</span><span class="ttl">${o.title}</span>`
  + `<button title="Maximize (Alt+F)">▢</button><button title="Close (Alt+Q)">×</button></div>${o.body}</div>`;

const termWin = () => win({ dot: "running", kind: "claude", title: "add a files window", cls: "", body:
  `<pre class="screen"><span class="c-v">✻</span> Welcome to <b>Claude Code</b>
<span class="c-m">  cwd: ~/code/tri-code</span>

<span class="c-a">&gt;</span> add a files window to the canvas

<span class="c-o">●</span> Each new TabKind needs a case in Canvas.tsx
<span class="c-o">●</span> Read(src/Canvas.tsx)
<span class="c-m">  └  Read 340 lines</span>
<span class="c-o">●</span> The backend mirror of dirs.rs is list_files

<span class="c-w">✻ Planning the files panel…</span> <span class="c-m">(esc to interrupt)</span>

<span class="c-a">&gt;</span> </pre>` });

function treeHtml(nodes, depth, prefix) {
  return nodes.map((node) => {
    const path = prefix ? prefix + "/" + node.n : node.n;
    const pad = 4 + depth * 13;
    if (node.d) {
      const open = st.dirOpen.has(path);
      return `<div class="row dir${open ? " open" : ""}" data-dir="${path}" style="padding-left:${pad}px">`
        + `<span class="tw">${open ? "▾" : "▸"}</span><span class="fic dir"></span><span class="nm dname">${node.n}</span></div>`
        + (open ? treeHtml(node.c, depth + 1, path) : "");
    }
    const sel = path === st.sel ? " sel" : "";
    return `<div class="row file${sel}" data-sel="${path}" style="padding-left:${pad}px">`
      + `<span class="tw"></span>${fileIcon(node.n)}<span class="nm">${node.n}</span></div>`;
  }).join("");
}

/* ---------- variants ---------- */
function variantA() {
  return win({ dot: "files", kind: "files", title: `tri-code · ${flatFiles().length} files`, cls: "fileswin", body:
    `<div class="files split">
       <div class="explorer">
         <div class="pane-head"><span class="proj">tri-code</span><span class="path">~/code/tri-code</span></div>
         <div class="tree">${treeHtml(TREE, 0, "")}</div>
       </div>
       <div class="editor">
         <div class="pane-head"><span class="crumb">${crumbs(st.sel)}</span><span class="meta">${meta(st.sel)}</span></div>
         <pre class="code">${codeHtml(CONTENT[st.sel] ?? "")}</pre>
       </div>
     </div>` }) + termWin();
}

function colHtml(list, segs, i) {
  return `<div class="col">` + list.map((node) => {
    if (node.d) {
      const open = st.drill[i] === node.n;
      return `<div class="row dir${open ? " sel" : ""}" data-drill="${i}:${node.n}"><span class="fic dir"></span><span class="nm dname">${node.n}</span><span class="tw">›</span></div>`;
    }
    const path = [...segs, node.n].join("/");
    return `<div class="row file${path === st.sel ? " sel" : ""}" data-sel="${path}">${fileIcon(node.n)}<span class="nm">${node.n}</span></div>`;
  }).join("") + `</div>`;
}

function variantB() {
  const cols = [];
  for (let i = 0; i <= st.drill.length; i++) cols.push(colHtml(childrenAt(st.drill.slice(0, i)), st.drill.slice(0, i), i));
  const parts = ["tri-code", ...st.drill];
  const crumb = parts.map((p, i) => `<button data-crumb="${i}">${p}</button>`).join('<span class="sepc">›</span>')
    + `<span class="sepc">›</span><span class="seg-part">${st.sel.split("/").pop()}</span>`;
  return win({ dot: "files", kind: "files", title: `tri-code · ${st.sel}`, cls: "fileswin", body:
    `<div class="crumbbar">${crumb}${st.drill.length ? `<button class="up" data-up title="Up one level (⌫)">↑</button>` : ""}</div>
     <div class="files miller">
       ${cols.join("")}
       <div class="col preview"><div class="pane-head"><span class="crumb">${st.sel.split("/").pop()}</span><span class="meta">${meta(st.sel)}</span></div>
         <pre class="code">${codeHtml(CONTENT[st.sel] ?? "")}</pre></div>
     </div>` }) + termWin();
}

function qResultsHtml() {
  const q = st.filter.toLowerCase();
  const files = flatFiles().filter((f) => f.toLowerCase().includes(q)).slice(0, 20);
  return files.map((f, i) => {
    const name = f.split("/").pop();
    return `<div class="qres${i === 0 ? " hi" : ""}" data-open="${f}">${fileIcon(name)}<span>${name}</span><span class="path">${f.split("/").slice(0, -1).join("/") || "."}</span></div>`;
  }).join("") || `<div class="qnone">No files match</div>`;
}

function variantC() {
  const tabs = st.tabs.map((p) => `<button data-tab="${p}" aria-selected="${p === st.active}">${fileIcon(p.split("/").pop())}<span>${p.split("/").pop()}</span></button>`).join("");
  const panel = st.quickOpen ? `<div class="qpanel">
      <div class="qin"><span class="qico">⌕</span><input id="qfilter" placeholder="Go to file…" value="${escAttr(st.filter)}" spellcheck="false"><kbd>Esc</kbd></div>
      <div class="qlist">${qResultsHtml()}</div>
      <div class="qhint"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open</div>
    </div>` : "";
  return win({ dot: "files", kind: "files", title: st.active, cls: "fileswin", body:
    `<div class="files quick"><div class="qview">
       <div class="qtabs">${tabs}<button class="qtoggle" data-quick-toggle title="Quick open (Ctrl+P)">⌘P  Quick open</button></div>
       <pre class="code">${codeHtml(CONTENT[st.active] ?? "")}</pre>
     </div>${panel}</div>` }) + termWin();
}

function variantD() {
  const list = win({ dot: "files", kind: "files", title: `tri-code · ${flatFiles().length} files`, cls: "fileswin focused", body:
    `<div class="explorer">
       <div class="pane-head"><span class="proj">tri-code</span><span class="path">~/code/tri-code</span></div>
       <div class="tree">${treeHtml(TREE, 0, "")}</div>
     </div>` });
  const view = win({ dot: "files", kind: "file", title: st.sel, cls: "filewin", body:
    `<div class="editor">
       <div class="pane-head"><span class="crumb">${crumbs(st.sel)}</span><span class="meta">${meta(st.sel)}</span></div>
       <pre class="code">${codeHtml(CONTENT[st.sel] ?? "")}</pre>
     </div>` });
  return list + view + termWin();
}

/* ---------- render + switcher ---------- */
const world = document.getElementById("world");
const vlabel = document.getElementById("vlabel");
const vdesc = document.getElementById("vdesc");
const focusInfo = document.getElementById("focusInfo");

function render() {
  world.className = "world " + (st.v === "D" ? "v-d" : "v-abc");
  world.innerHTML = st.v === "A" ? variantA() : st.v === "B" ? variantB() : st.v === "C" ? variantC() : variantD();
  vlabel.textContent = `${st.v} · ${NAMES[st.v]}`;
  vdesc.textContent = DESC[st.v];
  const shown = st.v === "C" ? st.active : st.sel;
  focusInfo.textContent = `files · ${shown}  [main 62% · gap 12]`;
}

function setVariant(v, push) {
  if (!ORDER.includes(v)) v = "A";
  st.v = v;
  if (push) {
    try {
      if (location.protocol === "file:") location.hash = v;
      else { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
    } catch { /* ignore */ }
  }
  render();
}
function cycle(d) { setVariant(ORDER[(ORDER.indexOf(st.v) + d + ORDER.length) % ORDER.length], true); }

document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);

addEventListener("keydown", (e) => {
  const t = document.activeElement;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) {
    if (e.key === "Escape" && t.id === "qfilter") { st.quickOpen = false; render(); }
    return;
  }
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});

world.addEventListener("click", (e) => {
  const t = e.target;
  const dir = t.closest("[data-dir]");
  if (dir) { const p = dir.dataset.dir; st.dirOpen.has(p) ? st.dirOpen.delete(p) : st.dirOpen.add(p); render(); return; }
  const dr = t.closest("[data-drill]");
  if (dr) { const [i, name] = dr.dataset.drill.split(":"); st.drill = st.drill.slice(0, +i).concat(name); render(); return; }
  const cr = t.closest("[data-crumb]");
  if (cr) { st.drill = st.drill.slice(0, +cr.dataset.crumb); render(); return; }
  if (t.closest("[data-up]")) { st.drill = st.drill.slice(0, -1); render(); return; }
  const sel = t.closest("[data-sel]");
  if (sel) { st.sel = sel.dataset.sel; render(); return; }
  const tab = t.closest("[data-tab]");
  if (tab) { st.active = tab.dataset.tab; st.quickOpen = false; render(); return; }
  const open = t.closest("[data-open]");
  if (open) { const p = open.dataset.open; if (!st.tabs.includes(p)) st.tabs.push(p); st.active = p; st.quickOpen = false; render(); return; }
  if (t.closest("[data-quick-toggle]")) { st.quickOpen = true; render(); return; }
});

world.addEventListener("input", (e) => {
  if (e.target.id !== "qfilter") return;
  st.filter = e.target.value;
  const list = world.querySelector(".qlist");
  if (list) list.innerHTML = qResultsHtml();
});
world.addEventListener("keydown", (e) => {
  if (e.target.id === "qfilter" && e.key === "Enter") {
    const first = flatFiles().filter((f) => f.toLowerCase().includes(st.filter.toLowerCase()))[0];
    if (first) { if (!st.tabs.includes(first)) st.tabs.push(first); st.active = first; st.quickOpen = false; render(); }
  }
});

const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
setVariant(ORDER.includes(initial) ? initial : "A", false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
</body>
</html>
