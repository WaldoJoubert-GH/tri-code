<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tri-code · browser loading prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser
  (or visit /design/browser-loading.html on the dev server).

  Question: "How does a browser Window show that its page is loading?"
  The state already exists and is unused: browser.rs on_page_load emits "browser-nav"
  {label, url, loading} (PageLoadEvent::Started → true, Finished → false), and browsers.ts keeps
  it in BrowserInfo.loading per page. Nothing in Canvas.tsx renders it yet.

  Constraints that shape every variant:
  - The page is a native webview positioned over .page. tri-code's own HTML cannot draw over
    the page, so the indicator has to live in the chrome: title bar, page tabs, nav row, border.
  - We only get Started / Finished: no percentage. Any "progress" is faked (a trickle).
  - Like a real browser, the old page stays visible until the new one commits, so without an
    indicator a slow click looks like nothing happened.
  - App windows (agent bar "app") hide the nav row (bare mode), so a nav-only indicator vanishes
    there. Background pages (Ctrl+click) load hidden; only their tab can show it.

  OUTCOME (settled): variant B, trickle style. It shipped as LoadBar in src/Canvas.tsx (.loadbar in
  src/canvas.css), keyed per page and hidden for loads under 150 ms. No Stop button, no Rust change.
  Linux framed mode still never reports loading.

  Four variants, A–D, switchable from the floating bar (also ← / → when no field is focused).
  URL keeps the choice: browser-loading.html?variant=B (served) or browser-loading.html#B (file://).

  A  Reload → Stop      ↻ becomes ✕ with a spinning ring; a spinner on the page tab
  B  Progress line      a thin trickle bar on the nav row's bottom edge (on the title bar when bare)
  C  Tab + title        spinner in the page tab / before the title; nothing in the nav row
  D  Address shimmer    the address field sweeps and reads "Loading host…"; ✕ in place of the star

  "Show after" delays every indicator so fast loads (localhost HMR, cached pages) do not flicker.

  How it would land (not built here):
  - Canvas.tsx reads browserInfo[pageId()].loading (shown page) and browserInfo[pg.id].loading
    (each .ptab). No Rust change for display.
  - Stop (A, D) needs a browser_stop command: find(&app,&label)?.eval("window.stop()").
  - Linux framed mode (iframe) never sets loading=true today: patchInfo(..., loading:false).
    It would need iframe onload to flip it.
-->
<style>
:root {
  --bg: #fbfbfc; --panel: #f1f2f5; --canvas: #e6e8ed; --line: #d9dce3; --hover: #e6e8ee; --raised: #dfe2ea;
  --text: #23262d; --muted: #6b7080; --warn: #9a6400; --ok: #3d7a1c; --bad: #c4314b;
  --accent: color-mix(in oklab, #7aa2f7 76%, #000);
  --page-bg: #ffffff; --page-fg: #1b1e24; --page-muted: #6b7280; --page-line: #e3e6eb; --page-link: #2f6fdf;
  --ui: system-ui, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f12; --panel: #15171c; --canvas: #0b0c0f; --line: #24272f; --hover: #1c1f26; --raised: #232733;
    --text: #d6d8de; --muted: #7d828f; --warn: #e0af68; --ok: #9ece6a; --bad: #f7768e;
    --accent: #7aa2f7; --page-bg: #f7f8fa;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f12; --panel: #15171c; --canvas: #0b0c0f; --line: #24272f; --hover: #1c1f26; --raised: #232733;
  --text: #d6d8de; --muted: #7d828f; --warn: #e0af68; --ok: #9ece6a; --bad: #f7768e;
  --accent: #7aa2f7; --page-bg: #f7f8fa;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); color: var(--text); font: 13px var(--ui); display: flex; overflow: hidden; }
button { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; }

/* ---- controls ---- */
.side { width: 270px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.side h1 { font-size: 14px; margin: 0; }
.side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
.side p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.btns { display: grid; gap: 4px; }
.btns button, .seg button { text-align: left; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.btns button:hover, .seg button:hover { border-color: var(--accent); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; text-align: center; }
.seg button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
pre.state { margin: 0; font: 11px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; white-space: pre-wrap; }
.log { font: 11px/1.5 var(--mono); color: var(--muted); max-height: 160px; overflow: auto; }

/* ---- canvas ---- */
.canvas { flex: 1; min-width: 0; padding: 10px 10px 90px; display: grid; grid-template-columns: 3fr 2fr; gap: 10px; }
.win { display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
.win.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.bar { height: 28px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 4px 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--text); position: relative; user-select: none; }
.bar .kind { font-weight: 600; }
.bar .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.bar button { width: 22px; height: 22px; border-radius: 4px; color: var(--muted); flex: none; }
.bar button:hover { background: var(--hover); color: var(--text); }
.dot { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); flex: none; }
.ptabs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; }
.ptab { height: 22px; flex: 0 1 170px; min-width: 48px; display: flex; align-items: center; gap: 5px; padding: 0 2px 0 8px; border-radius: 4px; color: var(--muted); font-size: 12px; cursor: default; }
.ptab:hover { background: var(--hover); }
.ptab.on { background: var(--raised); color: var(--text); }
.ptab span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptab button { width: 18px; height: 18px; }
.nav { height: 32px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; }
.nav button { width: 24px; height: 24px; border-radius: 4px; color: var(--muted); flex: none; position: relative; }
.nav button:hover { background: var(--hover); color: var(--text); }
.addr { flex: 1; min-width: 0; margin: 0 4px; position: relative; display: flex; }
.url { flex: 1; min-width: 0; font: 12px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 26px 3px 8px; outline: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; position: relative; }
.nav .star { position: absolute; right: 1px; top: 1px; width: 22px; height: 20px; font-size: 14px; }
.favs { height: 26px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.favs span { padding: 0 8px; }
.page { flex: 1; min-height: 0; overflow: auto; background: var(--page-bg); color: var(--page-fg); padding: 18px 22px; position: relative; }
.page h3 { margin: 0 0 4px; font-size: 18px; }
.page .sub { color: var(--page-muted); font-size: 12px; margin-bottom: 14px; }
.page .links { display: grid; gap: 6px; max-width: 360px; }
.page a { color: var(--page-link); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.page a small { color: var(--page-muted); text-decoration: none; margin-left: 6px; }
.page .blk { height: 10px; background: var(--page-line); border-radius: 3px; margin: 8px 0; }
.native { position: absolute; right: 8px; bottom: 6px; font: 10px var(--mono); color: var(--page-muted); }

/* ---- loading indicators ---- */
.spin { width: 11px; height: 11px; border-radius: 50%; border: 1.6px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: rot .7s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }

/* A: ring around the stop button */
.nav button.stop { color: var(--text); }
.nav button.stop::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 1.6px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); animation: rot .8s linear infinite; }

/* B: trickle progress line (fake: eases toward 85%, snaps to 100% then fades) */
.prog { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); box-shadow: 0 0 6px var(--accent); z-index: 2; width: 0; }
.prog.run { animation: trickle 9s cubic-bezier(.08,.75,.25,1) forwards; }
.prog.done { width: 100%; opacity: 0; transition: width 180ms ease-out, opacity 260ms 160ms; }
@keyframes trickle { 0% { width: 0; } 8% { width: 30%; } 100% { width: 88%; } }
.prog.ind { width: 30%; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }

/* D: shimmer in the address */
.url.shim { color: var(--muted); background-image: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--accent) 22%, transparent) 50%, transparent 80%); background-size: 200% 100%; animation: shim 1.2s linear infinite; border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
@keyframes shim { from { background-position: 150% 0; } to { background-position: -50% 0; } }

/* C: title bar line under the whole window when bare + tab text pulse */
.ptab.ld span, .ttl.ld .t { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }

/* ---- switcher ---- */
.switcher { position: fixed; left: calc(50% + 135px); bottom: 18px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: #111; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.35); font: 12px var(--ui); }
.switcher button { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 16px; }
.switcher button:hover { background: #333; }
.switcher .lbl { padding: 0 8px; min-width: 240px; text-align: center; }
.switcher .lbl b { color: #ffd479; margin-right: 6px; }
.switcher .lbl small { display: block; color: #aaa; font-size: 10.5px; }

@media (max-width: 760px) {
  body { flex-direction: column; overflow: auto; }
  .side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .canvas { grid-template-columns: 1fr; padding: 10px 16px 90px; min-height: 900px; }
  .switcher { left: 50%; }
  .switcher .lbl { min-width: 0; }
}
</style>
</head>
<body>
<aside class="side">
  <div>
    <h1>Browser loading — prototype</h1>
    <p>Click links inside the pages, or drive loads from here. The old page stays up until the new one finishes, like the real webview.</p>
  </div>
  <div>
    <h2>Shown page (left window)</h2>
    <div class="btns">
      <button data-act="fast">Fast load · 120 ms (HMR)</button>
      <button data-act="med">Normal load · 1.2 s</button>
      <button data-act="slow">Slow load · 5 s</button>
      <button data-act="hang">Hangs (never finishes)</button>
      <button data-act="bg">Ctrl+click → background tab loads 3 s</button>
    </div>
  </div>
  <div>
    <h2>App window (right, bare)</h2>
    <div class="btns">
      <button data-act="app">Navigate · 2.5 s</button>
      <button data-act="appaddr">Toggle address bar</button>
    </div>
  </div>
  <div>
    <h2>Show indicator after</h2>
    <div class="seg" id="delay">
      <button data-d="0">0 ms</button><button data-d="150">150 ms</button><button data-d="400">400 ms</button>
    </div>
  </div>
  <div>
    <h2>Progress style (B)</h2>
    <div class="seg" id="pstyle">
      <button data-p="trickle">Trickle</button><button data-p="ind">Indeterminate</button>
    </div>
  </div>
  <div>
    <h2>State</h2>
    <pre class="state" id="state"></pre>
  </div>
  <div>
    <h2>Events</h2>
    <div class="log" id="log"></div>
  </div>
</aside>

<main class="canvas" id="canvas"></main>

<div class="switcher">
  <button id="prev" title="Previous variant (←)">‹</button>
  <div class="lbl" id="vlbl"></div>
  <button id="next" title="Next variant (→)">›</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const VARIANTS = {
  A: { name: "Reload → Stop", sub: "↻ becomes ✕ with a ring · tab spinner" },
  B: { name: "Progress line", sub: "edge of nav row · title bar when bare" },
  C: { name: "Tab + title spinner", sub: "nothing in the nav row" },
  D: { name: "Address shimmer", sub: "address sweeps · ✕ replaces ☆" },
};
const KEYS = Object.keys(VARIANTS);
let V = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
if (!VARIANTS[V]) V = "A";

const SITES = {
  "localhost:5173/": { title: "Vite App", h: "Dashboard", sub: "dev server · HMR" },
  "localhost:5173/settings": { title: "Settings · Vite App", h: "Settings", sub: "dev server" },
  "docs.rs/tauri/latest": { title: "tauri - Rust", h: "Crate tauri", sub: "docs.rs" },
  "github.com/tauri-apps/tauri": { title: "tauri-apps/tauri", h: "tauri-apps / tauri", sub: "github.com" },
  "slow.example.com/report": { title: "Quarterly report", h: "Report", sub: "a slow server" },
  "linear.app/team/issues": { title: "Issues · Linear", h: "My issues", sub: "web app" },
  "linear.app/team/issue/42": { title: "TRI-42 · Linear", h: "TRI-42 Loading indicator", sub: "web app" },
};

// In-memory state: one browser Window with two pages, one bare app Window with one page.
const S = {
  delay: 0, pstyle: "trickle",
  wins: {
    w1: { kind: "browser", shown: "p1", pages: ["p1", "p2"], bare: false },
    w2: { kind: "linear", shown: "p3", pages: ["p3"], bare: true, app: true },
  },
  pages: {
    p1: { url: "localhost:5173/", loading: false },
    p2: { url: "docs.rs/tauri/latest", loading: false },
    p3: { url: "linear.app/team/issues", loading: false },
  },
};
const timers = {};
let seq = 3;

function log(msg) {
  const el = $("log");
  el.insertAdjacentHTML("afterbegin", `<div>${new Date().toLocaleTimeString().slice(0, 8)} ${msg}</div>`);
}

/** browser-nav {loading:true} … later {loading:false}; ms = Infinity never finishes. */
function navigate(pid, url, ms) {
  const p = S.pages[pid];
  clearTimeout(timers[pid]); clearTimeout(timers[pid + "show"]);
  Object.assign(p, { target: url, loading: true, startedAt: performance.now(), visible: S.delay === 0, done: false });
  log(`browser-nav ${pid} loading:true → ${url}`);
  if (S.delay) timers[pid + "show"] = setTimeout(() => { if (p.loading) { p.visible = true; render(); } }, S.delay);
  if (ms !== Infinity) timers[pid] = setTimeout(() => finish(pid), ms);
  render();
}
function finish(pid, stopped) {
  const p = S.pages[pid];
  if (!p.loading) return;
  clearTimeout(timers[pid]); clearTimeout(timers[pid + "show"]);
  if (!stopped) p.url = p.target;
  const wasVisible = p.visible;
  Object.assign(p, { loading: false, visible: false, target: undefined, done: wasVisible });
  log(stopped ? `browser_stop ${pid} (window.stop())` : `browser-nav ${pid} loading:false`);
  render();
  if (p.done) setTimeout(() => { p.done = false; render(); }, 450);
}
const title = (pid) => SITES[S.pages[pid].url]?.title ?? (S.pages[pid].url || "New tab");
const host = (u) => u.split("/")[0];
const ago = (p) => `animation-delay:-${Math.round(performance.now() - p.startedAt - S.delay)}ms`;

/* ---------- rendering ---------- */
function spinner(p) { return p.visible ? `<span class="spin" style="${ago(p)}"></span>` : ""; }
function progress(p) {
  if (p.visible) return S.pstyle === "ind" ? `<div class="prog ind"></div>` : `<div class="prog run" style="${ago(p)}"></div>`;
  if (p.done) return `<div class="prog done" id="pdone"></div>`;
  return "";
}

function renderWin(wid) {
  const w = S.wins[wid], p = S.pages[w.shown], ld = p.visible;
  const multi = w.pages.length > 1;
  const tabSpin = (pid) => (V === "A" || V === "C") ? spinner(S.pages[pid]) : "";

  // Title bar: page tabs when >1 page, else the title.
  let bar = `<div class="bar"><span class="dot"></span><span class="kind">${w.kind}</span>`;
  if (multi) {
    bar += `<div class="ptabs">` + w.pages.map((pid) => {
      const q = S.pages[pid];
      return `<div class="ptab ${pid === w.shown ? "on" : ""} ${V === "C" && q.visible ? "ld" : ""}" data-tab="${wid}:${pid}">${tabSpin(pid)}<span>${q.visible && V === "C" ? "Loading…" : title(pid)}</span><button>×</button></div>`;
    }).join("") + `</div><button title="New tab">+</button>`;
  } else {
    const showSpin = V === "C" || (V === "A" && w.bare) || (V === "D" && w.bare);
    bar += `<span class="ttl ${V === "C" && ld ? "ld" : ""}">${showSpin ? spinner(p) : ""}<span class="t">${title(w.shown)}</span></span>`;
  }
  if (w.app) bar += `<button data-addr="${wid}" title="Show the address bar">${w.bare ? "⋯" : "⌃"}</button>`;
  bar += `<button>–</button><button>▢</button><button>×</button>`;
  if (V === "B" && w.bare) bar += progress(p);
  bar += `</div>`;

  // Nav row.
  let nav = "";
  if (!w.bare) {
    const stopA = V === "A" && ld;
    const reload = stopA
      ? `<button class="stop" data-stop="${w.shown}" title="Stop (Esc)" style="--x:0">✕</button>`
      : `<button data-reload="${w.shown}" title="Reload">↻</button>`;
    const shim = V === "D" && ld;
    const addrText = shim ? `Loading ${host(p.target)}…` : (p.loading ? p.target : p.url);
    const star = V === "D" && ld
      ? `<button class="star" data-stop="${w.shown}" title="Stop (Esc)">✕</button>`
      : `<button class="star" title="Favourite">☆</button>`;
    nav = `<div class="nav"><button title="Back">←</button><button title="Forward">→</button>${reload}
      <span class="addr"><div class="url ${shim ? "shim" : ""}" style="${shim ? ago(p) : ""}">${addrText}</div>${star}</span>
      <button title="Open in system browser">↗</button>${V === "B" ? progress(p) : ""}</div>
      <div class="favs"><span>★ localhost</span><span>★ docs.rs</span><span>★ github</span></div>`;
  }

  // Page: the committed URL's content (the old page stays until the load finishes).
  const site = SITES[p.url] ?? { h: p.url, sub: "" };
  const links = w.app
    ? `<a data-go="${w.shown}|linear.app/team/issue/42|2500">Open TRI-42<small>2.5 s</small></a><a data-go="${w.shown}|linear.app/team/issues|600">Back to issues<small>0.6 s</small></a>`
    : `<a data-go="${w.shown}|localhost:5173/settings|120">Settings<small>120 ms, HMR-fast</small></a>
       <a data-go="${w.shown}|localhost:5173/|120">Dashboard<small>120 ms</small></a>
       <a data-go="${w.shown}|github.com/tauri-apps/tauri|1200">GitHub repo<small>1.2 s</small></a>
       <a data-go="${w.shown}|slow.example.com/report|5000">Slow report<small>5 s</small></a>
       <a data-go="${w.shown}|slow.example.com/report|Infinity">Hanging link<small>never</small></a>`;
  const page = `<div class="page"><h3>${site.h}</h3><div class="sub">${site.sub}</div>
    <div class="links">${links}</div><div class="blk" style="width:80%"></div><div class="blk" style="width:60%"></div><div class="blk" style="width:70%"></div>
    <span class="native">native webview — chrome can't draw here</span></div>`;

  return `<section class="win ${wid === "w1" ? "focused" : ""}">${bar}${nav}${page}</section>`;
}

function render() {
  $("canvas").innerHTML = renderWin("w1") + renderWin("w2");
  const d = $("pdone"); if (d) { d.style.width = "88%"; d.style.opacity = 1; requestAnimationFrame(() => requestAnimationFrame(() => { d.style.width = ""; d.style.opacity = ""; })); }
  const v = VARIANTS[V];
  $("vlbl").innerHTML = `<b>${V}</b>${v.name}<small>${v.sub} · ←/→ · ?variant=${KEYS.join("|")}</small>`;
  document.querySelectorAll("#delay button").forEach((b) => b.classList.toggle("on", +b.dataset.d === S.delay));
  document.querySelectorAll("#pstyle button").forEach((b) => b.classList.toggle("on", b.dataset.p === S.pstyle));
  const view = { variant: V, showAfterMs: S.delay, windows: S.wins, pages: Object.fromEntries(Object.entries(S.pages).map(([k, p]) => [k, { url: p.url, loading: p.loading, indicatorShown: !!p.visible, ...(p.target ? { target: p.target } : {}) }])) };
  $("state").textContent = JSON.stringify(view, null, 1).replace(/[{}"]/g, "").replace(/\n\s*\n/g, "\n").replace(/,\n/g, "\n").trim();
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-stop],[data-reload],[data-tab],[data-addr],[data-act],[data-d],[data-p]");
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) {
    const [pid, url, ms] = ds.go.split("|");
    if (e.ctrlKey || e.metaKey) return bgTab(url, +ms);
    navigate(pid, url, ms === "Infinity" ? Infinity : +ms);
  } else if (ds.stop) finish(ds.stop, true);
  else if (ds.reload) navigate(ds.reload, S.pages[ds.reload].url, 900);
  else if (ds.tab) { const [w, p] = ds.tab.split(":"); S.wins[w].shown = p; render(); }
  else if (ds.addr) { S.wins[ds.addr].bare = !S.wins[ds.addr].bare; render(); }
  else if (ds.d) { S.delay = +ds.d; render(); }
  else if (ds.p) { S.pstyle = ds.p; render(); }
  else if (ds.act) {
    const shown = S.wins.w1.shown;
    ({
      fast: () => navigate(shown, "localhost:5173/settings", 120),
      med: () => navigate(shown, "github.com/tauri-apps/tauri", 1200),
      slow: () => navigate(shown, "slow.example.com/report", 5000),
      hang: () => navigate(shown, "slow.example.com/report", Infinity),
      bg: () => bgTab("github.com/tauri-apps/tauri", 3000),
      app: () => navigate("p3", S.pages.p3.url.endsWith("42") ? "linear.app/team/issues" : "linear.app/team/issue/42", 2500),
      appaddr: () => { S.wins.w2.bare = !S.wins.w2.bare; render(); },
    })[ds.act]();
  }
});
function bgTab(url, ms) {
  const pid = "p" + ++seq;
  S.pages[pid] = { url: "", loading: false };
  S.wins.w1.pages.push(pid);
  log(`browser-open ${pid} background:true`);
  navigate(pid, url, ms);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { const p = S.wins.w1.shown; if (S.pages[p].loading) finish(p, true); return; }
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  if (e.target.closest?.("input, textarea, [contenteditable]")) return;
  go(e.key === "ArrowLeft" ? -1 : 1);
});
function go(d) {
  V = KEYS[(KEYS.indexOf(V) + d + KEYS.length) % KEYS.length];
  if (location.protocol === "file:") location.hash = V;
  else { const u = new URL(location.href); u.searchParams.set("variant", V); history.replaceState(null, "", u); }
  log(`variant ${V} · ${VARIANTS[V].name}`);
  render();
}
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
render();
</script>
