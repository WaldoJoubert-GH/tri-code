<title>tri-code · projects prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser
  (or visit /design/projects.html on the dev server).

  Question: "How do I add an Environment (local / ssh) with a button, and how do we make
  the folder picker simpler?" Today Sidebar.tsx <AddProject> is one form: a free-text
  `host` input (datalist of known hosts), a path input with a `…` button that opens
  <DirBrowser> (a `..` row, a dir list, "Use this folder"), and a name input. Hosts only
  exist as a side-effect of projects; there is no way to add one on its own.

  Three variants, A–C, switchable from the floating bar (← / → keys too).
  URL keeps the choice: projects.html?variant=B (served) or projects.html#B (file://).
  The filesystem is a mock (latency: local 120ms, ssh 450ms; host `nas` fails to connect).
  The panel on the right prints the full state after every action.

  OUTCOME (settled): variant B — the Open project dialog (environments left, Folder Picker
  right, "New environment" in the same list), plus the shared pieces: the Project Icon with
  its Appearance-panel override, and rename (double-click or the panel title). It shipped in
  src/OpenProject.tsx, src/icons.tsx, Sidebar.tsx and Appearance.tsx, with
  src-tauri/src/envs.rs (ssh_hosts, scan_logos) and icon_* in bg.rs. A and C were not picked;
  F2 rename was dropped because plain F2 belongs to the terminal.

  A  Inline   — environments are sidebar sections; `+` on a section header opens a
                type-to-filter folder list right there. `+ Environment` at the bottom.
  B  Dialog   — one "Open project" dialog: environments on the left (with `+ New`),
                breadcrumb + folder list on the right, git repos marked, Open at the bottom.
  C  Palette  — no browsing by default: one input (Alt+O) that fuzzy-matches git repos
                found on each environment and recent folders; type `~/` or `/` to complete
                a path instead. Environments are chips in the palette, `+ ssh` among them.

  Project icon (all variants): on add, the folder is scanned for logo files (favicon.svg/ico,
  logo.*, icon.png, src-tauri/icons/*, public/*, assets/*) and the first one becomes the icon,
  the way T3 Code does it. The Appearance panel (◐ on the row, or click the icon) gets an
  Icon section above Accent that overrides it: Auto (first logo found), any other logo
  found in the project, a glyph, the plain letter, or an uploaded image. The rest of the
  panel (Accent, Background, Dim) mirrors src/Appearance.tsx.

  Rename: the panel title is the name field (Enter / blur saves, Esc reverts, empty = folder
  name), and double-click a name in the sidebar or F2 on the active project renames in place.
  Safe for terminals: sessionName() uses the project id, not the name.
  Landing: Project gets `icon?: { kind: "logo", file } | { kind: "glyph", g } | { kind: "letter" }
  | { kind: "image" }` (undefined = auto); an uploaded icon is stored like the background
  image (icon_save / icon_delete next to bg_save in Rust).

  Shared idea for "simpler folder picker", in every variant: one path field that is also
  the browser — typing filters the current folder, Enter/→ on a match goes in, Backspace
  on an empty segment goes up, clicking a breadcrumb jumps. The name is the folder name
  (rename later), so the name input is gone.

  How it would land (not built here):
  - state.ts gets `environments: { id, kind: "local"|"ssh", name, dest }[]`, persisted in
    state.json; Project.host keeps the ssh dest so terms.ts / files.ts are untouched.
    Hosts are seeded from existing projects on load.
  - "Test connection" = list_dirs(host, "~") already in the Rust side; ssh aliases come
    from a new `ssh_hosts` command reading ~/.ssh/config (Host lines without wildcards).
  - C additionally needs a `find_repos(host, root, depth)` command (find -name .git -maxdepth 4).
-->

    --bad: #f7768e; --violet: #bb9af7; --scrim: rgba(8,9,11,.6); --shadow: rgba(0,0,0,.8);

}
* { box-sizing: border-box; }
html, body { height: 100%; }

input:focus { border-color: var(--accent); }

/* ---- app shell ---- */
.app { display: grid; height: 100%; grid-template-columns: 240px 1fr 300px; grid-template-rows: 34px 1fr; grid-template-areas: "side top state" "side canvas state"; }

.project { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; cursor: pointer; }
.project:hover { background: var(--hover); }
.project.active { background: color-mix(in srgb, var(--pa) 16%, var(--raised)); }
.project .swatch { width: 8px; height: 8px; border-radius: 2px; background: var(--pa); flex: none; }

/* ---- env header (shared look) ---- */

.row:hover { background: var(--hover); }

.row .use { margin-left: auto; opacity: 0; color: var(--accent); font-size: 11.5px; padding: 0 6px; border-radius: 3px; }
.row:hover .use, .row.sel .use { opacity: 1; }
.row .use:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }

.pfoot .here { flex: 1; min-width: 0; font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.btn { padding: 4px 10px; border-radius: 4px; background: var(--raised); font-size: 12px; white-space: nowrap; }

.keys { color: var(--muted); font-size: 11px; display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 8px 6px; }

/* ---- shared env form ---- */
.envform { display: flex; flex-direction: column; gap: 7px; }

.frow { display: flex; gap: 6px; }
.frow .btn { flex: 1; padding: 5px; }

function fsOf(dest) { return FS[dest] ?? (dest === "nas" ? null : { home: "/home/user", tree: { projects: { demo: { ...G } } } }); }
function norm(env, p) {
  const fs = fsOf(env.dest); if (!fs) return p;
  if (p === "~" || p.startsWith("~/")) p = fs.home + p.slice(1);
  const out = [];
  for (const s of p.split("/")) { if (!s || s === ".") continue; if (s === "..") out.pop(); else out.push(s); }
  return "/" + out.join("/");
}
function tilde(env, p) { const h = fsOf(env.dest)?.home; return h && (p === h || p.startsWith(h + "/")) ? "~" + p.slice(h.length) : p; }
function nodeAt(fs, abs) {

  const parts = abs.split("/").filter(Boolean), hp = fs.home.split("/").filter(Boolean);
  let n = {}, cur = n;
  // Build a synthetic root containing the path to home.
  const root = {}; let r = root; hp.forEach((s, i) => { r[s] = i === hp.length - 1 ? fs.tree : {}; r = r[s]; });
  if (abs === "/") return { ...root, etc: {}, usr: {}, var: {}, tmp: {} };
  n = root;

}
/** list_dirs(host, path) with fake latency. */
function listDirs(env, path) {

    const fs = fsOf(env.dest);
    if (!fs) return fail(`ssh: connect to host ${env.dest} port 22: Connection timed out`);
    const abs = norm(env, path), n = nodeAt(fs, abs);
    if (!n) return fail(`${tilde(env, abs)}: No such directory`);
    const dirs = Object.keys(n).filter((k) => k !== ".git").sort((a, b) => (a[0] === ".") - (b[0] === ".") || a.localeCompare(b));
    ok({ path: abs, dirs: dirs.map((d) => ({ name: d, git: !!n[d][".git"] })), git: !!n[".git"] });
  }, env.kind === "local" ? 120 : 450));
}
/** find_repos(host, ~, depth 4) — for variant C. */
function findRepos(env) {
  return new Promise((ok, fail) => setTimeout(() => {
    const fs = fsOf(env.dest); if (!fs) return fail("unreachable");
    const out = [];
    const walk = (n, p, d) => { for (const k of Object.keys(n)) { if (k === ".git") continue; const q = p + "/" + k; if (n[k][".git"]) out.push(q); else if (d < 4) walk(n[k], q, d + 1); } };
    walk(fs.tree, fs.home, 0); ok(out);

/* ================= shared pieces ================= */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hl = (name, q) => { if (!q) return esc(name); const i = name.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(name) : esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + q.length)) + "</mark>" + esc(name.slice(i + q.length)); };
function fuzzy(s, q) { if (!q) return 1; s = s.toLowerCase(); q = q.toLowerCase(); let i = 0, score = 0; for (const c of s) { if (c === q[i]) { i++; score++; } if (i === q.length) break; } return i === q.length ? score + (s.includes(q) ? 10 : 0) : 0; }

/**
 * The simpler folder picker: one field is both path and filter.
 *   type   → filters the current folder ("cod" matches code)
 *   Enter  → go into the highlighted folder; Enter on empty filter = use current folder
 *   ⌘/Ctrl+Enter → use the highlighted folder directly
 *   Backspace on empty → up one level;  "~/x/y" or "/x" typed → jump there
 */
class Picker {
  constructor(env, start, onUse, opts = {}) { this.env = env; this.onUse = onUse; this.opts = opts; this.q = ""; this.sel = 0; this.list = null; this.err = ""; this.loading = true; queueMicrotask(() => this.go(start ?? "~")); }
  async go(path) {
    this.loading = true; this.err = ""; this.q = ""; this.sel = 0; render();
    try { this.list = await listDirs(this.env, path); this.env.status = "ok"; }
    catch (e) { this.err = String(e); if (/Connection/.test(e)) this.env.status = "off"; }
    this.loading = false; render(); focusQ();
  }
  shown() { const d = this.list?.dirs ?? []; const q = this.q; return q ? d.filter((x) => x.name.toLowerCase().includes(q.toLowerCase())).sort((a, b) => b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) : d.filter((x) => x.name[0] !== "."); }
  into(name) { return this.list.path.replace(/\/$/, "") + "/" + name; }
  key(e) {
    const s = this.shown();
    if (e.key === "ArrowDown") { this.sel = Math.min(this.sel + 1, s.length - 1); e.preventDefault(); render(); }
    else if (e.key === "ArrowUp") { this.sel = Math.max(this.sel - 1, 0); e.preventDefault(); render(); }
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && s[this.sel]) { e.preventDefault(); this.onUse(this.into(s[this.sel].name)); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (/^[~/]/.test(this.q)) this.go(this.q);
      else if (this.q && s[this.sel]) this.go(this.into(s[this.sel].name));
      else if (!this.q && this.list) this.onUse(this.list.path);
    }
    else if ((e.key === "ArrowRight" || e.key === "Tab") && s[this.sel] && !/^[~/]/.test(this.q)) { e.preventDefault(); this.go(this.into(s[this.sel].name)); }
    else if (e.key === "Backspace" && !this.q && this.list) { e.preventDefault(); this.go(this.list.path + "/.."); }
  }
  input(v) { this.q = v; this.sel = 0; render(); }
  html(id, max) {
    const s = this.shown(), here = this.list?.path ?? "";
    const parts = here.split("/").filter(Boolean);
    const crumbs = `<div class="crumbs"><button data-pk="${id}" data-go="/">/</button>` + parts.map((p, i) =>
      `<button data-pk="${id}" data-go="/${parts.slice(0, i + 1).join("/")}">${esc(p)}</button>${i < parts.length - 1 ? '<span class="sl">/</span>' : ""}`).join("") + `</div>`;
    const rows = this.err ? `<div class="note err">${esc(this.err)}</div>`
      : !this.list ? `<div class="note">Connecting to ${esc(this.env.dest)}…</div>`
      : !s.length ? `<div class="note">${this.q ? `No folder matches “${esc(this.q)}”${/^[~/]/.test(this.q) ? " — Enter jumps to that path" : ""}` : "No subfolders"}</div>`
      : s.map((d, i) => `<div class="row ${i === this.sel ? "sel" : ""}" data-pk="${id}" data-into="${esc(d.name)}"><span class="ic">▸</span><span class="nm">${hl(d.name, this.q)}</span>${d.git ? '<span class="git">git</span>' : ""}<button class="use" data-pk="${id}" data-use="${esc(d.name)}">open</button></div>`).join("");
    return `<div class="picker" style="${this.loading ? "opacity:.7" : ""}">${crumbs}
      ${this.opts.bare ? "" : `<input class="q" data-pk="${id}" placeholder="filter, or type ~/path" value="${esc(this.q)}" autocomplete="off" spellcheck="false">`}
      <div class="list" style="${max ? `max-height:${max}px` : ""}">${rows}</div>
      ${this.opts.foot === false ? "" : `<div class="pfoot"><span class="here" title="${esc(here)}"><bdi>${esc(tilde(this.env, here))}</bdi></span><button class="btn pri" data-pk="${id}" data-usehere ${this.list ? "" : "disabled"}>Open here</button></div>`}
      ${this.opts.bare ? "" : `<div class="keys"><span><kbd>↵</kbd> in / open here</span><span><kbd>⌫</kbd> up</span><span><kbd>Ctrl ↵</kbd> open highlighted</span></div>`}</div>`;
  }
}

/** Environment form, shared by all variants. Has its own test-connection step. */

    this.test = { s: "wait", msg: `ssh ${dest} …` }; render();

    </div>`;

function resolveIcon(p) {

  if (i?.type === "image" && iconImages[p.id]) return { kind: "image", html: `<img src="${iconImages[p.id]}" alt="">`, label: "Uploaded image", sub: "icon.png", auto: false };

      const s = pk.shown();
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { pk.key(e); return; }
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && s[pk.sel]) { e.preventDefault(); pk.onUse(pk.into(s[pk.sel].name)); return; }
      if (e.key === "Enter") { e.preventDefault(); if (pk.q && s[pk.sel]) { u.q = tilde(pk.env, pk.into(s[pk.sel].name)) + "/"; cPathPicker(u.q); render(); } else if (pk.list) pk.onUse(pk.list.path); return; }
      if (e.key === "ArrowRight" && s[pk.sel] && t.selectionStart === t.value.length) { e.preventDefault(); u.q = tilde(pk.env, pk.into(s[pk.sel].name)) + "/"; cPathPicker(u.q); render(); return; }
      return;
    }
    const items = paletteItems().items ?? [];
    if (e.key === "ArrowDown") { u.sel = Math.min(u.sel + 1, items.length - 1); e.preventDefault(); render(); }
    else if (e.key === "ArrowUp") { u.sel = Math.max(u.sel - 1, 0); e.preventDefault(); render(); }
    else if (e.key === "Enter" && items[u.sel]) { e.preventDefault(); addProject(items[u.sel].e.id, items[u.sel].path); st.ui = {}; render(); }
    return;
  }
  if (t.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});

/* ================= switcher ================= */
function setVariant(v, push) {
  if (!ORDER.includes(v)) v = "A";
  st.v = v; st.ui = {};
  if (push) try {
    if (location.protocol === "file:") location.hash = v;
    else { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); }
  } catch {}
  render();
}
const cycle = (d) => setVariant(ORDER[(ORDER.indexOf(st.v) + d + ORDER.length) % ORDER.length], true);
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("rst").onclick = () => { const v = st.v; reset(); for (const k in repoCache) delete repoCache[k]; st.v = v; render(); };

reset();
const initial = (new URLSearchParams(location.search).get("variant") || location.hash.replace(/^#/, "") || "A").toUpperCase();
setVariant(initial, false);
addEventListener("hashchange", () => setVariant((location.hash.replace(/^#/, "") || "A").toUpperCase(), false));
</script>
