<title>tri-code Canvas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: the app's sidebar stays; a slim toolbar (workspaces, layout, the tab strip of open windows) sits over an auto-tiled area of terminal, browser, issues, files, file, git and agents windows (main + stack, grid or mono); the gap is set from the status line. The issues window renders the project's .dev/ (Plane + Sentry), the files pi-todos and dev-hub share. Agent signals (working, needs you, done, error, reported by claude and pi over OSC 7501) badge the project icon, workspace number, tab and title bar, and play the project's sound with a desktop notification. Follows the system light/dark setting; the dark palette is the one in src/styles.css. */
:root {
  /* light palette (system default when the OS is in light mode) */
  --bg: #fbfbfc;
  --panel: #f1f2f5;
  --canvas: #e6e8ed;
  --line: #d9dce3;
  --hover: #e6e8ee;
  --raised: #dfe2ea;
  --text: #23262d;
  --muted: #6b7080;
  --warn: #9a6400;
  --ok: #3d7a1c;
  --bad: #c4314b;
  --violet: #7c4dbd;
  --scrim: rgba(30, 34, 44, .35);
  --shadow: rgba(30, 34, 44, .22);
  --dusk-a: #e6e1f6; --dusk-b: #eedcef; --dusk-c: #f6dfdc; --dusk-d: #f3ece6;
  /* the project's chosen accent; darkened in light mode so borders and text keep contrast */
  --accent-raw: #7aa2f7;
  --accent: color-mix(in oklab, var(--accent-raw) 76%, #000);
  /* web content inside browser windows */
  --page-bg: #ffffff;
  --page-fg: #1b1e24;
  --page-muted: #6b7280;
  --page-line: #e3e6eb;
  --page-link: #2f6fdf;
  --ui: system-ui, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f12; --panel: #15171c; --canvas: #0b0c0f; --line: #24272f; --hover: #1c1f26; --raised: #232733;
    --text: #d6d8de; --muted: #7d828f; --warn: #e0af68; --ok: #9ece6a; --bad: #f7768e; --violet: #bb9af7;
    --scrim: rgba(8, 9, 11, .6); --shadow: rgba(0, 0, 0, .8);
    --dusk-a: #1b1533; --dusk-b: #2c1a3c; --dusk-c: #43202f; --dusk-d: #16100f;
    --accent: var(--accent-raw);
    --page-bg: #f7f8fa;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f12; --panel: #15171c; --canvas: #0b0c0f; --line: #24272f; --hover: #1c1f26; --raised: #232733;
  --text: #d6d8de; --muted: #7d828f; --warn: #e0af68; --ok: #9ece6a; --bad: #f7768e; --violet: #bb9af7;
  --scrim: rgba(8, 9, 11, .6); --shadow: rgba(0, 0, 0, .8);
  --dusk-a: #1b1533; --dusk-b: #2c1a3c; --dusk-c: #43202f; --dusk-d: #16100f;
  --accent: var(--accent-raw);
  --page-bg: #f7f8fa;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.4 var(--ui); overflow: hidden; user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
kbd {
  font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 3px; color: var(--text); background: var(--panel);
}

.app {
  display: grid; height: 100%;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 34px 1fr 26px;
  transition: grid-template-columns 160ms ease;
  grid-template-areas: "side top" "side canvas" "side status";
}

/* Sidebar: full list, or collapsed to a rail of project chips */
.app.rail { grid-template-columns: 48px 1fr; }
aside {
  grid-area: side; background: var(--panel); border-right: 1px solid var(--line);
  padding: 4px 6px 8px; overflow-y: auto; overflow-x: hidden; min-width: 0;
}
.side-head { display: flex; align-items: center; justify-content: space-between; height: 26px; padding-left: 8px; }
.side-head span { font-size: 12px; font-weight: 600; color: var(--muted); }
.collapse { width: 24px; height: 24px; border-radius: 4px; color: var(--muted); flex: none; font-size: 14px; line-height: 1; }
.collapse:hover { background: var(--hover); color: var(--text); }
.rail:not(.peek) aside { padding-inline: 6px; }
.rail:not(.peek) .side-head { justify-content: center; padding: 0; }
.rail:not(.peek) .side-head span, .rail:not(.peek) .project .name, .rail:not(.peek) .project .count, .rail:not(.peek) .project .gear { display: none; }
/* collapsed, an Environment header is just its icon over a divider: the same box as the open header,
   the divider drawn in its top margin, so nothing below moves when the rail opens */
.rail:not(.peek) aside h2 { justify-content: center; margin-inline: 6px; position: relative; }
.rail:not(.peek) aside h2::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; border-top: 1px solid var(--line); }
.rail:not(.peek) aside h2 :is(.en, .eh, .env-edit) { display: none; }
.rail:not(.peek) .project { justify-content: center; padding: 4px 0; position: relative; }
.rail:not(.peek) aside h2 .ic { width: auto; margin: 0; }
.rail:not(.peek) .project.active { background: none; }
.rail:not(.peek) .project.active .swatch { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--pa); }
.rail:not(.peek) .project .badge { position: absolute; top: 2px; right: 3px; box-shadow: 0 0 0 2px var(--panel); }
.rail:not(.peek) .add { padding: 6px 0; justify-content: center; }
.rail:not(.peek) .add .label { display: none; }
/* Peek (like Edge's vertical tabs): hovering the rail floats the full list over the canvas without reflowing the tiles; leaving folds it back. The pin keeps it open. */
.rail aside { position: relative; z-index: 20; width: 48px; transition: width 140ms ease, box-shadow 140ms ease; }
.rail.peek aside { width: 220px; box-shadow: 12px 0 32px -12px var(--shadow); }
@media (prefers-reduced-motion: reduce) { .rail aside { transition: none; } }
aside h2 {
  margin: 10px 4px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--muted);
  display: flex; align-items: center; gap: 6px; height: 18px; min-width: 0;
}
/* Environment header: its lucide icon, its name, and the host underneath it when the name differs */
.ic { display: inline-grid; place-items: center; flex: none; }
.ic svg { width: 14px; height: 14px; stroke-width: 2; display: block; }
/* the Environment icon sits in a tile-wide box so it lines up over the project tiles, collapsed or not */
aside h2 > .ic { width: 28px; margin-right: 2px; }
.ic-miss { font: 600 9px var(--mono); }
aside h2 .en { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
aside h2 .eh { font: 400 10px var(--mono); text-transform: none; letter-spacing: 0; opacity: .7; white-space: nowrap; }
.env-edit { margin-left: auto; width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--muted); opacity: 0; flex: none; }
aside h2:hover .env-edit, .env-edit:focus-visible, .env-edit[aria-expanded="true"] { opacity: 1; }
.env-edit:hover { background: var(--hover); color: var(--text); }
.env-edit svg { width: 12px; height: 12px; }
/* Environment editor: a label and an icon; the host itself never changes here */
.pop.envpop { width: 316px; }
.envpop .namerow { display: flex; gap: 6px; }
.envpop .namerow .fname { flex: 1; min-width: 0; }
.envpop .cur { width: 30px; height: 30px; border-radius: 6px; background: var(--raised); color: var(--text); display: grid; place-items: center; flex: none; }
.envpop .cur svg { width: 16px; height: 16px; }
.envpop .hostnote { font-size: 11px; color: var(--muted); line-height: 1.45; }
.envpop .hostnote code { font: 11px var(--mono); color: var(--text); }
.igrid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; max-height: 196px; overflow-y: auto; }
.igrid button { display: grid; place-items: center; height: 30px; border-radius: 5px; color: var(--text); }
.igrid button:hover { background: var(--hover); }
.igrid button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--raised)); box-shadow: inset 0 0 0 1px var(--accent); }
.igrid .ic svg { width: 16px; height: 16px; }
.igrid .none { grid-column: 1 / -1; padding: 10px 4px; color: var(--muted); font-size: 12px; }
.envpop .imeta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.envpop .imeta code { font: 11px var(--mono); color: var(--text); }
.project { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 6px; cursor: pointer; }
.project:hover { background: var(--hover); }
.project.active { background: color-mix(in srgb, var(--pa) 16%, var(--raised)); }
/* one tile size whether the sidebar is open or collapsed, so peeking never resizes it */
.project .swatch {
  width: 28px; height: 28px; border-radius: 7px; flex: none; display: grid; place-items: center;
  background: color-mix(in srgb, var(--pa) 22%, var(--raised)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pa) 45%, transparent);
}
.project .swatch b { font-size: 13px; font-weight: 600; color: var(--text); text-transform: uppercase; }
.project.active .swatch { background: var(--pa); }
.project.active .swatch b { color: #111; }
.project .gear { opacity: 0; color: var(--muted); padding: 0 2px; font-size: 12px; }
.project:hover .gear, .project .gear:focus-visible { opacity: 1; }
.project .gear:hover { color: var(--text); }
.project .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project .count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.badge { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.add { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; white-space: nowrap; padding: 6px 4px; text-align: left; color: var(--muted); border-radius: 6px; }
.add .glyph { width: 28px; flex: none; text-align: center; font-size: 15px; line-height: 18px; }
.add:hover { background: var(--hover); color: var(--text); }

/* Toolbar */
.top {
  grid-area: top; display: flex; align-items: stretch; background: var(--panel);
  border-bottom: 1px solid var(--line); min-width: 0; overflow-x: auto; scrollbar-width: none;
}
/* Tab strip: the workspace's windows as quiet underline tabs, then `+` for the New window menu (src/tabs.tsx) */
.tabs { display: flex; align-items: stretch; flex: none; }
.tabs .tab, .tabs .tab-add { display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--muted); white-space: nowrap; flex: none; box-shadow: inset 0 -2px transparent; }
.tabs .tab .glyph { font-size: 12.5px; line-height: 1; }
.tabs .tab .ic svg, .tabmenu .ic svg { width: 13px; height: 13px; }
.tabs .tab:hover, .tabs .tab-add:hover { color: var(--text); background: var(--hover); }
.tabs .tab[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.tabs .tab .att { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.tabs .tab-add { justify-content: center; width: 30px; padding: 0; font-size: 15px; }
.tabs .tab-add[aria-expanded="true"] { color: var(--text); background: var(--hover); }
.top .tool { padding: 0 10px; color: var(--muted); white-space: nowrap; flex: none; }
.top .tool:hover { color: var(--text); background: var(--hover); }
.top .tool .ic svg { width: 14px; height: 14px; }
/* New window menu (the strip's `+`): agents first, then the panels */
.tabmenu {
  position: fixed; z-index: 10000; min-width: 192px; padding: 4px; display: grid;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 18px 50px -12px var(--shadow);
}
.tabmenu .mt { padding: 5px 8px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tabmenu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border-radius: 5px; color: var(--muted); font-size: 12.5px; text-align: left; }
.tabmenu button:hover { background: var(--hover); color: var(--text); }
.tabmenu button .glyph { width: 14px; font-size: 12.5px; line-height: 1; text-align: center; }
.tabmenu button kbd { margin-left: auto; }
.tabmenu .msep { height: 1px; margin: 4px 2px; background: var(--line); }
/* The project path is the way into Go to File: click it (or Alt+T) to search the project's files or walk its folders */
.top .where {
  align-self: center; display: flex; align-items: center; gap: 6px; height: 24px; margin: 0 6px; padding: 0 8px;
  color: var(--muted); font-size: 11px; min-width: 120px; flex: 1 1 200px; max-width: 420px; margin-right: auto;
  border: 1px solid transparent; border-radius: 5px; text-align: left;
}
.top .where:hover, .top .where[aria-expanded="true"] { border-color: var(--line); background: var(--bg); color: var(--text); }
.top .where[aria-expanded="true"] { border-color: var(--accent); }
.where svg { width: 12px; height: 12px; flex: none; }
.where .wp { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: var(--mono); direction: rtl; }
.where .wp bdi { direction: ltr; }
.where kbd { font-size: 10px; padding: 0 3px; white-space: nowrap; flex: none; margin-left: auto; opacity: 0; transition: opacity 120ms; }
.where:hover kbd, .where[aria-expanded="true"] kbd { opacity: 1; }

/* Go to File: one box that both searches (fuzzy, over git ls-files) and browses (type or click into folders) */
.gtf {
  position: fixed; z-index: 10000; width: 620px; max-width: calc(100vw - 16px); display: flex; flex-direction: column;
  max-height: min(460px, calc(100vh - 60px)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 18px 50px -12px var(--shadow); overflow: hidden;
}
.gtf .gin { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.gtf .gin svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.gtf .gin input {
  flex: 1; min-width: 0; font: 13px var(--mono); color: var(--text); background: none; border: 0; outline: none; user-select: text;
}
.gtf .gin .scope { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.gcrumb { display: flex; align-items: center; gap: 2px; padding: 5px 8px; font: 11px var(--mono); color: var(--muted); border-bottom: 1px solid var(--line); overflow: hidden; white-space: nowrap; }
.gcrumb[hidden] { display: none; }
.gcrumb button { padding: 1px 4px; border-radius: 3px; color: var(--muted); }
.gcrumb button:hover { background: var(--hover); color: var(--text); }
.gcrumb button:last-child { color: var(--text); }
.gcrumb i { font-style: normal; opacity: .5; }
.glist { overflow: auto; padding: 4px; min-height: 0; flex: 1; }
.glist h5 { margin: 6px 6px 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.grow {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 26px; padding: 0 8px; border-radius: 4px; text-align: left; min-width: 0;
}
.grow:hover { background: var(--hover); }
.grow.hi { background: color-mix(in srgb, var(--accent) 15%, transparent); box-shadow: inset 2px 0 var(--accent); }
.grow .fi { width: 16px; flex: none; text-align: center; font: 600 9px var(--mono); color: var(--fc, var(--muted)); }
.grow .fn { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .fd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 11px var(--mono); direction: rtl; text-align: left; }
.grow .fd bdi { direction: ltr; }
.grow mark { background: none; color: var(--accent); font-weight: 700; }
.grow .open { font-size: 10.5px; color: var(--muted); flex: none; }
.grow.dir .fn { font-weight: 600; }
.grow.dir .fn::after { content: "/"; color: var(--muted); font-weight: 400; }
.gnone { padding: 22px 12px; text-align: center; color: var(--muted); }
.gfoot {
  display: flex; gap: 12px; align-items: center; padding: 5px 10px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden;
}
.gfoot span { display: flex; gap: 3px; align-items: center; }
.gfoot kbd { font-size: 10px; padding: 0 3px; }
.gfoot .src { margin-left: auto; font: 10.5px var(--mono); }
/* File window: read-only view of one file, like src/FileView.tsx */
.dot.file { background: var(--violet); border-radius: 2px; }
.screen .ln { display: inline-block; width: 3ch; margin-right: 1.5ch; text-align: right; color: var(--muted); opacity: .6; }
.top .sep { width: 1px; background: var(--line); margin: 7px 6px; flex: none; }
.seg { display: flex; align-self: center; flex: none; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin: 0 4px; }
.seg button { padding: 2px 9px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.seg button svg { width: 15px; height: 15px; display: block; }
/* Gap sits in the status line's bottom-left corner, before the focused window's info */
.gapctl { display: flex; gap: 5px; align-items: center; color: var(--muted); font: 11px var(--mono); flex: none; }
.gapctl select {
  font: 11px var(--mono); color: var(--text); background: var(--bg); height: 18px;
  border: 1px solid var(--line); border-radius: 4px; padding: 0 2px; outline: none;
}

/* Canvas */
.viewport {
  grid-area: canvas; position: relative; overflow: hidden; background: var(--canvas); isolation: isolate;
}
.world { position: absolute; inset: 0; }
.bg { position: absolute; inset: 0; pointer-events: none; transition: background 200ms; }
.bg::after { content: ""; position: absolute; inset: 0; background: var(--canvas); opacity: var(--dim, 0); }

/* Project appearance panel */
.theme-btn { display: flex; align-items: center; gap: 6px; }
.theme-btn i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.pop {
  position: fixed; z-index: 10000; width: 300px; padding: 14px; display: grid; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 18px 50px -12px var(--shadow);
}
.pop .ttl { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.pop .ttl span { color: var(--muted); font-weight: 400; font-size: 12px; }
.pop h4 { margin: 6px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.swatches button { width: 22px; height: 22px; border-radius: 5px; border: 2px solid transparent; outline: 1px solid var(--line); }
.swatches button[aria-pressed="true"] { border-color: var(--panel); outline: 2px solid var(--text); }
.swatches label { position: relative; width: 22px; height: 22px; border-radius: 5px; outline: 1px dashed var(--muted); display: grid; place-items: center; color: var(--muted); cursor: pointer; font-size: 14px; }
.swatches label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.bgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.bgs button {
  height: 46px; border-radius: 5px; border: 1px solid var(--line); position: relative; overflow: hidden;
  font-size: 10px; color: var(--text); display: flex; align-items: flex-end; padding: 3px 5px; text-shadow: 0 0 3px var(--bg), 0 0 1px var(--bg);
}
.bgs button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.bgs .upload { border-style: dashed; color: var(--muted); align-items: center; justify-content: center; text-shadow: none; background: var(--bg); }
.pop .row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
.pop input[type="range"] { flex: 1; accent-color: var(--accent); }
.pop .val { font: 11px var(--mono); width: 34px; text-align: right; color: var(--text); }
.world.anim .win { transition: left 160ms ease, top 160ms ease, width 160ms ease, height 160ms ease; }

.win {
  position: absolute; display: flex; flex-direction: column;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  overflow: hidden;
}
.app.gap0 .win { border-radius: 0; }
/* Mono (carousel): the focused window is centered, its neighbours dim in the side gutters, the rest are hidden */
.win.peek { opacity: .5; filter: saturate(.5); }
.win.peek:hover { opacity: .82; }
.win.gone { display: none; }
.win[hidden] { display: none; }
.win.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.win.sig-blocked:not(.focused) { border-color: var(--warn); animation: bell 1.6s ease-in-out infinite; }
.win.sig-error:not(.focused) { border-color: var(--bad); }
.win.sig-done:not(.focused) { border-color: color-mix(in srgb, var(--ok) 70%, var(--line)); }
@keyframes bell { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); } }
.win.floating { opacity: .92; box-shadow: 0 24px 60px -16px var(--shadow) !important; transition: none !important; }
.win.drop::after {
  content: ""; position: absolute; inset: 6px; border: 2px dashed var(--accent);
  border-radius: 4px; background: color-mix(in srgb, var(--accent) 8%, transparent); pointer-events: none;
}

.bar {
  height: 28px; flex: none; display: flex; align-items: center; gap: 7px;
  padding: 0 4px 0 10px; background: var(--panel); border-bottom: 1px solid var(--line);
  cursor: grab; color: var(--muted);
}
.win.focused .bar { color: var(--text); }
.bar .kind { font-weight: 600; }
.bar .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
.spaces { display: flex; align-self: center; gap: 2px; margin: 0 4px 0 8px; flex: none; }
.spaces button {
  position: relative; width: 26px; height: 22px; border-radius: 4px; color: var(--muted);
  font: 600 11px var(--mono); border: 1px solid transparent;
}
.spaces button:hover { background: var(--hover); color: var(--text); }
.spaces button.used { color: var(--text); }
.spaces button[aria-current="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--raised)); border-color: var(--accent); color: var(--text); }
.spaces button.used::after {
  content: ""; position: absolute; left: 50%; bottom: 2px; width: 10px; height: 2px; border-radius: 1px;
  transform: translateX(-50%); background: var(--muted);
}
.spaces button[aria-current="true"]::after { background: var(--accent); }
.spaces button.att::before {
  content: ""; position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--sc, var(--warn)); box-shadow: 0 0 0 2px var(--panel);
}
.spaces button.target { background: color-mix(in srgb, var(--accent) 35%, var(--raised)); color: var(--text); outline: 2px dashed var(--accent); }
.world.enter .win { animation: wsin 160ms ease; }
@keyframes wsin { from { opacity: 0; transform: translateY(6px); } }
.bar button { width: 22px; height: 22px; border-radius: 4px; color: var(--muted); line-height: 1; flex: none; }
.bar button:hover { background: var(--hover); color: var(--text); }
/* A browser window with two or more pages: its pages as tabs in place of the title */
.ptabs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; }
.ptab {
  height: 22px; flex: 0 1 170px; min-width: 48px; display: flex; align-items: center; gap: 4px;
  padding: 0 2px 0 8px; border-radius: 4px; color: var(--muted); font-size: 12px; cursor: default;
}
.ptab:hover { background: var(--hover); }
.ptab.on { background: var(--raised); color: var(--text); }
.ptab span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .ptab button { width: 18px; height: 18px; opacity: 0; }
.ptab:hover button, .ptab.on button { opacity: 1; }
.dot.files { background: var(--accent); }
.dot.git { background: var(--violet); }
.dot.agents { background: var(--muted); border-radius: 2px; }

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.running { background: var(--ok); }
.dot.reconnecting { background: var(--warn); }
.dot.exited { background: var(--bad); }
.dot.web { background: var(--accent); border-radius: 2px; }

.screen {
  flex: 1; margin: 0; padding: 8px 10px; overflow: hidden; white-space: pre;
  font: 12.5px/17px var(--mono); color: var(--text); user-select: text;
}
.win:not(.focused) .screen, .win:not(.focused) .page { opacity: .72; }
.c-a { color: var(--accent); } .c-m { color: var(--muted); } .c-o { color: var(--ok); }
.c-w { color: var(--warn); } .c-b { color: var(--bad); } .c-v { color: var(--violet); }
.cursor { background: var(--text); color: var(--bg); }
.win:not(.focused) .cursor { background: none; outline: 1px solid var(--muted); color: inherit; }

/* Terminal links: dotted at rest, live while Ctrl is held */
.link { text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, currentColor 50%, transparent); text-underline-offset: 3px; }
body.ctrl .link:hover { color: var(--accent); text-decoration: underline solid; cursor: pointer; }

/* Browser window */
.nav {
  height: 32px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.nav button { width: 24px; height: 24px; border-radius: 4px; color: var(--muted); flex: none; }
.nav button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.nav button:disabled { opacity: .35; cursor: default; }
.url {
  flex: 1; min-width: 0; margin: 0 4px; font: 12px var(--mono); color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; outline: none; user-select: text;
}
.url:focus { border-color: var(--accent); }
/* Favourites: a star in the address field, a bar under the nav, tiles on the new-tab page. Saved per project, so every browser window in it shares them. */
.addr { flex: 1; min-width: 0; margin: 0 4px; position: relative; display: flex; }
.addr .url { margin: 0; padding-right: 26px; }
.nav .star { position: absolute; right: 1px; top: 1px; width: 22px; height: 20px; font-size: 14px; line-height: 1; }
.nav .star[aria-pressed="true"] { color: var(--warn); }
.favs {
  height: 26px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px;
  background: var(--panel); border-bottom: 1px solid var(--line); overflow: hidden;
}
.favs[hidden] { display: none; }
.fav {
  height: 20px; max-width: 150px; min-width: 30px; flex: 0 1 auto; display: flex; align-items: center; gap: 6px;
  padding: 0 8px 0 4px; border-radius: 4px; color: var(--text); font-size: 12px;
}
.fav:hover { background: var(--hover); }
.fav.on { background: var(--raised); }
.fav.over { box-shadow: inset 2px 0 0 var(--accent); }
.fav span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ico { width: 14px; height: 14px; flex: none; border-radius: 3px; display: grid; place-items: center; background: var(--c); color: #16181d; font: 700 9px var(--ui); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; min-width: 0; max-width: 560px; margin-top: 4px; }
.tile {
  min-width: 0; display: grid; justify-items: center; gap: 4px; padding: 14px 6px 10px; cursor: pointer;
  border: 1px solid var(--page-line); border-radius: 8px; background: var(--page-bg); color: var(--page-fg); font: 12px var(--ui);
}
.tile:hover { border-color: var(--page-link); }
.tile .ico { width: 30px; height: 30px; border-radius: 8px; font-size: 14px; margin-bottom: 4px; }
.tile span, .tile small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile small { font: 10px var(--mono); color: var(--page-muted); }
.pop input.fname {
  font: 13px var(--ui); color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 5px 8px; outline: none; user-select: text;
}
.pop input.fname:focus { border-color: var(--accent); }
.pop .furl { font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.pop .acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
.pop .acts button { padding: 4px 12px; border-radius: 4px; border: 1px solid var(--line); color: var(--text); }
.pop .acts button:hover { background: var(--hover); }
.pop .acts .primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.page { flex: 1; overflow: auto; background: var(--page-bg); color: var(--page-fg); user-select: text; transition: opacity 120ms; }
.page.loading { opacity: .35; }
.doc { padding: 22px 26px; max-width: 70ch; font: 14px/1.55 var(--ui); }
.doc .crumb { font: 12px var(--mono); color: var(--page-muted); }
.doc h1 { font-size: 22px; margin: 6px 0 10px; text-wrap: balance; }
.doc h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--page-muted); margin: 20px 0 8px; }
.doc p { margin: 0 0 12px; }
.doc a { color: var(--page-link); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.doc code { font: 12px var(--mono); background: var(--page-line); padding: 1px 5px; border-radius: 3px; }
.sk { height: 9px; border-radius: 5px; background: var(--page-line); margin: 0 0 9px; }
.start { padding: 28px; display: grid; gap: 10px; color: var(--page-muted); font: 13px var(--ui); }
.start b { color: var(--page-fg); font-size: 15px; }
.start a { color: var(--page-link); cursor: pointer; font-family: var(--mono); font-size: 12px; }
/* localhost:1420, which is tri-code itself */
.mock { height: 100%; min-height: 180px; display: grid; grid-template-columns: 22% 1fr; background: var(--bg); }
.mock-side { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; display: grid; align-content: start; gap: 6px; }
.mock-side i { height: 8px; border-radius: 3px; background: var(--raised); }
.mock-side i.on { background: color-mix(in srgb, var(--accent) 40%, var(--raised)); }
.mock-main { display: grid; grid-template-rows: 18px 1fr; min-width: 0; }
.mock-top { background: var(--panel); border-bottom: 1px solid var(--line); }
.mock-tiles { display: grid; grid-template-columns: 1.3fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; }
.mock-tiles b { border: 1px solid var(--line); border-radius: 3px; background: var(--canvas); }
.mock-tiles b:first-child { grid-row: span 2; border-color: var(--accent); }

/* Issues window: a view of the project's .dev/ (config.json, issues.json, plane-states.json),
   the same files pi-todos and dev-hub read and write. Plain HTML, not a terminal, so plain keys drive it. */
.dot.plane { width: 6px; height: 6px; border-radius: 1px; background: var(--violet); transform: rotate(45deg); }
.dot.plane.syncing { animation: syncp .7s ease-in-out infinite alternate; }
@keyframes syncp { to { opacity: .2; } }
.iss { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; container-type: inline-size; }
.itools {
  height: 32px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.itools .seg { margin: 0 4px 0 0; }
.itools .seg button { padding: 1px 8px; }
.isearch {
  flex: 1; min-width: 40px; margin: 0 4px 0 0; font: 12px var(--mono); color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; outline: none; user-select: text;
}
.isearch:focus { border-color: var(--accent); }
.ib { width: 24px; height: 24px; border-radius: 4px; color: var(--muted); flex: none; }
.ib:hover { background: var(--hover); color: var(--text); }
.ib[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.ib.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.imain { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.win:not(.focused) .imain { opacity: .8; }
.ilist {
  overflow: auto; min-height: 0; padding: 4px 0; display: grid; align-content: start;
  grid-template-columns: 24px auto minmax(0, 1fr) auto auto 1px; column-gap: 9px;
}
/* Drill-down: the list fills the window; opening an issue replaces it, Esc goes back */
.idetail { display: none; overflow: auto; min-height: 0; user-select: text; }
.iss.detail .ilist, .iss.detail .itools { display: none; }
.iss.detail .idetail { display: block; }
.dhead {
  position: sticky; top: 0; z-index: 1; height: 32px; display: flex; align-items: center; gap: 2px; padding: 0 6px;
  background: var(--panel); border-bottom: 1px solid var(--line); user-select: none;
}
.dhead .crumb { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; }
.dhead .crumb b { color: var(--text); font: 600 11.5px var(--mono); }
.dhead .pos { font: 11px var(--mono); color: var(--muted); padding: 0 4px; }
.dbody { padding: 14px 16px 18px; display: grid; gap: 4px 28px; max-width: 980px; }
.dside { min-width: 0; }
@container (min-width: 640px) {
  /* a wide window lays the issue page out in two columns: what it is (and the thread), then what you can do */
  .dbody { grid-template-columns: minmax(0, 1fr) 230px; padding: 18px 22px 22px; }
  .dside { grid-row: span 2; align-self: start; position: sticky; top: 50px; border-left: 1px solid var(--line); padding-left: 20px; }
}
/* Comments: cached in .dev/plane/comments/<issue>.json, images in .dev/plane/assets/ */
.dcomments { min-width: 0; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.dcomments h4 { margin: 0 0 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cmt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 9px 0; }
.cmt + .cmt { border-top: 1px dashed color-mix(in srgb, var(--line) 70%, transparent); }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 10.5px var(--ui); color: #fff; background: var(--avc); }
.cmeta { display: flex; gap: 6px; align-items: baseline; font-size: 12px; color: var(--muted); }
.cmeta b { color: var(--text); font-weight: 600; }
.ctext { margin: 2px 0 0; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.cimgs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cimgs button { padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--canvas); cursor: zoom-in; }
.cimgs button:hover { border-color: var(--accent); }
.cimgs img { display: block; height: 116px; max-width: min(100%, 240px); object-fit: cover; }
.cnone { padding: 6px 0 2px; color: var(--muted); font-size: 12px; }
.ccompose { margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.ccompose:focus-within { border-color: var(--accent); }
.ccompose.over { border-style: dashed; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--bg)); }
.ccompose textarea {
  display: block; width: 100%; min-height: 62px; resize: vertical; border: 0; background: none; outline: none;
  padding: 8px 10px; color: var(--text); font: 13px/1.45 var(--ui); user-select: text;
}
.cattach { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 10px 10px; }
.cattach span { position: relative; }
.cattach img { display: block; height: 54px; max-width: 120px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.cattach button {
  position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--raised); border: 1px solid var(--line); color: var(--text); font-size: 11px; line-height: 1;
}
.cbar { display: flex; align-items: center; gap: 6px; padding: 4px 6px 5px 4px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.cbar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbar .post { padding: 3px 12px; border-radius: 5px; background: var(--accent); color: var(--bg); font-weight: 600; font-size: 12px; flex: none; }
.cbar .post:disabled { opacity: .4; cursor: default; }
.cc { margin-left: 7px; color: var(--muted); font-size: 11px; }
.cc::before {
  content: ""; display: inline-block; width: 8px; height: 6px; margin-right: 3px; vertical-align: 0;
  border: 1.5px solid currentColor; border-radius: 2px 2px 2px 0;
}
.ilight { position: absolute; inset: 0; z-index: 8; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 12px; background: rgba(6, 7, 9, .86); }
.ilight .lwrap { min-height: 0; display: grid; place-items: center; }
.ilight img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 20px 60px -20px #000; }
.ilight .cap { display: flex; gap: 10px; align-items: center; justify-content: center; padding-top: 10px; color: #c9ccd3; font-size: 12px; }
.ilight .cap button { color: #c9ccd3; width: 26px; height: 24px; border-radius: 4px; }
.ilight .cap button:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.ilight kbd { background: #1c1f26; border-color: #333844; color: #c9ccd3; }
.irow {
  grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center;
  column-gap: 9px; height: 26px; cursor: default;
}
/* subgrid rows: edge spacing comes from the outer tracks, not padding */
.irow > :first-child { justify-self: end; }
.irow:hover { background: var(--hover); }
.irow.sel { background: color-mix(in srgb, var(--accent) 15%, transparent); box-shadow: inset 2px 0 var(--accent); }
.win:not(.focused) .irow.sel { background: var(--hover); box-shadow: inset 2px 0 var(--muted); }
.sid { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
.irow .t { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.irow .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .t .lb, .irow .t .cc, .lbmore { flex: none; }
/* Labels: Plane's label colour as a dot, the name in a quiet outline chip */
.lb {
  display: inline-flex; align-items: center; gap: 4px; height: 17px; padding: 0 6px;
  border: 1px solid var(--line); border-radius: 9px; font-size: 10.5px; color: var(--muted); white-space: nowrap;
}
.lb i { width: 6px; height: 6px; border-radius: 50%; background: var(--lc); }
.lbmore { font-size: 10.5px; color: var(--muted); }
@container (max-width: 520px) { .irow .t .lb, .irow .t .lbmore { display: none; } }
.dlabels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -2px 0 12px; }
.dlabels .lb { height: 19px; font-size: 11px; color: var(--text); }
.lblbtn { height: 19px; padding: 0 8px; border: 1px dashed var(--line); border-radius: 10px; font-size: 11px; color: var(--muted); }
.lblbtn:hover, .lblbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--text); }
.ldrop .lb { color: var(--text); }
.ldrop .lfoot { padding: 6px 6px 2px; font-size: 10.5px; color: var(--muted); }
.irow.closed .tt { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.irow .pill { justify-self: start; }
.idate { font: 11px var(--mono); color: var(--muted); white-space: nowrap; text-align: right; }
.idate.late { color: var(--bad); }
.irun { font: 600 11px var(--mono); color: var(--accent); white-space: nowrap; text-align: right; }
@container (max-width: 400px) {
  .ilist { grid-template-columns: 24px auto minmax(0, 1fr) auto 1px; }
  .irow .idate, .irow .irun { display: none; }
}
/* State Pill: Plane's own State Hex, black or white text by luminance (as in pi-todos) */
.pill { font: 600 10.5px/17px var(--ui); padding: 0 6px; border-radius: 3px; white-space: nowrap; }
.pill.ghost { background: var(--raised); color: var(--muted); }
/* Priority: signal bars in the priority colour; urgent is a filled square */
.pri { display: inline-flex; align-items: flex-end; gap: 1px; width: 12px; height: 11px; }
.pri b { width: 3px; border-radius: 1px; background: var(--line); }
.pri b:nth-child(1) { height: 4px; } .pri b:nth-child(2) { height: 7px; } .pri b:nth-child(3) { height: 11px; }
.pri b.on { background: color-mix(in oklab, var(--pc) 82%, var(--text)); }
.pri.none { align-items: center; } .pri.none b { height: 2px !important; }
.pri.urgent { align-items: center; justify-content: center; border-radius: 3px; background: var(--pc); color: #fff; font: 800 9px/1 var(--ui); }
.lvl { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); margin-left: 2px; }
.inew { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 2px 10px 6px 12px; }
.inew .pri { flex: none; }
.inew input {
  flex: 1; font: 12.5px var(--ui); color: var(--text); background: var(--bg); border: 1px solid var(--accent);
  border-radius: 4px; padding: 4px 8px; outline: none; user-select: text;
}
.iempty { grid-column: 1 / -1; padding: 28px 16px; color: var(--muted); text-align: center; }
.idetail h3 { margin: 4px 0 8px; font-size: 14px; line-height: 1.35; text-wrap: balance; }
.ichips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.ichips span { display: inline-flex; gap: 5px; align-items: center; }
.idetail p { margin: 0 0 12px; line-height: 1.5; }
.idetail dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 12px; font-size: 12px; }
.idetail dt { color: var(--muted); }
.idetail dd { margin: 0; font: 11.5px var(--mono); }
.iacts { display: grid; gap: 1px; margin: 0 -6px; }
.iacts button { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; text-align: left; }
.iacts button:hover { background: var(--hover); }
.iacts button:disabled { opacity: .45; cursor: default; background: none; }
.iacts kbd { min-width: 18px; text-align: center; }
.iacts button.on { color: var(--accent); }
.iback { height: 24px; padding: 0 8px 0 6px; border-radius: 4px; color: var(--muted); font-size: 12px; flex: none; }
.iback:hover { background: var(--hover); color: var(--text); }
.ihint {
  height: 22px; flex: none; display: flex; gap: 10px; align-items: center; padding: 0 10px;
  border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden;
}
.ihint span { display: flex; gap: 3px; align-items: center; }
.ihint kbd { font-size: 10px; padding: 0 3px; }
.ihint .src { margin-left: auto; font: 10.5px var(--mono); }
/* The State Pill is the control: it opens the State Dropdown anchored under itself */
.pillbtn {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 5px 2px 2px; margin-left: -3px;
  border: 1px solid transparent; border-radius: 5px;
}
.pillbtn:hover, .pillbtn[aria-expanded="true"] { border-color: var(--line); background: var(--hover); }
.pillbtn .caret { font-size: 9px; color: var(--muted); }

.idrop {

}

.idrop button:hover { background: var(--hover); }

.isetup { flex: 1; overflow: auto; display: grid; place-items: center; padding: 16px; }

.isetup label { display: grid; gap: 3px; font-size: 11px; color: var(--muted); }
.isetup input {
  font: 12px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 5px 8px; outline: none; user-select: text;
}

.isetup .files { font: 10.5px/1.7 var(--mono); color: var(--muted); }
/* Sidebar: active Plane issues per State, in Plane's colours (the pi-todos widget) */
.minibar { display: flex; gap: 1px; width: 26px; height: 4px; border-radius: 2px; overflow: hidden; flex: none; }
.minibar i { height: 100%; }
.rail:not(.peek) .project .minibar { display: none; }
/* Toolbar: the project's In Progress issues, next to Appearance. One click drills into the issue */
.prog { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; margin: 0 4px; overflow: hidden; }
.prog button {
  display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 260px; height: 22px; padding: 0 8px 0 6px;
  border: 1px solid var(--line); border-radius: 11px; background: var(--bg); color: var(--text); font-size: 12px; flex: 0 1 auto;
}
.prog button:hover { border-color: var(--accent); }
.prog button.run { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.prog .sd { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.prog .sid { color: var(--muted); font-size: 11px; }
.prog .pt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog .pe { font: 600 11px var(--mono); color: var(--accent); white-space: nowrap; }
.prog .pe .rec { margin-right: 4px; }
.prog .more { color: var(--muted); padding: 0 8px; flex: none; }
/* only the first chip (the timed or most urgent issue) spends room on its title; the rest show the ID, title on hover */
.prog button + button { flex: none; }
.prog button + button .pt { display: none; }
@media (max-width: 1100px) { .prog .pt { display: none; } }
.status .timer { flex: none; color: var(--muted); font: 11px var(--mono); }
.status .timer b { color: var(--accent); font-weight: 600; }
/* Running Entry marker */
.rec { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; animation: syncp 1s ease-in-out infinite alternate; }

.split { position: absolute; cursor: ew-resize; z-index: 1; }
.split::after {
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
  background: var(--accent); border-radius: 1px; opacity: 0; transition: opacity 120ms;
}
.split:hover::after, .split.active::after { opacity: .8; }

.tip {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3;
  font: 600 13px var(--mono); padding: 6px 10px; border-radius: 5px;
  background: var(--raised); border: 1px solid var(--accent); color: var(--text);
  pointer-events: none; opacity: 0; transition: opacity 120ms; white-space: nowrap;
}
.tip span { color: var(--muted); font-weight: 400; }
.win.sizing .tip { opacity: 1; }

.empty {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 10px;
  text-align: center; color: var(--muted); pointer-events: none;
}
.empty div { display: flex; gap: 6px; justify-content: center; align-items: center; }

/* Status line */
.status {
  grid-area: status; display: flex; align-items: center; gap: 14px; padding: 0 10px;
  background: var(--panel); border-top: 1px solid var(--line); color: var(--muted);
  font-size: 11px; white-space: nowrap; overflow: hidden;
}
.status .focus { color: var(--text); font: 11px var(--mono); font-variant-numeric: tabular-nums; }

.status .ver { flex: none; color: var(--muted); font: 11px var(--mono); padding: 1px 4px; border-radius: 4px; }
.status .ver:hover { background: var(--hover); color: var(--text); }
/* Claude plan usage: the 5-hour session and weekly limits (src/Usage.tsx) */
.usage { flex: none; display: flex; align-items: center; gap: 12px; height: 100%; padding: 0 2px; color: var(--muted); font-variant-numeric: tabular-nums; }

.usage .who { color: var(--text); font-weight: 600; }
.usage .meter { display: flex; align-items: center; gap: 5px; }
.usage .meter i {
  width: 44px; height: 4px; border-radius: 2px; background: var(--raised);
  background-image: linear-gradient(var(--lvl), var(--lvl)); background-size: var(--pct) 100%; background-repeat: no-repeat;
}

.usage .meter em { font: normal 11px var(--mono); }
.usage .meter[data-level="ok"] { --lvl: var(--ok); }
.usage .meter[data-level="warn"] { --lvl: var(--warn); }
.usage .meter[data-level="bad"] { --lvl: var(--bad); }

.fic.dir::after { content: ""; position: absolute; left: 2px; top: 2px; width: 6px; height: 3px; background: color-mix(in srgb, var(--muted) 55%, transparent); border-radius: 1px 1px 0 0; }
.code { flex: 1; min-height: 0; margin: 0; overflow: auto; padding: 8px 0 14px; font: 12px/17px var(--mono); user-select: text; }

}

.g-finding .loc { font: 11px var(--mono); color: var(--accent); word-break: break-all; }

/* ---------- agents window: src/AgentsPanel.tsx (design/agents.html, variant B) ---------- */

.ag-new { border-top: 1px solid var(--line); padding: 4px 0; }
.ag-grip { display: grid; place-items: center; height: 28px; color: var(--muted); cursor: grab; opacity: .6; }

.ag-hk { justify-self: start; display: inline-flex; align-items: center; gap: 3px; height: 26px; padding: 0 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.ag-hk:hover { border-color: var(--accent); }

.ag-note { margin: 14px 0 0; max-width: 62ch; color: var(--muted); font-size: 11.5px; line-height: 1.55; }

/* ---------- select element: drawn over the page by src-tauri/src/pick.js ---------- */
.pick { position: absolute; inset: 0; z-index: 2; cursor: crosshair; }
.pick .pbox { position: absolute; pointer-events: none; border: 1.5px solid var(--accent); border-radius: 2px; background: color-mix(in srgb, var(--accent) 10%, transparent); }
.pick .pbox.sel { border-width: 2px; background: color-mix(in srgb, var(--accent) 16%, transparent); }
.pick .pbox b { position: absolute; left: -2px; top: -19px; padding: 1px 5px; border-radius: 3px 3px 3px 0; background: var(--accent); color: #fff; font: 600 10px/15px var(--mono); white-space: nowrap; }
.pick .pcard { position: absolute; left: 50%; transform: translateX(-50%); cursor: default; color: var(--text); background: var(--bg); border: 1px solid var(--line); box-shadow: 0 14px 40px -12px var(--shadow); }
.pick .pbar { top: 8px; display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; }

.pick button { font: inherit; border: 1px solid transparent; border-radius: 5px; height: 24px; padding: 0 9px; font-size: 12px; }

.pick .composer { bottom: 12px; width: min(380px, calc(100% - 24px)); display: none; gap: 6px; padding: 8px; border-radius: 10px; font-size: 13px; }

.pick .pchips { display: flex; flex-wrap: wrap; gap: 4px; }

.pick .pchip i { font-style: normal; font-weight: 700; color: var(--accent); }
.pick .pchip button { height: 16px; width: 16px; padding: 0; color: var(--muted); }
.pick textarea { font: 13px/1.4 var(--ui); color: inherit; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 4px 0; resize: none; outline: none; user-select: text; }
.pick textarea:focus { border-bottom-color: var(--accent); }
.pick .prow { display: flex; align-items: center; gap: 6px; }
.pick .to { flex: 1; color: var(--muted); font-size: 11.5px; }
.pick .to b { color: var(--text); }
.pick .prow button { border-color: var(--line); }
.pick .prow .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.nav .pickbtn[aria-pressed="true"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.nav .ic svg { width: 14px; height: 14px; }
.mock-page { padding: 18px 22px; display: grid; gap: 10px; align-content: start; }
.mock-page [data-el] { border-radius: 4px; }

/* ---------- command palette: the Go to File box, centered under the toolbar (src/Palette.tsx) ---------- */
.gtf.pal { width: 640px; }
.prow-c .pg { flex: none; width: 14px; text-align: center; color: var(--muted); font-size: 12px; display: grid; place-items: center; }
.prow-c .pg svg { width: 14px; height: 14px; }
.prow-c.hi .pg { color: var(--accent); }
.prow-c .fn { max-width: 55%; }
.prow-c .ph { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11.5px; }
.prow-c .ph b { font-weight: 600; }
.prow-c .pk { flex: none; display: flex; gap: 3px; }
.prow-c .pk kbd { font-size: 10px; padding: 0 4px; }

/* ---------- dialogs: About (version + changelog), Open project (Alt+O) ---------- */
.dialog-scrim { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--scrim); }
.about { width: min(620px, calc(100% - 32px)); max-height: calc(100% - 32px); display: flex; flex-direction: column; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 30px 80px -20px var(--shadow); }
.about header, .open-dlg header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.about header .ver { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
.about header button, .open-dlg header button { width: 24px; height: 24px; border-radius: 4px; color: var(--muted); font-size: 15px; }
.about header button:hover, .open-dlg header button:hover { background: var(--hover); color: var(--text); }
.about .upd { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.about .upd span { flex: 1; min-width: 0; }
.about .upd button { flex: none; padding: 4px 12px; border-radius: 4px; border: 1px solid var(--line); color: var(--text); }
.about .upd button:hover { background: var(--hover); }
.about .md { max-width: none; padding: 14px 18px 20px; overflow: auto; }
.about .md h2 { font-size: 13px; font-family: var(--mono); }
.open-dlg { width: min(760px, calc(100% - 32px)); height: min(520px, calc(100% - 32px)); display: grid; grid-template-columns: 200px 1fr; grid-template-rows: auto 1fr; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 30px 80px -20px var(--shadow); }
.open-dlg header { grid-column: 1 / -1; }
.open-dlg nav { display: flex; flex-direction: column; gap: 1px; padding: 8px 6px; border-right: 1px solid var(--line); overflow-y: auto; }
.open-dlg nav .mt { padding: 4px 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.open-dlg .env { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 5px; text-align: left; }
.open-dlg .env:hover { background: var(--hover); }
.open-dlg .env[aria-pressed="true"] { background: var(--raised); }
.open-dlg .env .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.open-dlg .env .kind { font: 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }
.open-dlg .env.new { margin-top: 4px; color: var(--accent); }
.open-dlg .pane { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 10px; }
.open-dlg .recent { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.open-dlg .chip { font: 11px var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.open-dlg .chip:hover { color: var(--text); border-color: var(--accent); }
.picker { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.picker .crumbs { display: flex; flex-wrap: wrap; align-items: center; padding: 5px 7px 0; font: 11.5px var(--mono); color: var(--muted); }
.picker .crumbs button { padding: 1px 2px; border-radius: 3px; color: var(--muted); }
.picker .crumbs button:hover { background: var(--hover); color: var(--text); }
.picker .crumbs button:last-of-type { color: var(--text); }
.picker .q { margin: 5px 6px; font: 12px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; outline: none; user-select: text; }
.picker .q:focus { border-color: var(--accent); }
.picker .list { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); font-size: 12.5px; }
.picker .row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.picker .row:hover { background: var(--hover); }
.picker .row.sel { background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
.picker .row .pi { width: 12px; color: var(--muted); flex: none; }
.picker .row .git { font: 10px var(--mono); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); border-radius: 3px; padding: 0 3px; }
.picker .row .use { margin-left: auto; padding: 0 6px; border-radius: 3px; color: var(--accent); font-size: 11.5px; visibility: hidden; }
.picker .row.sel .use { visibility: visible; }
.picker .pfoot { display: flex; align-items: center; gap: 6px; padding: 6px; border-top: 1px solid var(--line); }
.picker .pfoot .here { flex: 1; min-width: 0; font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker .pfoot .primary { padding: 4px 12px; border-radius: 4px; background: var(--accent); color: var(--bg); }

/* Appearance: project name and icon (a logo found in the project, a glyph or the letter) */
.pop .ttl .name { flex: 1; width: 0; margin-left: -6px; padding: 2px 6px; font: inherit; font-weight: 600; color: var(--text); background: none; border: 1px solid transparent; border-radius: 4px; outline: none; user-select: text; }
.pop .ttl .name:hover { border-color: var(--line); }
.pop .ttl .name:focus { border-color: var(--accent); background: var(--bg); }
.pop h4.with-action { display: flex; justify-content: space-between; align-items: baseline; }
.pop h4.with-action button { color: var(--accent); font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.pop .icon-now { display: flex; align-items: center; gap: 10px; }
.pop .icon-now .itile { width: 40px; height: 40px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 18px; font-weight: 600; background: color-mix(in srgb, var(--pa) 22%, var(--raised)); }
.pop .icon-now .what { flex: 1; min-width: 0; font-size: 12px; }
.pop .icon-now .what b { display: block; }
.pop .icon-now code, .pop .logos code { display: block; font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .icon-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.pop .icon-tabs button { padding: 3px 8px; font-size: 12px; color: var(--muted); box-shadow: inset 0 -2px transparent; }
.pop .icon-tabs button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
.pop .logos { display: flex; flex-direction: column; gap: 2px; max-height: 150px; overflow-y: auto; }
.pop .logos button { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; border: 1px solid transparent; text-align: left; }
.pop .logos button > b, .pop .logos button > i { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 4px; font-style: normal; font-size: 11px; }
.pop .logos button code { flex: 1; min-width: 0; }
.pop .logos .tag { font-size: 10px; color: var(--muted); }
.pop .glyphs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
.pop .glyphs button { height: 28px; border-radius: 5px; border: 1px solid transparent; font-size: 14px; }
.pop .logos button:hover, .pop .glyphs button:hover { background: var(--hover); }
.pop .logos button[aria-pressed="true"], .pop .glyphs button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--bg)); }
/* sidebar: remove a project, add to an Environment, the actions under the list */
.project .x { opacity: 0; color: var(--muted); padding: 0 2px; }
.project:hover .x { opacity: 1; }
.project .x:hover { color: var(--text); }
.rail:not(.peek) .project .x { display: none; }
.project .swatch i { font-style: normal; }
.side-actions { margin-top: 10px; }
.side-actions .add { margin-top: 0; }
.add kbd { margin-left: auto; font-size: 10px; color: var(--muted); }
.rail:not(.peek) .add kbd { display: none; }
.project .swatch img { width: 100%; height: 100%; object-fit: contain; border-radius: 7px; }
.env-edit + .env-edit { margin-left: 0; font-size: 14px; line-height: 1; }
.page { position: relative; }
.pick .pbox.below b { top: auto; bottom: -19px; border-radius: 0 3px 3px 3px; }
.ptab + .ptab, .ptabs { user-select: none; }

/* ---------- agent signals: claude and pi report working / blocked / done / error over OSC 7501 (src/terms.ts) ---------- */
.s-working { --sc: var(--accent); } .s-blocked { --sc: var(--warn); } .s-done { --sc: var(--ok); } .s-error { --sc: var(--bad); }
.sg { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); flex: none; }
.sg.s-working { width: 9px; height: 9px; background: none; border: 1.5px solid var(--sc); border-right-color: transparent; animation: spin .9s linear infinite; }
/* title bar: the agent's state after its name; quiet once seen */
.ast { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 7px; border-radius: 9px; font: 600 10.5px var(--ui); color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, transparent); white-space: nowrap; cursor: default; }
.ast.seen { background: none; color: var(--muted); font-weight: 400; padding: 0 2px; }
.ast .sg { width: 6px; height: 6px; }
.ast .sg.s-working { width: 8px; height: 8px; }
/* sidebar: one badge on the project icon, the loudest signal among its windows (a count when several share it) */
.project .swatch { position: relative; }
.swatch .sb {
  position: absolute; top: -4px; right: -4px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px;
  background: var(--sc); box-shadow: 0 0 0 2px var(--panel); color: var(--bg); font: 700 9px/14px var(--ui); text-align: center;
}
.swatch .sb:empty { min-width: 0; width: 10px; height: 10px; padding: 0; }
.swatch .sb.s-blocked { animation: sbp 1.6s ease-in-out infinite; }
@keyframes sbp { 50% { box-shadow: 0 0 0 2px var(--panel), 0 0 0 5px color-mix(in srgb, var(--sc) 28%, transparent); } }
/* desktop notification (the OS draws the real one; this stands in for it) */
.notes { position: fixed; top: 44px; right: 12px; z-index: 9997; display: grid; gap: 8px; width: min(340px, calc(100% - 24px)); pointer-events: none; }
.note {
  pointer-events: auto; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; column-gap: 10px; align-items: start; text-align: left;
  padding: 10px 8px 10px 10px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); color: var(--text);
  box-shadow: 0 18px 40px -14px var(--shadow); animation: notein 220ms ease;
}
.note:hover { border-color: var(--accent); }
.note .nic { grid-row: span 3; position: relative; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--pa) 24%, var(--panel)); }
.note .nic b { font-size: 15px; text-transform: uppercase; } .note .nic i { font-style: normal; font-size: 15px; }
.note .nic img { width: 100%; height: 100%; border-radius: 8px; }
.note .nic .sb { position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 0 2px var(--raised); }
.note .napp { font-size: 11px; color: var(--muted); }
.note .nt { grid-column: 2; font-weight: 600; }
.note .nb { grid-column: 2; color: var(--muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.note .nx { grid-column: 3; grid-row: 1; width: 20px; height: 20px; border-radius: 4px; color: var(--muted); display: grid; place-items: center; }
.note .nx:hover { background: var(--hover); color: var(--text); }
@keyframes notein { from { opacity: 0; transform: translateX(18px); } }
/* status line: what the agents are doing across every project (click: the next one that needs you), and the bell for app-wide alerts */
.status .sigs { flex: none; display: flex; align-items: center; gap: 10px; padding: 1px 6px; border-radius: 4px; font: 11px var(--mono); }
.status .sigs:hover { background: var(--hover); }
.status .sigs > span { display: flex; align-items: center; gap: 5px; color: var(--sc); }
.status .sigs > .s-working { color: var(--muted); }
.status .bellbtn { flex: none; display: grid; place-items: center; width: 24px; height: 20px; border-radius: 4px; color: var(--muted); }
.status .bellbtn:hover { background: var(--hover); color: var(--text); }
.status .bellbtn .ic svg { width: 13px; height: 13px; }
.status .bellbtn.dnd { color: var(--warn); }
/* Appearance › Signals and the bell's popover: a sound per signal, when to alert, desktop notifications */
.pop { max-height: calc(100vh - 16px); overflow-y: auto; }
.pop .seg.ptop { margin: 0; }
.pop .seg.ptop button { flex: 1; padding: 3px 6px; }
.sgrid { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; font-size: 12px; }
.sgrid .lbl { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.sgrid select { min-width: 0; height: 26px; padding: 0 4px; font: 12px var(--ui); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; outline: none; }
.sgrid select:focus { border-color: var(--accent); }
.sgrid .play { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); display: grid; place-items: center; }
.sgrid .play:hover { background: var(--hover); color: var(--text); }
.sgrid .play svg { width: 12px; height: 12px; }
.pop .chk { display: flex; align-items: center; gap: 7px; font-size: 12px; }
.pop .chk input { margin: 0; accent-color: var(--accent); }
.pop .snote { margin: 2px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
.pop .snote code { font: 11px var(--mono); color: var(--text); }

/* Help + toast */
.help {
  position: absolute; inset: 0; display: grid; place-items: center; z-index: 9999;
  background: var(--scrim);
}
.help .card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 18px 20px; width: min(580px, calc(100% - 32px)); max-height: calc(100% - 32px); overflow: auto;
}
.help h3 { margin: 0 0 4px; font-size: 14px; }
.help p { margin: 0 0 14px; color: var(--muted); max-width: 60ch; }
.help h4 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.help dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; align-items: center; }
.help dt { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.help dd { margin: 0; }
.toast {

const CURSOR = '<span class="cursor"> </span>';

/* ---------- agent signals ----------
   claude and pi report their state with the Program Status Protocol (OSC 7501). Each sends `ESC ] 7501 ; ? ST` at
   startup and reports only once the terminal echoes it back, so src/terms.ts answers the probe, then turns each
   report into a badge, a sound and a desktop notification. It travels in the pty, so ssh and shpool carry it; tmux drops it. */
const SIG_RANK = { blocked: 3, error: 2, done: 1, working: 0 };
const SIG_TEXT = { working: "working", blocked: "needs you", done: "done", error: "error" };
/** What a window signals now: blocked until answered, done / error until seen, working while it runs. A shell's bell counts as blocked. */
function sigOf(w) {
  const a = w.agent;
  if (!a) return w.attention ? "blocked" : null;
  if (a.state === "blocked" || a.state === "working") return a.state;
  return (a.state === "done" || a.state === "error") && !a.seen ? a.state : null;
}
/** The loudest signal among some windows. `working` counts only where asked (tab strip yes; project icon and workspace number no). */
function topSig(wins, withWorking) {
  let best = null;
  for (const w of wins) {
    const s = sigOf(w);
    if (s && (withWorking || s !== "working") && (!best || SIG_RANK[s] > SIG_RANK[best])) best = s;
  }

/* ---------- window operations ---------- */
function focus(id) {

function neighbor(dx, dy) {
  const f = focused();

  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  let best = null, bs = Infinity;
  for (const w of vis()) {
    if (w === f || w.w <= 0) continue;
    const vx = w.x + w.w / 2 - cx, vy = w.y + w.h / 2 - cy;
    const along = vx * dx + vy * dy, across = Math.abs(dx ? vy : vx);

}

}

function newWin(kind) {

    : W(kind, kind in S ? kind : "shell", at);

/** Alt+Enter: another terminal like the focused one, else a shell. */

function closeWin(w) {

/* ---------- pointer: drag to swap, drag the split ---------- */
function startDrag(e, w) {
  if (e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  world.classList.remove("anim");
  const start = toLocal(e.clientX, e.clientY), o = { x: w.x, y: w.y };
  const el = els.get(w.id), tgt = e.currentTarget;
  let drop = null, target = null;
  tgt.setPointerCapture(e.pointerId);
  el.classList.add("floating");
  const move = (ev) => {
    const p = toLocal(ev.clientX, ev.clientY);
    w.x = o.x + p.x - start.x; w.y = o.y + p.y - start.y;
    const t = vis().find((x) => x !== w && p.x > x.x && p.x < x.x + x.w && p.y > x.y && p.y < x.y + x.h) ?? null;
    if (t !== drop) { drop && els.get(drop.id).classList.remove("drop"); drop = t; drop && els.get(drop.id).classList.add("drop"); }
    const sb = document.elementFromPoint(ev.clientX, ev.clientY)?.closest("#spaces button");
    target = sb && +sb.dataset.ws !== cur.ws ? +sb.dataset.ws : null;
    $("spaces").querySelectorAll("button").forEach((b) => b.classList.toggle("target", +b.dataset.ws === target));
    renderWin(w);
  };
  const up = () => {
    el.classList.remove("floating");
    tgt.removeEventListener("pointermove", move); tgt.removeEventListener("pointerup", up);
    if (target !== null) { drop && els.get(drop.id).classList.remove("drop"); return sendTo(w, target); }
    if (drop) { els.get(drop.id).classList.remove("drop"); swap(w, drop); }
    relayout(drop ? `swap with ${drop.kind}` : "");
  };

  tgt.addEventListener("pointerup", up);
}
split.addEventListener("pointerdown", (e) => {
  e.preventDefault(); e.stopPropagation();
  split.setPointerCapture(e.pointerId); split.classList.add("active");
  world.classList.remove("anim");
  const move = (ev) => {
    const p = toLocal(ev.clientX, ev.clientY), aw = vpSize().w - 2 * gap;
    sp().ratio = Math.min(0.8, Math.max(0.2, (p.x - gap - gap / 2) / (aw - gap)));

  split.addEventListener("pointermove", move); split.addEventListener("pointerup", up);
});

/* ---------- hotkeys ---------- */
const DIRS = { KeyH: [-1, 0], ArrowLeft: [-1, 0], KeyL: [1, 0], ArrowRight: [1, 0], KeyK: [0, -1], ArrowUp: [0, -1], KeyJ: [0, 1], ArrowDown: [0, 1] };
const GAPS = [0, 4, 8, 12, 16, 24, 32];
window.addEventListener("keydown", (e) => {
  if (e.code === "Escape" && $("pop")) return closeTheme();
  if (e.code === "Escape" && $("tabmenu")) return closeTabMenu();
  if (e.code === "Escape" && $("gtf")) return closeGtf();
  if (e.code === "Escape" && $("about")) return $("about").remove();
  if (e.code === "Escape" && $("opendlg")) return $("opendlg").remove();
  if (e.code === "Escape" && document.querySelector(".help")) return toggleHelp(false);
  const w = focused();
  if (e.code === "Escape" && w?.pick) return endPick(w);
  if (w?.kind === "files" && !e.altKey && !e.ctrlKey && !e.metaKey && !e.target.closest?.("input, textarea") && filesKey(w, e)) return e.preventDefault();
  if (e.ctrlKey && !e.altKey && e.code === "KeyL" && w?.kind === "browser") {
    e.preventDefault();
    const u = els.get(w.id).querySelector(".url"); u.focus(); u.select();
    return;
  }
  if (e.ctrlKey && !e.altKey && e.code === "KeyD" && w?.kind === "browser") { e.preventDefault(); return starPage(w); }
  // the issues panel is not a terminal, so it takes plain keys while focused
  if (w?.kind === "issues" && !e.altKey && !e.ctrlKey && !e.metaKey && issueKey(w, e)) return e.preventDefault();
  if (!e.altKey) return;
  // an agent's own hotkey (set in the agents window) opens one
  const hk = AGENTS.find((a) => a.hotkey && a.hotkey.code === e.code && !!a.hotkey.shift === e.shiftKey && !!a.hotkey.ctrl === e.ctrlKey);
  if (hk) { e.preventDefault(); return newWin(hk.id); }
  const d = DIRS[e.code];
  let handled = true;
  if (d && e.ctrlKey && w) d[0] ? nudgeSplit(w, d[0]) : flash("stack windows share height equally");
  else if (d && e.shiftKey && w) swapToward(w, ...d);
  else if (d) { const n = neighbor(...d); n ? focus(n.id) : flash("no window that way"); }
  else if (e.code === "Enter") newTermLike();
  else if (e.code === "KeyB") newWin("browser");
  else if (e.code === "KeyI") newWin("issues");
  else if (e.code === "KeyE") newWin("files");
  else if (e.code === "KeyC" && !e.ctrlKey) newWin("git");
  else if (e.code === "Semicolon") newWin("agents");
  else if (e.code === "KeyX") togglePal();
  else if (e.code === "KeyU") nextSignal();
  else if (e.code === "KeyO") openProject();
  else if (e.code === "KeyT") toggleGtf();
  else if (e.code === "KeyQ" && w) closeWin(w);
  else if (e.code === "KeyF" && w) toggleMax(w);
  else if (e.code === "KeyM" && w) promote(w);
  else if (e.code === "KeyG") cycleLayout();
  else if (e.code === "Comma" || e.code === "Period") {
    const i = GAPS.indexOf(gap) + (e.code === "Period" ? 1 : -1);
    setGap(GAPS[Math.min(GAPS.length - 1, Math.max(0, i))]);
  }
  else if (/^Digit[1-4]$/.test(e.code)) { const i = +e.code.slice(5) - 1; e.shiftKey ? (w ? sendTo(w, i) : flash("no window to send")) : goSpace(i); }

  else if (e.code === "BracketLeft" || e.code === "BracketRight") {

});

$("gap").onchange = (e) => setGap(+e.target.value);
$("helpBtn").onclick = () => toggleHelp();
$("themeBtn").onclick = () => $("pop") ? closeTheme() : openTheme($("themeBtn"));

render();
</script>
