<title>tri-code · browser new-tab prototype</title>
<!--
  PROTOTYPE — throwaway. Not imported by the app; open this file directly in a browser
  (or visit /design/browser-tabs.html on the dev server).

  Question: "Where does a page go when the browser window asks for a new one?" Today a
  browser Window is one native webview (src/browsers.ts) and nothing handles a page's own
  new-window requests: Ctrl+click / middle-click on a link, target=_blank, window.open().
  Ctrl+click in a *terminal* already works: it navigates the last-used browser Window of the
  project (openUrlInProject), or adds one.

  Four variants, A–D, switchable from the floating bar (also ← / → when no field is focused).
  URL keeps the choice: browser-tabs.html?variant=B (served) or browser-tabs.html#B (file://).
  Every variant is live: click, Ctrl+click (or middle-click) and the "↗ new tab" links in the
  mock pages, Ctrl+click the links in the claude window, and try "Sign in with GitHub".

  OUTCOME (settled): variant B, tabs in the title bar. It shipped in src/Canvas.tsx (.ptabs), with
  pages in state.ts (Tab.pages / Tab.page), one webview per page in src/browsers.ts, and the
  new-window handling in src-tauri/src/browser.rs (on_new_window + LINK_SCRIPT). A terminal's
  Ctrl+click now adds a page instead of replacing the shown one. Select element is not built yet.

  A  New Windows        every new page is its own canvas Window, after the opener
  B  Tabs in the bar    a Window holds pages; its title bar becomes the page tabs (>1 page)
  C  Page stack         a Window holds pages, no tab row: a "2/3 ▾" counter + list
  D  Peek split         new pages open in a side pane of the same Window; "⤢" promotes it

  Same in every variant:
  - Plain click navigates the page in place.
  - Ctrl+click / middle-click = "background": never steals focus or the current page.
  - target=_blank = "foreground": the new page is shown.
  - window.open() with size features (OAuth, payment) = a real popup OS window, so
    window.opener / postMessage keep working. Shown here as the floating "OS window".

  How it would land (not built here):
  - Rust: WebviewBuilder::on_new_window (tauri 2.12) gets (url, features) for target=_blank
    and window.open. Popup features → NewWindowResponse::Allow; else Deny + emit
    "browser-open" {label, url, background:false} to the frontend.
  - on_new_window cannot tell a Ctrl+click from target=_blank. An initialization_script
    catches click/auxclick with Ctrl/Meta/middle on <a href>, preventDefaults, and navigates
    to tricode-open://bg?u=…; on_navigation denies that scheme and emits background:true.
  - Linux framed mode (iframe): the page's new-window requests reach the *main* webview;
    the main window would need its own on_new_window, and cross-origin Ctrl+click in an
    iframe cannot be distinguished. Probably "open in system browser" there.
  - B/C/D change Tab.url into a list of pages per browser Tab in state.json; A needs no
    new persistence (it is just addTab(..., "browser", { url, after })).

  Select element (⌖ in the address row, every variant), modelled on T3 Code's preview picker
  (apps/desktop/src/preview/PickPreload.ts): an overlay injected *into the page*, so it draws
  over the native webview where tri-code's own HTML cannot. Click an element, Shift+click to
  add more, drag on empty space for an area; describe the change; Enter types it into the
  agent window (agentTarget, not submitted, like "send to agent"), Ctrl+Enter submits it.
  Esc leaves. "▸ what claude gets" shows the exact text.
  - Per element: page URL + title, a CSS selector, tag + text, a trimmed outerHTML, size.
    T3 also gets the React component and source file:line through react-grab; a Solid/Vue
    equivalent is a later step, so it is left out here.
  - Screenshot: the selection's union rect, cropped from a capture of the window (Tauri has
    no webview snapshot API; WebView2 CapturePreview / WKWebView takeSnapshot would need a
    plugin, or xcap on the on-screen rect). Saved as .dev/picks/<id>.png on the project's
    host (gitignored, ssh for remote) and referenced as @path, which claude and pi read.
  - Transport: the injected script cannot call Tauri IPC from a remote origin; it navigates
    to tricode-pick://… with the JSON payload and on_navigation denies + emits, the same
    trick as Ctrl+click. Text goes in as a bracketed paste so its newlines do not submit.
  - Linux framed mode cannot inject into a cross-origin iframe: no picker there.
  - Left out from T3: freehand draw, eraser, live style tweaks.
-->

<script>
/* ================= mock web ================= */
const DEV = "http://localhost:5173";
let signedIn = false;
const a = (href, text, blank) => `<a data-href="${href}"${blank ? ' class="blank" data-blank' : ""}>${text}</a>`;
const HINT = `<div class="hint">Click navigates · <kbd>Ctrl</kbd>+click or middle-click = background · ↗ links are <code>target=_blank</code></div>`;

function site(url) {
  const u = new URL(url);
  const path = u.pathname;
  if (u.origin === DEV) {
    if (path === "/") return { title: "Acme · Dashboard", html: `
      <div class="crumb">localhost:5173/</div><h1>Dashboard</h1>
      <p>${signedIn ? '<span class="ok">✓ Signed in with GitHub</span>' : `<button class="btn" data-popup="https://github.com/login/oauth/authorize">Sign in with GitHub</button> <small>(window.open popup)</small>`}</p>
      <ul>
        <li>${a(DEV + "/orders", "Orders")} · ${a(DEV + "/settings", "Settings")}</li>
        <li>${a(DEV + "/orders/1042", "Order #1042")} · ${a(DEV + "/orders/1043", "Order #1043")} · ${a(DEV + "/orders/1044", "Order #1044")}</li>
        <li>${a(DEV + "/preview/receipt-1042", "Receipt preview", true)}</li>
        <li>${a("https://docs.solidjs.com/reference/basic-reactivity/create-signal", "Solid docs: createSignal", true)}</li>
      </ul>${HINT}` };
    if (path.startsWith("/orders/")) { const n = path.split("/").pop(); return { title: `Order #${n}`, html: `
      <div class="crumb">localhost:5173${path}</div><h1>Order #${n}</h1>
      <p>3 items · €${(Number(n) % 97) + 20}.00 · paid</p>
      <ul><li>${a(DEV + "/orders", "← All orders")}</li><li>${a(DEV + "/preview/receipt-" + n, "Receipt preview", true)}</li></ul>${HINT}` }; }
    if (path === "/orders") return { title: "Orders", html: `
      <div class="crumb">localhost:5173/orders</div><h1>Orders</h1>

/* ================= variants =================

        const t = lastBrowser();
        if (t) { go(cur(t), url); S.focus = t.id; touch(t); return `terminal → navigate ${t.id} (today's behaviour)`; }

/* ================= select element ================= */

  if (dragged) return void (dragged = false);
  if (!doc.contains(el) || el === doc) return;
  const path = pathOf(el, doc);
  act(() => {
    const has = S.pick.sel.findIndex((t) => t.path === path);
    if (e.shiftKey) { if (has >= 0) S.pick.sel.splice(has, 1); else S.pick.sel.push({ path }); }
    else S.pick.sel = [{ path }];
    return `${e.shiftKey ? "Shift+click" : "click"} → select ${nameOf(el)}`;
  });
}, true);

function event(text) { $("ev").textContent = text; }
let toastTimer;
function act(fn) {
  const before = S.toast;
  const ev = fn();
  if (ev) event(ev);
  if (S.toast && S.toast !== before) { clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 4000); }
  render();
}

/* ================= input ================= */
document.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); });
function onLink(e) {
  const el = e.target.closest("a[data-href], [data-popup], [data-act], [data-term]");
  if (!el) return false;
  e.preventDefault();
  const winEl = e.target.closest("[data-win]");
  const w = winEl && win(winEl.dataset.win);
  const mod = e.ctrlKey || e.metaKey || e.button === 1;

  if (el.dataset.term) {
    if (!mod) return true;
    act(() => VARIANTS[V].open(null, el.dataset.term, "term"));
    return true;
  }
  if (el.dataset.act === "authorize") {
    act(() => { signedIn = true; S.popup = null; return "popup → postMessage to opener, window.close()"; });
    return true;
  }
  if (e.target.closest("[data-popupdoc]")) { act(() => { S.popup = null; return "popup closed"; }); return true; }
  if (el.dataset.popup) {
    const r = winEl.getBoundingClientRect(), c = $("canvas").getBoundingClientRect();
    act(() => { S.popup = { url: el.dataset.popup, x: r.left - c.left + r.width / 2 - 170, y: r.top - c.top + 60 }; return "window.open(url, 'oauth', 'width=500,height=600') → popup OS window (same in every variant)"; });
    return true;
  }
  const url = el.dataset.href, fromPeek = !!e.target.closest("[data-peek]");
  if (!w) return true;
  S.focus = w.id; touch(w);
  if (mod) act(() => VARIANTS[V].open(w, url, "bg", fromPeek));
  else if (el.dataset.blank !== undefined) act(() => VARIANTS[V].open(w, url, "blank", fromPeek));
  else act(() => { go(fromPeek ? w.peek : cur(w), url); return `click → navigate ${fromPeek ? "peek" : w.id}`; });
  return true;
}

function onControl(e) {
  const strip = e.target.closest("[data-strip]");
  if (strip) return act(() => { S.focus = strip.dataset.strip; S.menu = null; touch(win(S.focus)); return `focus ${S.focus}`; });
  const b = e.target.closest("[data-a]");
  const winEl = e.target.closest("[data-win]");
  const w = winEl && win(winEl.dataset.win);
  if (w && w.kind === "browser" && S.focus !== w.id) { S.focus = w.id; touch(w); }
  if (!b) { if (S.menu && !e.target.closest(".plist")) S.menu = null; return render(); }
  const a = b.dataset.a, i = Number(b.dataset.i);
  if (a === "reset") return act(() => { reset(); return "reset"; });
  if (a === "toast") return act(() => { S.toast.run(); S.toast = null; return "toast → view"; });
  if (a === "url") return;
  e.stopPropagation();
  act(() => {
    switch (a) {
      case "back": cur(w).i--; return "back";
      case "fwd": cur(w).i++; return "forward";
      case "reload": return "reload";
      case "selmode": S.pick = S.pick?.win === w.id ? null : { win: w.id, sel: [], comment: "", show: false }; S.menu = null; return S.pick ? "select element: on" : "select element: off";
      case "pickoff": S.pick = null; return "select element: off";
      case "punsel": S.pick.sel.splice(i, 1); return "unselect";
      case "pprev": S.pick.show = !S.pick.show; return S.pick.show ? "show payload" : "hide payload";
      case "ptype": submitPick(false); return;
      case "psend": submitPick(true); return;
      case "ext": return `open ${short(pageUrl(cur(w)))} in system browser`;
      case "max": return "maximize";
      case "closew": S.wins = S.wins.filter((x) => x !== w); S.focus = S.wins.at(-1)?.id; return `close ${w.id}`;
      case "menu": S.menu = S.menu === w.id ? null : w.id; return "page list";
      case "pick": w.active = i; S.menu = null; return `show page ${i + 1}`;
      case "closep": {
        w.pages.splice(i, 1);
        if (!w.pages.length) { S.wins = S.wins.filter((x) => x !== w); S.focus = S.wins.at(-1)?.id; S.menu = null; return `last page closed → window ${w.id} closes`; }
        if (w.active >= i && w.active > 0) w.active--;
        return `close page ${i + 1}`;
      }
      case "newp": w.pages.splice(w.active + 1, 0, newPage("")); w.active++; return "new blank page";
      case "pback": w.peek.i--; return "peek back";
      case "pclose": w.peek = null; return "peek closed";
      case "pswap": { const m = cur(w); w.pages[w.active] = w.peek; w.peek = m; return "swap peek ⇆ main"; }
      case "promote": { const u = pageUrl(w.peek); w.peek = null; const n = addBrowser(w.id, u, false); return `peek → own window ${n.id}`; }
    }
  });
}

document.addEventListener("click", (e) => { if (!onLink(e)) onControl(e); });
document.addEventListener("auxclick", (e) => {
  if (e.button !== 1) return;
  const t = e.target.closest(".ptab");
  if (t && V === "B") { const w = win(e.target.closest("[data-win]").dataset.win); return act(() => { w.pages.splice(Number(t.dataset.i), 1); if (w.active >= w.pages.length) w.active = w.pages.length - 1; return "middle-click → close tab"; }); }
  onLink(e);
});
document.addEventListener("keydown", (e) => {
  document.body.classList.toggle("ctrl", e.ctrlKey || e.metaKey);
  if (e.key === "Escape" && S.pick) { e.preventDefault(); return act(() => { S.pick = null; return "select element: off"; }); }
  const typing = e.target.matches("input, textarea, [contenteditable]");
  if (e.target.matches(".url") && e.key === "Enter") {
    const w = win(e.target.closest("[data-win]").dataset.win);
    let u = e.target.value.trim(); if (u && !/^https?:/.test(u)) u = (u.startsWith("localhost") ? "http://" : "https://") + u;
    return act(() => { go(cur(w), u); return `address → navigate ${w.id}`; });
  }
  if (V === "C" && e.altKey && (e.key === "[" || e.key === "]")) {
    const w = win(S.focus); if (!w || w.kind !== "browser") return;
    e.preventDefault();
    return act(() => { w.active = (w.active + (e.key === "]" ? 1 : -1) + w.pages.length) % w.pages.length; return `Alt+${e.key} → page ${w.active + 1}`; });
  }
  if (typing || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
document.addEventListener("keyup", (e) => document.body.classList.toggle("ctrl", e.ctrlKey || e.metaKey));
window.addEventListener("blur", () => document.body.classList.remove("ctrl"));

function step(d) {
  V = KEYS[(KEYS.indexOf(V) + d + KEYS.length) % KEYS.length];
  if (location.protocol === "file:") location.hash = V;
  else { const u = new URL(location.href); u.searchParams.set("variant", V); history.replaceState(null, "", u); }
  reset();
  event(`variant ${V} · ${VARIANTS[V].name}`);
  render();
}
window.addEventListener("hashchange", () => {
  const h = location.hash.replace(/^#/, "").toUpperCase();
  if (VARIANTS[h] && h !== V) step(KEYS.indexOf(h) - KEYS.indexOf(V));
});
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);

reset();
render();
</script>
</body>
</html>
