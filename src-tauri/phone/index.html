<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The phone page of Remote Control (src-tauri/src/phone/mod.rs serves it). Plain JS, no build. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- light dark follows the phone; app.js pins it to the desktop's theme. app.css sets color-scheme per data-theme too. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1f2f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="tri-code">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link id="manifest" rel="manifest" href="/manifest.webmanifest">
<script>
  // A Home Screen app added from this page starts with the pair code, so it can pair itself.
  const code = new URLSearchParams(location.search).get("pair");
  if (code) document.getElementById("manifest").href = "/manifest.webmanifest?pair=" + encodeURIComponent(code);
  // The desktop's theme from the last visit, before the first paint (app.js keeps it current).
  try {
    const t = localStorage.getItem("tri-theme");
    if (t === "light" || t === "dark") {
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="color-scheme"]').content = t;
    }
  } catch {}
</script>
<title>tri-code</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <section id="pair" class="screen" hidden>
    <div class="pair">
      <div class="brand big"><img src="/icon.svg" alt="">tri-code</div>
      <h1>Connect to your desktop</h1>
      <div id="pair-steps"></div>
      <form id="pair-form" class="pair-form">
        <label for="pair-code">Pair code</label>
        <input id="pair-code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="ABC 123" maxlength="8">
        <button class="cta" type="submit">Pair</button>
      </form>
      <p id="pair-msg" class="msg"></p>
      <p class="dim">Get a code from tri-code: Settings › Remote › Pair a phone.</p>
    </div>
  </section>

  <!-- Home: the sidebar. On a tablet it stays on the left beside the other screens. -->
  <section id="home" class="screen" hidden>
    <header class="top">
      <h1 class="brand"><img src="/icon.svg" alt="">tri-code</h1>
      <span id="conn" class="conn">connecting</span>
    </header>
    <div id="notify" class="banner" hidden></div>
    <main id="side" class="side"></main>
  </section>

  <!-- Wide screens only: the right side before a project is picked. -->
  <section id="blank" class="screen" hidden>
    <div class="splash"><img src="/icon.svg" alt=""><p>Pick a project to see its windows.</p></div>
  </section>

  <!-- A project or Worktree: its workspaces, and their windows as on the canvas. -->
  <section id="proj" class="screen" hidden>
    <header class="top">
      <button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="pv-swatch"></span>
      <div class="mid">
        <div class="nm"><span id="pv-name"></span></div>
        <div id="pv-sub" class="pj"></div>
      </div>
      <button id="new" class="tbtn" aria-label="New window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <nav class="ws-row">
      <div id="spaces" class="spaces"></div>
      <span id="ws-info" class="info"></span>
    </nav>
    <main id="tiles" class="tiles"></main>
  </section>

  <!-- A window that isn't a terminal: Git's changes, the Editor's files, or what the others show. -->
  <section id="win" class="screen" hidden>
    <header class="top">
      <button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="wv-mark" class="mark"></span>
      <div class="mid">
        <div class="nm"><span id="wv-name"></span></div>
        <div id="wv-sub" class="pj"></div>
      </div>
    </header>
    <main id="wv-body" class="wv"></main>
  </section>

  <!-- A diff from Git, or a file from the Editor, read-only. -->
  <section id="doc" class="screen" hidden>
    <header class="top">
      <button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="mid">
        <div class="nm"><span id="dv-name"></span></div>
        <div id="dv-sub" class="pj"></div>
      </div>
    </header>
    <main id="dv-body" class="docv"></main>
  </section>

  <section id="term" class="screen" hidden>
    <header class="top">
      <button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="tv-mark" class="mark"></span>
      <div class="mid">
        <div class="nm"><span id="tv-name"></span><span id="tv-sig"></span></div>
        <div id="tv-proj" class="pj"></div>
      </div>
    </header>
    <div id="termhost" class="termhost"></div>
    <div id="keys" class="keys"></div>
    <form id="compose" class="compose">
      <input id="compose-in" placeholder="Type to the terminal…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
      <button class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7M12 19V5"/></svg>
      </button>
    </form>
  </section>

  <!-- The New window menu: a shell, the project's commands and web apps. -->
  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet">
      <div class="grab"></div>
      <h2>New window</h2>
      <p id="sheet-sub" class="dim"></p>
      <div id="sheet-list" class="sheet-list"></div>
      <p id="sheet-msg" class="msg"></p>
      <button id="sheet-cancel" type="button" class="cta ghost">Cancel</button>
    </div>
  </div>

  <script src="/xterm.js"></script>
  <script src="/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
