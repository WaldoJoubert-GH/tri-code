[package]
name = "tri-code"
version = "0.1.0"
description = "A small, fast ADE for terminal agents"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "tri_code_lib"
# Desktop only needs the rlib. `cdylib`/`staticlib` are for mobile, and the
# windows-gnu linker can't build the cdylib (>65535 exports).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
ureq = { version = "3", features = ["json", "multipart"] }
base64 = "0.22"
sha2 = "0.10"
# Remote Control (phone.rs): the phone page's server, and Web Push (push.rs).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hmac = "0.12"
aes-gcm = "0.10"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-dialog = "2"
trash = "5"
# Database Window (db/): one driver per cargo feature, so a dev build can leave one out.
# TLS stays on ring through tokio-rustls, like ureq; nothing pulls in aws-lc or OpenSSL.
rusqlite = { version = "0.41.0", features = ["bundled", "column_decltype"], optional = true }
tokio-postgres = { version = "0.7.18", optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }
mongodb = { version = "3.9.1", default-features = false, features = ["rustls-tls", "dns-resolver", "compat-3-0-0"], optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }

# Dev builds: keep link time and memory low (4 GB build machines).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Browser Profiles: password saving is only reachable through WebView2's own settings (browser.rs).
# Same versions as wry's, so the controller Tauri hands out is this crate's type.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Browser Profiles on macOS: WKWebView can't save passwords, so passwords.rs does, in the
# Keychain. Same versions as wry's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKContentWorld", "WKScriptMessage", "WKScriptMessageHandler", "WKFrameInfo", "WKSecurityOrigin"] }
security-framework = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
# No `zip`: every zip 2–4 release is yanked, and it only handles v1-style zipped
# Windows bundles and compressed AppImages, which we don't ship.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

[features]
default = ["db-pg", "db-sqlite", "db-mongo"]
db-pg = ["dep:tokio-postgres", "dep:tokio-rustls", "dep:webpki-roots", "dep:futures-util"]
db-sqlite = ["dep:rusqlite"]
db-mongo = ["dep:mongodb", "dep:futures-util"]
