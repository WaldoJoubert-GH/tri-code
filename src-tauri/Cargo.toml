[package]
name = "tri-code"
version = "0.1.0"
description = "A small, fast ADE for terminal agents"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "tri_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

# Dev builds: keep link time and memory low (4 GB build machines).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
