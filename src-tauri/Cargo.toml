[package]
name = "tri-code"
version = "0.1.0"
description = "A small, fast ADE for terminal agents"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "tri_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
ureq = { version = "3", features = ["json", "multipart"] }
base64 = "0.22"
sha2 = "0.10"
# Remote Control (phone.rs): the phone page's server, and Web Push (push.rs).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["macros", "net", "sync"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hmac = "0.12"
aes-gcm = "0.10"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Dev builds: keep link time and memory low (4 GB build machines).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
# No `zip`: every zip 2–4 release is yanked, and it only handles v1-style zipped
# Windows bundles and compressed AppImages, which we don't ship.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
